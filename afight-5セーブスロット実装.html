        const enemyCanEnter = (tp, tl) => {
          if (repairLocked) return 'BLOCKED';
          if ((e.lockMoveTurns || 0) > 0) return 'BLOCKED'; // 移動封鎖を受けている
          // 飛行中は障害物も木も飛び越えられる(プレイヤーと同じルール)
          if ((e.height || 0) >= 2) return 'OK';
          const actual = getTerrain(tp, tl);
          if (isTreeTerrain(actual) && !hasRevealed(revealedE, `${tp}-${tl}`)) return 'UNKNOWN_TREE';
          const eff = getEffectiveTerrain(tp, tl, revealedE);
          if (eff === 'WALL' || actual === 'TREE_HIGH') return 'BLOCKED';
          return 'OK';
        };

        // --- アーキタイプごとの行動指針(仕様書4-3節の拡張) ---
        // 従来は全アーキタイプが同じ判定順で動いていたため「数値が違うだけ」だったが、
        // 型ごとに間合いの取り方・防御の頻度・射線の意識を変えて個性を出す。
        // NOTE: 将来的に敵もAP制・武器持ち(=プレイヤーと同じルール)へ移行する場合も、
        //       この「型ごとの狙い」はそのまま指針として流用できる想定。
        const archetypeProfile = {
          // 常に殴りにいく。防御はほとんどしない
          ATTACKER: { preferredDist: 1, defendThreshold: 0.2, defendChance: 0.3, laneFirst: false, laneAlignChance: 0.85 },
          // 前に出て粘る。早めに防御を選ぶ
          TANK:     { preferredDist: 1, defendThreshold: 0.5, defendChance: 0.5, laneFirst: false, laneAlignChance: 0.85 },
          // 距離を保って削る。近づかれたら離れる
          EVASION:  { preferredDist: 3, defendThreshold: 0.3, defendChance: 0.3, laneFirst: false, laneAlignChance: 0.5 },
          // 射線を作ることを最優先する
          AIM:      { preferredDist: 2, defendThreshold: 0.3, defendChance: 0.3, laneFirst: true,  laneAlignChance: 1.0 },
          // 空戦型:飛行を維持して上空から撃ち下ろす。高度差ぶん射程が伸びる
          AIRBORNE: { preferredDist: 3, defendThreshold: 0.3, defendChance: 0.3, laneFirst: false, laneAlignChance: 0.7 },
          // 強襲型:空から最短距離で詰めて殴る。障害物も木も無視して直進できる
          ASSAULT:  { preferredDist: 1, defendThreshold: 0.2, defendChance: 0.2, laneFirst: false, laneAlignChance: 0.9 },
        }[e.archetype] || { preferredDist: 1, defendThreshold: 0.3, defendChance: 0.5, laneFirst: false, laneAlignChance: 0.7 };

        // --- 段階3:飛行の判断(空戦型・強襲型) ---
        // canFlyの型は、飛べる状況なら積極的に飛ぶ。飛行中は障害物・木を無視でき、
        // 高度差で射程も伸びる。ただし残ターン制限があるため飛びっぱなしにはならない。
        const canFlyArch = !!(ENEMY_ARCHETYPES[e.archetype] || {}).canFly;
        const isFlying = (e.height || 0) >= 2;
        // 飛行中は残ターンを消化する。尽きたら強制着地。
        if (isFlying) {
          e.flightTurnsLeft = (e.flightTurnsLeft || 0) - 1;
          if (e.flightTurnsLeft <= 0) {
            e.height = getTerrainHeight(getTerrain(e.pos, e.lane));
            e.flightTurnsLeft = null;
            newState.logs.push(`> 敵の飛行エネルギーが切れ、強制着地した！`);
          }
        }
        // 離陸判断:飛べる型で、地上にいて、まだ相手と距離がある時に飛び立つ
        if (canFlyArch && (e.height || 0) < 2 && (e.flightTurnsLeft === null || e.flightTurnsLeft === undefined) && !e.stunned && (e.stunTurns || 0) <= 0) {
          const wantsToFly = e.archetype === 'ASSAULT'
            ? eDistX > 1                       // 強襲型:離れていれば飛んで一気に詰める
            : eDistX <= archetypeProfile.preferredDist + 1;  // 空戦型:射程圏に入ったら上空へ
          if (wantsToFly && Math.random() < 0.7) {
            e.height = 2;
            e.flightTurnsLeft = e.maxFlightTurns || 4;
            action = `飛行システムを起動！ 上空へ舞い上がった！(飛行可能:${e.flightTurnsLeft}ターン)`;
            newState.logs.push(`> 敵は ${action}`);
            return; // 離陸で1手番を使う
          }
        }

        // 一斉発射の後隙(攻撃できない)中は、棒立ちせず距離を取って身を守る
        const wantsRetreat = cannotAttack || (eDistX < archetypeProfile.preferredDist && archetypeProfile.preferredDist > 1 && e.archetype !== 'ASSAULT');
        // 回避型は間合いを保てている時でも、レーンをずらして的を絞らせない立ち回りをする
        const wantsJuke = e.archetype === 'EVASION' && !cannotAttack && eDistX >= archetypeProfile.preferredDist && Math.random() < 0.5;

        // 共通の移動処理。dir=+1で相手へ近づき、-1で離れる
        const tryEnemyStep = (targetPos, targetLane, successMsg) => {
          if (targetPos < 1 || targetPos > getFieldCols() || targetLane < 1 || targetLane > getFieldLanes()) return null;
          if (targetPos === p.pos && targetLane === p.lane) return null;
          const entry = enemyCanEnter(targetPos, targetLane);
          if (entry === 'UNKNOWN_TREE') {
            addRevealed(revealedE, `${targetPos}-${targetLane}`);
            return `木に接近して確かめた(敵は木の正体を把握した)`;
          }
          if (entry !== 'OK') return null;
          const flying = (e.height || 0) >= 2;
          // 重力異常:敵は「1手番=AP1」固定で動くため、プレイヤーのようにAP2を
          // 消費させることができない。代わりに「余分に1手番を消費する」形で表現する。
          // (追加消費のぶん、そのターンに動ける回数が実質半分になる)
          if ((e.gravityTurns || 0) > 0 && !flying) {
            if (e.ap > 0) e.ap -= 1;  // 移動そのもののAPは呼び出し側で引かれるので、ここでは追加分
            else return `重力に押さえつけられて動けない`;
          }
          // 飛行中は水面の影響を受けない(プレイヤーと同じルール)
          const riverInvolved = !flying && Math.max(getMoveCostMultiplier(getTerrain(e.pos, e.lane)), getMoveCostMultiplier(getTerrain(targetPos, targetLane))) > 1;
          if (riverInvolved && Math.random() < 0.5) return `川に足を取られ動きしきれなかった`;
          e.pos = targetPos; e.lane = targetLane;
          // 飛行中は高度2を維持する。地上にいる時だけ地形の高さを反映する
          if (!flying) {
            e.height = getTerrainHeight(getTerrain(e.pos, e.lane));
            revealAdjacentTrees(e.pos, e.lane, revealedE);
          }
          return flying ? `上空から ${successMsg}` : successMsg;
        };

        // 照準型はレーン合わせを最優先。それ以外は「離れたい/近づきたい」を先に判定する
        const laneMisaligned = eDistY > 0;
        if (archetypeProfile.laneFirst && laneMisaligned) {
          const tLane = e.lane + (p.lane > e.lane ? 1 : -1);
          action = tryEnemyStep(e.pos, tLane, `射線を通すためレーンを合わせた`) || `射線を作ろうとしたが動けなかった`;
        } else if (wantsRetreat) {
          // 回避型が近づかれた時 / 一斉発射の後隙中:間合いを離す
          const away = e.pos + (p.pos > e.pos ? -1 : 1);
          const msg = cannotAttack ? `再装填しながら距離を取った` : `間合いを取り直した`;
          let moved = tryEnemyStep(away, e.lane, msg);
          if (!moved) {
            // 後ろが詰まっている場合はレーンを変えて回り込む(壁際での膠着を避ける)
            const sideLanes = [e.lane - 1, e.lane + 1].filter(l => l >= 1 && l <= 3);
            for (const sl of sideLanes) {
              moved = tryEnemyStep(e.pos, sl, cannotAttack ? `再装填しながら側面へ回り込んだ` : `側面へ回り込んだ`);
              if (moved) break;
            }
          }
          if (moved) {
            action = moved;
            if (cannotAttack) e.noAttackTurns -= 1;
          } else {
            // どこにも動けない場合は防御に切り替える
            e.defActive = true;
            action = cannotAttack ? `下がれず、再装填しながら防御した` : `下がれず防御体勢をとった`;
            if (cannotAttack) e.noAttackTurns -= 1;
          }
        } else if (wantsJuke) {
          // 回避型:間合いは保ちつつレーンを変え、狙いを絞らせない
          const sideLanes = [e.lane - 1, e.lane + 1].filter(l => l >= 1 && l <= 3);
          let juked = null;
          for (const sl of sideLanes.sort(() => Math.random() - 0.5)) {
            juked = tryEnemyStep(e.pos, sl, `身を躱すようにレーンを変えた`);
            if (juked) break;
          }
          action = juked || `間合いを保っている`;
        } else if (laneMisaligned && Math.random() < archetypeProfile.laneAlignChance) {
          const tLane = e.lane + (p.lane > e.lane ? 1 : -1);
          // レーンも距離も離れている場合は斜めに詰める(プレイヤーと同じく1手で両方動ける)
          if (eDistX > archetypeProfile.preferredDist) {
            const tPos = e.pos + (p.pos > e.pos ? 1 : -1);
            action = tryEnemyStep(tPos, tLane, `斜めに距離を詰めてきた`)
              || tryEnemyStep(e.pos, tLane, `レーンを移動し軸を合わせた`)
              || `移動を試みたが阻まれた`;
          } else {
            action = tryEnemyStep(e.pos, tLane, `レーンを移動し軸を合わせた`) || `レーン移動を試みたが阻まれた`;
          }
        } else if (eDistX > archetypeProfile.preferredDist && Math.random() < archetypeProfile.laneAlignChance) {
          const t = e.pos + (p.pos > e.pos ? 1 : -1);
          action = tryEnemyStep(t, e.lane, `前進してきた`) || `前進を試みたが阻まれた`;
        } else if (e.hp < e.maxHp * archetypeProfile.defendThreshold && Math.random() < archetypeProfile.defendChance) {
          e.defActive = true; action = `防御体勢をとった`;
        } else if (cannotAttack) {
          // 一斉発射の後隙:全火器を撃ち尽くしたため再装填中(下がれない時はここに来る)
          e.noAttackTurns -= 1;
          e.defActive = true;
          action = `全火器を再装填しながら身を固めた……(残り${e.noAttackTurns}ターン)`;
        } else {
          // 攻撃を行う直前に急所狙いを発動する(仕様書の発動条件に準拠)
          if (enemyHasSkill('CRITICAL') && !e.stunned) { useEnemySkill('CRITICAL'); e.nextCrit = true; }

          // --- 段階2:武器の選択 ---
          // 使用可能(残弾/HEATに余裕がある)な武器のうち、今の位置関係で当たるものを選ぶ。
          // 複数当たるなら火力(atkMult)が高いものを優先する。
          const usableWeapons = (e.weapons || []).filter(w =>
            w.wType === 'SHOOT' ? (w.currentAmmo || 0) > 0 : (w.currentHeat || 0) < (w.maxHeat || 100)
          );
          const inRange = usableWeapons
            .map(w => ({ w, chk: checkAttackValidity(e.pos, e.lane, e.height || 0, p.pos, p.lane, p.height || 0, w.range || '近', newState.revealedTreesE) }))
            .filter(x => x.chk.valid)
            .sort((a, b) => (b.w.atkMult || 1) - (a.w.atkMult || 1));

          // 使える武器が1つも無い(全弾切れ/全オーバーヒート)ならリロード・冷却を行う
          if (usableWeapons.length === 0 && (e.weapons || []).length > 0) {
            const needReload = e.weapons.find(w => w.wType === 'SHOOT' && (w.currentAmmo || 0) <= 0);
            const needCool = e.weapons.find(w => w.wType === 'MELEE' && (w.currentHeat || 0) >= (w.maxHeat || 100));
            if (needReload) {
              needReload.currentAmmo = needReload.maxAmmo || 0;
              action = `[${needReload.name}] をリロードした`;
            } else if (needCool) {
              needCool.currentHeat = 0;
              action = `[${needCool.name}] を冷却した`;
            } else {
              action = `武装を整備している`;
            }
          } else if (inRange.length > 0) {
            // 当たる武器があるので攻撃する
            const chosen = inRange[0].w;
            const eAccPenalty = (e.height || 0) >= 2 ? 0 : getTerrainAccPenalty(getTerrain(e.pos, e.lane));
            const playerDodged = Math.random() * 100 < getEvasionChance(stats.spd, e.spd, stats.eva || 0, (e.acc || 0) - eAccPenalty);
            const pEffDef = Math.floor(stats.def * (p.defDebuff || 1));
            const weaponAtk = Math.floor((e.atk || 0) * (chosen.atkMult || 1));
            let eDmg = Math.max(1, weaponAtk - (p.defActive ? pEffDef * (p.hasShieldEquipped ? 3 : 2) : pEffDef));
            eDmg = Math.min(eDmg, Math.floor(p.maxHp * 0.7));
            let critNote = '';
            if (e.nextCrit) { eDmg *= 2; e.nextCrit = false; critNote = '【急所直撃!!】'; }
            // 弾/HEATを消費する
            const useNote = chosen.wType === 'SHOOT'
              ? (() => { chosen.currentAmmo = (chosen.currentAmmo || 1) - 1; return ` (残弾:${chosen.currentAmmo})`; })()
              : (() => { chosen.currentHeat = (chosen.currentHeat || 0) + (chosen.heatRate || 30); return ` (HEAT:${chosen.currentHeat}%)`; })();
            const verb = chosen.wType === 'SHOOT' ? '射撃' : '斬撃';
            if (playerDodged) { eDmg = 0; sfx.evade(); action = `[${chosen.name}] で${verb}！ しかし素早く回避された！${useNote}`; }
            else if (p.evasion) { eDmg = 0; p.evasion = false; sfx.evade(); action = `[${chosen.name}] で${verb}！ しかし完全回避スキルにより無効化！${useNote}`; }
            else if (p.shieldActive) { eDmg = Math.floor(eDmg / 2); p.shieldActive = false; sfx.enemyAttack(); setTimeout(() => sfx.enemyHit(), 70); action = `${critNote}[${chosen.name}] で${verb}！ 防壁により半減、${eDmg} のダメージ！${useNote}`; }
            else { sfx.enemyAttack(); setTimeout(() => sfx.enemyHit(), 70); action = `${critNote}[${chosen.name}] で${verb}！ ${eDmg} のダメージを受けた！${useNote}`; }
            p.hp -= eDmg;
            if (eDmg > 0 && (p.repairTurns || 0) > 0) {
              const healed = Math.floor(eDmg / 2);
              p.hp = Math.min(p.maxHp, p.hp + healed);
              action += ` [オートリペア] ${healed} 回復！`;
            }
            if (chosen.wType === 'MELEE' && (chosen.currentHeat || 0) >= (chosen.maxHeat || 100)) {
              action += ` [${chosen.name} オーバーヒート！]`;
            }
          } else {
          const check = checkAttackValidity(e.pos, e.lane, e.height || 0, p.pos, p.lane, p.height || 0, (usableWeapons[0] && usableWeapons[0].range) || '近', newState.revealedTreesE);
          if (!check.valid && check.reason.includes('射線')) {
            // 射線が通らないなら棒立ちせず、レーンを変えて回り込みを図る
            // (これが無いと壁越しに両者が動かない膠着状態が延々と続いてしまう)
            const sideLanes = [e.lane - 1, e.lane + 1].filter(l => l >= 1 && l <= 3);
            let repositioned = null;
            for (const sl of sideLanes) {
              repositioned = tryEnemyStep(e.pos, sl, `射線を確保するため回り込んだ`);
              if (repositioned) break;
            }
            if (!repositioned) {
              const fwd = e.pos + (p.pos > e.pos ? 1 : -1);
              repositioned = tryEnemyStep(fwd, e.lane, `遮蔽を避けて位置を変えた`);
            }
            action = repositioned || `射線が通らず動けない (${check.reason})`;
          } else {
            // 射程外:武器が届く位置まで詰める
            const fwd = e.pos + (p.pos > e.pos ? 1 : -1);
            const closed = tryEnemyStep(fwd, e.lane, `射程に入るため前進した`);
            action = closed || `攻撃を試みたが届かない！ (${check.reason})`;
          }
          }
        }
        }
      }
      newState.logs.push(`> 敵は ${action}`);
      // APブースト:接近が必要な状況で発動し、そのターンにもう1歩踏み込む(=2行動)。
      // 敵はAP制ではないため「移動をもう一度行う」という形で2行動を表現している。
      if (enemyHasSkill('AP_BOOST') && !e.stunned && !newState.result) {
        const stillFar = Math.abs(e.pos - p.pos) > 1 || Math.abs(e.lane - p.lane) > 0;
        const movedThisTurn = action.includes('前進') || action.includes('レーンを移動');
        if (stillFar && movedThisTurn) {
          useEnemySkill('AP_BOOST');
          const revealedE2 = newState.revealedTreesE;
          let extraAction = '追加行動を試みたが動けなかった';
          if (Math.abs(e.lane - p.lane) > 0) {
            const tLane = e.lane + (p.lane > e.lane ? 1 : -1);
            const actual = getTerrain(e.pos, tLane);
            const eff = getEffectiveTerrain(e.pos, tLane, revealedE2);
            if (!(eff === 'WALL' || actual === 'TREE_HIGH') && !isTreeTerrain(actual)) {
              e.lane = tLane; e.height = getTerrainHeight(getTerrain(e.pos, e.lane));
              revealAdjacentTrees(e.pos, e.lane, revealedE2);
              extraAction = 'さらにレーンを移動した';
            }
          } else {
            const t = e.pos + (p.pos > e.pos ? 1 : -1);
            if (t >= 1 && t <= getFieldCols() && !(t === p.pos && e.lane === p.lane)) {
              const actual = getTerrain(t, e.lane);
              const eff = getEffectiveTerrain(t, e.lane, revealedE2);
              if (!(eff === 'WALL' || actual === 'TREE_HIGH') && !isTreeTerrain(actual)) {
                e.pos = t; e.height = getTerrainHeight(getTerrain(e.pos, e.lane));
                revealAdjacentTrees(e.pos, e.lane, revealedE2);
                extraAction = 'さらに前進した';
              }
            }
          }
          newState.logs.push(`> [敵ACTIVE SKILL] APブースト！ ${extraAction}！`);
        }
      }
      if (p.hp <= 0) { p.hp = 0; newState.result = 'LOSE'; newState.logs.push(`>> 大破……戦闘不能。`); sfx.defeat(); setBattleState(newState); return; }
      if (p.height === 2 && p.flightTurnsLeft !== null) {
        p.flightTurnsLeft -= 1;
        if (p.flightTurnsLeft <= 0) {
          p.height = getTerrainHeight(getTerrain(p.pos, p.lane));
          p.flightTurnsLeft = null;
          newState.logs.push(`> [WARNING] 飛行エネルギー切れ！強制着地した！`);
        }
      }
      if (e.limiterActive && e.limiterTurnsLeft !== null) {
        e.limiterTurnsLeft -= 1;
        if (e.limiterTurnsLeft <= 0 && e.limiterBonus) {
          e.atk -= e.limiterBonus.atk;
          e.spd -= e.limiterBonus.spd;
          e.eva -= e.limiterBonus.eva;
          e.limiterActive = false;
          e.limiterTurnsLeft = null;
          newState.logs.push(`> リミッター解除の効果が切れた。`);
        }
      }
    };

    // プレイヤーが1行動した直後に敵が1手番を消費して行動する。
    // スキルは0AP消費なので手番を渡さない(準備行動として機能する)。
    if (cost > 0 && !newState.result && e.ap > 0) {
      runEnemyAction();
      e.ap -= 1;
    }

    // 【重要】プレイヤーが行動できない状態(STUN/反動スタン)への対処。
    // この処理はexecuteCommand(=プレイヤーの行動)の中にあるため、プレイヤーが
    // 何もできないターンは一度も実行されない。そのままだと敵も動かず操作もできない
    // デッドロックに陥るため、「プレイヤーが行動不能な間はターンを自動で進める」
    // ループにしている(実際にSTUN後の進行不能として発生した)。
    let turnGuard = 0;
    while (!newState.result && turnGuard < 30) {
      turnGuard++;
      // プレイヤーにAPが残っている = 操作可能なのでループを抜ける
      if (p.ap > 0) break;
      // 敵にAPが残っていれば1手番ずつ消化する
      if (e.ap > 0) {
        runEnemyAction();
        e.ap -= 1;
        continue;
      }
      // 両者ともAPを使い切ったらターン終了処理
      endTurn(newState, p, e);
      // ターンが明けてもプレイヤーが行動不能(スタン中)の場合は、
      // そのターンを「消費させる」ためにここで一旦停止する。
      // ※ここで抜けないと、スタンしたターンが即座に消化されて
      //   「スタンを受けたのに動けてしまう」状態になる(実際に発生した)。
      if (p.isStunnedNow) break;
    }

    setBattleState(newState);
  };

  // ターン終了処理:APリセット・持続効果の消化・スタン判定
  const endTurn = (newState, p, e) => {
    {
      p.ap = MAX_AP; e.ap = MAX_AP; newState.turn += 1;
      // 段階4:行動阻害と継続ダメージを1ターン分消化する
      const tickStatus = (unit, label) => {
        ['lockMoveTurns','lockAttackTurns','sealSkillTurns','gravityTurns'].forEach(k => {
          if ((unit[k] || 0) > 0) unit[k] -= 1;
        });
        // 焼夷弾:毎ターン継続ダメージ
        if ((unit.burnTurns || 0) > 0) {
          unit.burnTurns -= 1;
          const dmg = unit.burnDamage || 0;
          unit.hp -= dmg;
          newState.logs.push(`> [炎上] ${label}は ${dmg} のダメージを受けた！(残り${unit.burnTurns}ターン)`);
          if (unit.burnTurns <= 0) unit.burnDamage = 0;
        }
      };
      tickStatus(p, 'こちら');
      tickStatus(e, '敵');
      // 炎上ダメージで決着がついた場合の判定
      if (e.hp <= 0 && !newState.result) {
        e.hp = 0; newState.result = 'WIN';
        newState.logs.push(`>> 炎上により敵を撃破した！！`);
        sfx.victory();
      } else if (p.hp <= 0 && !newState.result) {
        p.hp = 0; newState.result = 'LOSE';
        newState.logs.push(`>> 炎上により大破……戦闘不能。`);
        sfx.defeat();
      }

      // オーパスキルの持続効果を1ターン分消化する
      if ((p.repairTurns || 0) > 0) {
        p.repairTurns -= 1;
        if (p.repairTurns <= 0) newState.logs.push(`> オートリペアの効果が切れた。`);
      }
      if ((e.repairTurns || 0) > 0) {
        e.repairTurns -= 1;
        if (e.repairTurns <= 0) newState.logs.push(`> 敵のオートリペアの効果が切れた。`);
      }
      // 敵のスタン(ターン単位)を解除する。1行動で消費するのではなく、ここでまとめて解く。
      if (e.stunned) {
        e.stunned = false;
        newState.logs.push(`> 敵のスタンが解けた。`);
      }
      // 敵のSTUNを受けていた場合、このターンはAPが0になる(アクティブスキルのみ使用可)
      if (p.stunnedNextTurn) {
        p.ap = 0;
        p.stunnedNextTurn = false;
        p.isStunnedNow = true;   // このターン中はUIにスタン表示を出し続ける
        newState.logs.push(`>> [STUN] 行動不能！ このターンは移動も攻撃もできない(スキルのみ使用可)`);
      } else if ((p.selfStunTurns || 0) > 0) {
        // 渾身の一撃の反動による自己スタン(こちらもスキルのみ使用可)
        p.ap = 0;
        p.selfStunTurns -= 1;
        p.isStunnedNow = true;
        newState.logs.push(`>> [反動] 渾身の一撃の反動で行動不能！ (残り${p.selfStunTurns}ターン)`);
      } else {
        p.isStunnedNow = false;  // スタンしていない通常ターンでは表示を消す
      }
      newState.logs.push(`--- TURN ${newState.turn} ---`);
    }
  };

  const handleResult = () => {
    if (battleState && battleState.result === 'WIN') {
      addLog(`[ARENA] 勝利！ マテリアル ${battleState.enemy.reward}G 獲得！`);
      setMaterials(m => m + (battleState.enemy.reward || 0));
      addRankPoints(RANK_WIN_POINTS);
    } else {
      addLog(`[ARENA] 敗北……緊急離脱しました。`);
      if (rank !== 'G') addRankPoints(-RANK_LOSE_POINTS);
    }
    setBattleState(null);
  };

  const startTournament = () => {
    if (rankPoints <= TOURNAMENT_ENTRY_COST) { addLog(`[ARENA] ランクポイントが足りず公式大会に出場できない。(${TOURNAMENT_ENTRY_MIN}pt以上必要)`); return; }
    addRankPoints(-TOURNAMENT_ENTRY_COST);
    addLog(`[ARENA] 公式大会エントリー(-${TOURNAMENT_ENTRY_COST}pt)。1回戦、開始！`);
    setTournamentActive(true);
    setIsWorldTournament(false);
    setTournamentRound(1);
    setDefeatedInTournament([]);
    startBattle(false, []);
  };

  // --- Sランク 防衛戦(仕様書7節) ---
  // ARENA入口に入るたびに判定し、発生したら受諾/拒否の選択画面を出す。
  useEffect(() => {
    if (rank !== 'S') return;
    if (battleState || pendingDefense || tournamentActive) return;
    if (!defenseAvailable) return; // 前回の防衛戦に敗れている間は発生しない
    if (Math.random() < DEFENSE_ENCOUNTER_RATE) {
      const isOopa = Math.random() < OOPA_ENCOUNTER_RATE;
      setPendingDefense({ isOopa });
    }
  }, []); // ARENA画面に入った時に1度だけ判定する

  const acceptDefense = () => {
    const isOopa = pendingDefense && pendingDefense.isOopa;
    addLog(isOopa
      ? `[ARENA] 挑戦を受けた。現れたのは……A-FIGHT運営の刺客【オーパ】！`
      : `[ARENA] 挑戦を受けた。王座を懸けた防衛戦、開始！`);
    setDefenseActive(true);
    setDefenseIsOopa(!!isOopa);
    setPendingDefense(null);
    startBattle(false, [], isOopa ? 'OOPA' : 'NORMAL');
  };

  const declineDefense = () => {
    addLog(`[ARENA] 挑戦を退けた。チャンピオンではあるが、逃げたと見なされた……(-${DEFENSE_DECLINE_POINTS}pt)`);
    addRankPoints(-DEFENSE_DECLINE_POINTS);
    setPendingDefense(null);
  };

  const handleDefenseResult = () => {
    const won = battleState && battleState.result === 'WIN';
    if (won) {
      let rewardOverrides = {};
      if (defenseIsOopa) {
        const rewardItem = generateOopaRewardItem();
        addLog(`[ARENA] ★オーパ撃破！！★ ランクポイント+${DEFENSE_WIN_POINTS}、マテリアル+${OOPA_WIN_MATERIALS}G、「${rewardItem.name}」を獲得！`);
        setMaterials(m => m + OOPA_WIN_MATERIALS);
        setInventory(prev => [...prev, rewardItem]);
        // 自動セーブが走る場合に備え、付与したばかりの報酬を明示的に渡す
        rewardOverrides = { inventory: [...inventory, rewardItem], materials: materials + OOPA_WIN_MATERIALS };
      } else {
        addLog(`[ARENA] 防衛成功！ 王座を守り抜いた！(ランクポイント+${DEFENSE_WIN_POINTS})`);
      }
      addRankPoints(DEFENSE_WIN_POINTS, rewardOverrides);
    } else {
      addLog(`[ARENA] 防衛失敗……王者としての威信が傷ついた。(ポイントが${DEFENSE_LOSE_POINTS}に固定)`);
      addLog(`[ARENA] 次に世界大会で優勝するまで、挑戦者は現れない。`);
      loseDefense();
    }
    setDefenseActive(false);
    setDefenseIsOopa(false);
    setBattleState(null);
  };

  // 世界大会:Aランクの必要ポイントを貯めきった者だけが挑戦できる。
  // エントリーコストは無し(Aランクを1本貯めきること自体が参加条件)。
  const startWorldTournament = () => {
    if (!worldTournamentEligible) { addLog(`[ARENA] 世界大会への挑戦権がない。`); return; }
    addLog(`[ARENA] === 世界大会 開幕 === 世界中の強豪が集う大舞台。1回戦、開始！`);
    setTournamentActive(true);
    setIsWorldTournament(true);
    setTournamentRound(1);
    setDefeatedInTournament([]);
    startBattle(true, []);
  };

  const handleRoundClear = () => {
    addLog(`[ARENA] ${isWorldTournament ? '世界大会 ' : ''}${getRoundLabel(tournamentRound)}、突破！`);
    // 今倒した相手を撃破済みリストに加え、次の回戦では抽選対象から外す。
    // (stateの更新は次のレンダリングまで反映されないため、次戦へは新しい配列を直接渡す)
    const beatenName = battleState && battleState.enemy && battleState.enemy.baseName;
    const nextDefeated = beatenName ? [...defeatedInTournament, beatenName] : defeatedInTournament;
    setDefeatedInTournament(nextDefeated);
    setTournamentRound(r => r + 1);
    startBattle(isWorldTournament, nextDefeated);
  };

  // 報酬(ランクポイント・マテリアル・限定アイテム)はexecuteCommand内、敵を撃破した瞬間に
  // 既に確定済み。ここでは画面のクリーンアップのみを行う。
  const handleTournamentVictory = () => {
    setTournamentActive(false);
    setIsWorldTournament(false);
    setTournamentRound(0);
    setDefeatedInTournament([]);
    setBattleState(null);
  };

  const handleTournamentDefeat = () => {
    if (isWorldTournament) {
      // 世界大会は結果に関わらずAランクのポイントが0にリセットされる
      addLog(`[ARENA] 世界大会 ${getRoundLabel(tournamentRound)}で敗退……。頂点には届かなかった。`);
      addLog(`[ARENA] Aランクのポイントがリセットされた。再挑戦するには再び${RANK_THRESHOLDS.A}ptを貯める必要がある。`);
      resetWorldTournamentEligibility();
    } else {
      addLog(`[ARENA] 公式大会 ${getRoundLabel(tournamentRound)}で敗退……。報酬は得られなかった。`);
    }
    setTournamentActive(false);
    setIsWorldTournament(false);
    setTournamentRound(0);
    setDefeatedInTournament([]);
    setBattleState(null);
  };

  // 防衛戦の挑戦者が現れた時の受諾/拒否画面
  if (!battleState && pendingDefense) {
    const isOopa = pendingDefense.isOopa;
    return (
      <div className="flex flex-col flex-grow p-4 bg-[#0a0510] border-2 border-amber-500 rounded-xl relative overflow-hidden items-center justify-center">
        <div className={`text-center mb-2 ${isOopa ? 'animate-pulse' : ''}`}>
          <p className="text-xs text-amber-400 tracking-[0.3em] mb-1">CHALLENGER APPROACHING</p>
          <h2 className={`font-black tracking-widest ${isOopa ? 'text-3xl text-fuchsia-300' : 'text-2xl text-amber-300'}`}>
            {isOopa ? '⚠ 運営の刺客 現る ⚠' : '挑戦者が現れた！'}
          </h2>
        </div>
        <p className="text-sm text-center text-gray-300 max-w-md mb-1 px-4">
          {isOopa
            ? 'A-FIGHT運営が差し向けた特別機体【オーパ】。並のファイターとは比較にならない性能を備えている。'
            : '王座を狙うファイターがあなたの前に立ち塞がった。'}
        </p>
        <div className="text-[11px] text-gray-400 text-center mb-5 space-y-0.5">
          <p>勝利:ランクポイント+{DEFENSE_WIN_POINTS}{isOopa ? ` / マテリアル+${OOPA_WIN_MATERIALS}G / オーパ専用の特殊報酬` : ''}</p>
          <p className="text-red-400">敗北:ポイントが{DEFENSE_LOSE_POINTS}に固定され、次の世界大会優勝まで挑戦者は現れなくなる</p>
          <p className="text-gray-500">拒否:-{DEFENSE_DECLINE_POINTS}pt(挑戦から逃げた扱いになる)</p>
        </div>
        <div className="flex gap-3 flex-wrap justify-center">
          <button onClick={acceptDefense} className={`px-8 py-3 font-black rounded-lg border-2 transition-all ${isOopa ? 'bg-fuchsia-900 border-fuchsia-400 text-white hover:bg-fuchsia-800 shadow-[0_0_20px_rgba(232,121,249,0.4)]' : 'bg-amber-800 border-amber-400 text-white hover:bg-amber-700'}`}>
            挑戦を受ける
          </button>
          <button onClick={declineDefense} className="px-6 py-3 bg-gray-900 border border-gray-600 text-gray-300 font-bold rounded-lg hover:bg-gray-800">
            今回は見送る (-{DEFENSE_DECLINE_POINTS}pt)
          </button>
        </div>
      </div>
    );
  }

  if (!battleState) {
    const powerLevel = stats.hp + stats.atk * 5 + stats.def * 4 + stats.spd * 4;
    const matchLabel = rank === 'G' ? '練習試合' : '公式試合';
    const matchLabelEn = rank === 'G' ? 'PRACTICE MATCH' : 'OFFICIAL MATCH';
    return (
      <div className="flex flex-col flex-grow p-4 bg-[#110505] border border-red-900 rounded-xl relative overflow-hidden">
        <div className="flex justify-between items-center mb-6 border-b border-red-900/50 pb-4">
          <div>
            <h2 className="text-2xl font-black text-red-500 tracking-widest flex items-center gap-2"><IconTarget size={28} /> ARENA ENTRANCE</h2>
            <p className="text-xs text-red-400/70 tracking-widest">TACTICAL COMBAT MODE (V12 Z-AXIS)</p>
          </div>
          <button onClick={() => setPhase('room')} className="px-4 py-2 bg-black border border-red-900 text-red-400 rounded hover:bg-red-950 transition-colors text-sm font-bold">帰還する</button>
        </div>
        <div className={`mb-4 bg-black/50 border rounded-lg p-3 flex items-center justify-between flex-wrap gap-2 ${rank === 'S' ? 'border-amber-400 shadow-[0_0_16px_rgba(251,191,36,0.25)]' : 'border-amber-800'}`}>
          <div className="flex items-center gap-2 flex-wrap">
            {rank === 'S' ? (
              <span className="text-amber-300 font-black text-lg">★ Sランク <span className="text-sm">(現チャンピオン)</span></span>
            ) : (
              <span className="text-amber-400 font-black text-lg">{rank}ランク</span>
            )}
            {getDisplayThreshold(rank) !== undefined && <span className="text-amber-200 text-xs">{rankPoints} / {getDisplayThreshold(rank)}</span>}
            {worldTournamentEligible && rank === 'A' && <span className="text-fuchsia-300 text-xs font-bold">★世界大会 挑戦権あり</span>}
            {worldTournamentEligible && rank === 'S' && <span className="text-fuchsia-300 text-xs font-bold">★連覇に挑戦できる</span>}
          </div>
          <div className="text-xs text-gray-400">
            今回:<span className="text-red-300 font-bold ml-1">{matchLabel}</span>
            <span className="ml-2 text-green-400">勝利+{RANK_WIN_POINTS}pt</span>
            {rank !== 'G' && <span className="ml-2 text-red-400">敗北-{RANK_LOSE_POINTS}pt</span>}
          </div>
        </div>
        <div className="flex flex-col md:flex-row gap-6 flex-grow items-center justify-center">
          <div className="bg-black/60 border border-cyan-900 rounded-lg p-8 text-center shadow-[0_0_20px_rgba(6,182,212,0.1)]">
            <div className="text-xs text-cyan-600 font-bold mb-2">PLAYER COMBAT POWER</div>
            <div className="text-5xl font-black text-cyan-400">{powerLevel}</div>
          </div>
          <div className="bg-black/40 border border-gray-800 rounded-lg p-4 text-sm text-gray-400 max-w-xs">
            <div className="font-bold text-gray-300 mb-2 text-xs tracking-widest">TERRAIN LEGEND</div>
            <div className="space-y-1 text-[11px]">
              <div className="flex items-center gap-2"><span className="w-3 h-3 bg-gray-900 border border-gray-800 inline-block shrink-0"></span><span>平地 — 効果なし</span></div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 bg-gray-600 border border-gray-500 inline-block shrink-0"></span><span>高台 — 射程+</span></div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 bg-black border border-gray-800 inline-block shrink-0"></span><span>窪地 — 射程-</span></div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 bg-gray-700 border border-red-900 inline-block shrink-0"></span><span>障害物 — 射線遮断/進入不可</span></div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 bg-[#243021] border border-lime-900 inline-block shrink-0"></span><span>沼地 — 射程-, 命中率-</span></div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 bg-[#0e2438] border border-sky-800 inline-block shrink-0"></span><span>川 — 移動にAP2消費</span></div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 bg-[#1c3d20] border border-green-700 inline-block shrink-0 text-green-300 text-[8px] leading-3 text-center font-bold">?</span><span>木 — 隣接するまで正体不明</span></div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 bg-[#2c4f26] border border-green-800 inline-block shrink-0"></span><span>低木/高木 — 判別後(共に遮蔽)</span></div>
            </div>
            <div className="mt-2 pt-2 border-t border-gray-800 text-[10px] text-gray-500">
              飛行(FLY)中は障害物・木の上を通過でき、沼地の命中率低下も受けない。
            </div>
          </div>
        </div>
        <div className="mt-6 flex flex-col items-center gap-3">
          <button onClick={() => startBattle(false)} className="w-full md:w-2/3 py-4 bg-red-900 hover:bg-red-700 text-white font-black tracking-[0.2em] rounded-lg shadow-[0_0_20px_rgba(220,38,38,0.4)] flex items-center justify-center gap-2 transition-all">
            <IconActivity size={20} /> {matchLabelEn}へ出撃
          </button>
          {rank !== 'G' && (
            <button
              onClick={startTournament}
              disabled={rankPoints <= TOURNAMENT_ENTRY_COST}
              className="w-full md:w-2/3 py-3 bg-purple-950 hover:bg-purple-800 disabled:opacity-30 disabled:cursor-not-allowed text-white font-black tracking-[0.15em] rounded-lg border border-purple-600 shadow-[0_0_20px_rgba(147,51,234,0.3)] flex items-center justify-center gap-2 transition-all"
            >
              <IconTarget size={18} /> 公式大会エントリー (-{TOURNAMENT_ENTRY_COST}pt / 5回戦)
            </button>
          )}
          {rank !== 'G' && rankPoints <= TOURNAMENT_ENTRY_COST && (
            <p className="text-[10px] text-purple-400">公式大会には{TOURNAMENT_ENTRY_MIN}pt以上必要です(現在{rankPoints}pt)</p>
          )}
          {worldTournamentEligible && (
            <>
              <button
                onClick={startWorldTournament}
                className="w-full md:w-2/3 py-4 bg-gradient-to-r from-fuchsia-900 via-amber-800 to-fuchsia-900 hover:from-fuchsia-800 hover:to-fuchsia-800 text-white font-black tracking-[0.15em] rounded-lg border-2 border-amber-400 shadow-[0_0_28px_rgba(251,191,36,0.45)] flex items-center justify-center gap-2 transition-all animate-pulse"
              >
                ★ 世界大会に{rank === 'S' ? '挑戦する(連覇)' : '挑戦する'} (5回戦)
              </button>
              <p className="text-[10px] text-amber-300 text-center px-4">
                {rank === 'S'
                  ? '優勝すれば連覇。勝敗に関わらずポイントはリセットされる。'
                  : '優勝でSランク(チャンピオン)へ。勝敗に関わらずAランクのポイントはリセットされる。'}
              </p>
            </>
          )}
          {rank === 'S' && (
            <div className="w-full md:w-2/3 mt-1 px-3 py-2 rounded-lg border border-amber-700/60 bg-amber-950/20 text-center">
              <p className="text-[11px] text-amber-300 font-bold">★ 現チャンピオン</p>
              <p className="text-[10px] text-amber-200/80 mt-0.5">
                王座を狙う挑戦者がいつ現れてもおかしくない。ARENAに来るたび、防衛戦が発生する可能性がある。
              </p>
              <p className="text-[9px] text-gray-500 mt-1">(防衛戦システムは現在実装準備中)</p>
            </div>
          )}
        </div>
      </div>
    );
  }

  const p = battleState.player, e = battleState.enemy, activeWeapons = battleState.activeWeapons, usedSkills = battleState.usedSkills;
  const playerWeaponVisual = getEquippedWeaponVisual(inventory, equipped);
  const distX = Math.abs(e.pos - p.pos);
  const pFlip = p.pos > e.pos;
  const eFlip = e.pos < p.pos;
  // レーンが増えるほど1レーンあたりの高さが減るため、ファイターの表示も小さくする
  // (フィールド自体の高さ拡張と合わせた対応。大きな立ち絵はROOM/CLOSETで見られる)
  const fighterHeightClass = getFieldLanes() >= 5 ? 'h-[90px]'
    : getFieldLanes() === 4 ? 'h-[105px]'
    : 'h-[120px]';

  // レーン数が可変になったため、奥行き表現(位置・拡大率・重なり順)を比率で計算する。
  // lane=1が最奥、laneCount番目が最手前。
  const getLaneStyle = (lane, height) => {
    const laneCount = getFieldLanes();
    const depth = laneCount > 1 ? (lane - 1) / (laneCount - 1) : 1; // 0=最奥, 1=最手前
    const baseBottom = 35 - depth * 35;              // 奥ほど上に配置
    const scale = 0.8 + depth * 0.2;                 // 奥ほど小さい
    const yOffset = height === 1 ? 15 : height === 2 ? 40 : height === -1 ? -10 : 0;
    return { bottom: `calc(${baseBottom}% + ${yOffset}px)`, transform: `scale(${scale})`, zIndex: (lane * 10) + (height * 2) };
  };

  // レーン名も可変。3レーンなら従来通りTOP/CENTER/BOTTOM、それ以外はL1..Lnで表す。
  const getLaneName = (lane) => {
    const laneCount = getFieldLanes();
    if (laneCount === 3) return lane === 1 ? 'TOP' : lane === 2 ? 'CENTER' : 'BOTTOM';
    if (lane === 1) return 'TOP';
    if (lane === laneCount) return 'BOTTOM';
    return `L${lane}`;
  };

  const renderTerrainGrid = () => {
    const grids = [];
    const revealedP = (battleState && battleState.revealedTreesP) || [];
    const cols = getFieldCols(), laneCount = getFieldLanes();
    const cellW = 100 / cols;
    // 各レーンの帯の高さ・位置も比率で算出する
    const bandH = 60 / laneCount;   // レーン1本ぶんの高さ(%)
    for (let l = 1; l <= laneCount; l++) {
      for (let pos = 1; pos <= cols; pos++) {
        const terrain = getTerrain(pos, l);
        // プレイヤーがまだ判別していない木は「?」表示にする
        const isUnknownTree = isTreeTerrain(terrain) && !hasRevealed(revealedP, `${pos}-${l}`);
        const visual = isUnknownTree
          ? TERRAIN_VISUALS.TREE_UNKNOWN
          : (TERRAIN_VISUALS[terrain] || TERRAIN_VISUALS.FLAT);
        // 奥のレーンほど暗く落として奥行きを出す
        const depth = laneCount > 1 ? (l - 1) / (laneCount - 1) : 1;
        const depthOpacity = 0.55 + depth * 0.45;
        const gridBottom = `${15 + (laneCount - l) * bandH}%`;
        grids.push(
          <div
            key={`${pos}-${l}`}
            className={`absolute overflow-hidden ${visual.baseClass}`}
            style={{ left: `${(pos - 1) * cellW}%`, bottom: gridBottom, height: `${bandH}%`, width: `${cellW}%`, opacity: depthOpacity }}
          >
            {visual.render && visual.render(`${pos}-${l}-svg`)}
          </div>
        );
      }
    }
    return grids;
  };

  return (
    <div className="flex flex-col flex-grow bg-gray-950 border-2 border-red-900 rounded-xl overflow-hidden relative">
      {defenseActive && (
        <div className={`border-b text-center text-[11px] font-black tracking-widest py-1 ${defenseIsOopa ? 'bg-gradient-to-r from-fuchsia-950 via-purple-900 to-fuchsia-950 border-fuchsia-400 text-fuchsia-200 animate-pulse' : 'bg-amber-950 border-amber-500 text-amber-200'}`}>
          {defenseIsOopa ? '⚠ 防衛戦 — 運営の刺客【オーパ】 ⚠' : '★ 王座防衛戦 ★'}
        </div>
      )}
      {tournamentActive && (
        <div className={`border-b text-center text-[11px] font-black tracking-widest py-1 ${isWorldTournament ? 'bg-gradient-to-r from-fuchsia-950 via-amber-900 to-fuchsia-950 border-amber-400 text-amber-200' : 'bg-purple-950 border-purple-600 text-purple-200'}`}>
          {isWorldTournament ? '★ 世界大会 ★' : '公式大会'} — {getRoundLabel(tournamentRound)} ({tournamentRound}/{TOURNAMENT_ROUNDS})
        </div>
      )}
      {/* 戦闘ヘッダー:敵の詳細は下部のENEMY DATAに集約したので、ここは
          「自分の状態」と「両者の位置関係」に専念する。 */}
      <div className="bg-red-950/80 px-2 py-1 flex justify-between items-center border-b border-red-900 text-[11px] font-bold relative z-50 gap-1">
        {/* 自分の情報:HP/AP と 実効ステータス(デバフ込み) */}
        <div className="text-cyan-400 flex flex-col gap-0.5 min-w-0">
          <div className="flex items-center gap-1.5 flex-wrap">
            <span>PLAYER</span>
            <span className="bg-black px-1.5 py-0.5 rounded">HP:{p.hp}/{p.maxHp}</span>
            <span className="bg-blue-900/50 px-1.5 py-0.5 rounded text-blue-300">AP:{p.ap}</span>
          </div>
          {/* デバフを受けている場合は「元の値→実効値」で示す(何がどれだけ落ちたか分かる) */}
          <div className="flex gap-1.5 flex-wrap items-center text-[9px]">
            <span className={(p.atkDebuff || 1) < 1 ? 'text-red-400 font-bold' : 'text-cyan-700'}>
              ATK {(p.atkDebuff || 1) < 1 ? <>{stats.atk}→{Math.floor(stats.atk * p.atkDebuff)}</> : stats.atk}
            </span>
            <span className={(p.defDebuff || 1) < 1 ? 'text-red-400 font-bold' : 'text-cyan-700'}>
              DEF {(p.defDebuff || 1) < 1 ? <>{stats.def}→{Math.floor(stats.def * p.defDebuff)}</> : stats.def}
            </span>
            <span className="text-cyan-700">SPD {stats.spd}</span>
            {p.isStunnedNow && <span className="px-1 rounded bg-yellow-950 border border-yellow-600 text-yellow-300 font-bold animate-pulse">STUN 行動不能</span>}
            {p.evasion && <span className="px-1 rounded bg-yellow-900 border border-yellow-600 text-yellow-200 font-bold">完全回避</span>}
            {p.shieldActive && <span className="px-1 rounded bg-purple-900 border border-purple-500 text-purple-200 font-bold">防壁</span>}
            {p.nextCrit && <span className="px-1 rounded bg-orange-900 border border-orange-500 text-orange-200 font-bold">急所狙い</span>}
            {(p.repairTurns || 0) > 0 && <span className="px-1 rounded bg-green-900 border border-green-600 text-green-200 font-bold">自己修復{p.repairTurns}T</span>}
            {(p.selfStunTurns || 0) > 0 && <span className="px-1 rounded bg-gray-800 border border-gray-600 text-gray-300 font-bold">反動{p.selfStunTurns}T</span>}
            {(p.lockMoveTurns || 0) > 0 && <span className="px-1 rounded bg-red-950 border border-red-600 text-red-300 font-bold">移動封鎖</span>}
            {(p.lockAttackTurns || 0) > 0 && <span className="px-1 rounded bg-red-950 border border-red-600 text-red-300 font-bold">武装凍結</span>}
            {(p.sealSkillTurns || 0) > 0 && <span className="px-1 rounded bg-red-950 border border-red-600 text-red-300 font-bold">スキル封印</span>}
            {(p.gravityTurns || 0) > 0 && <span className="px-1 rounded bg-indigo-950 border border-indigo-500 text-indigo-300 font-bold">重力異常</span>}
            {(p.burnTurns || 0) > 0 && <span className="px-1 rounded bg-orange-950 border border-orange-500 text-orange-300 font-bold animate-pulse">炎上{p.burnTurns}T</span>}
          </div>
        </div>
        {/* 戦況:距離・ターン・フィールド */}
        <div className="flex flex-col items-center gap-0.5 shrink-0">
          <div className="text-white bg-red-600 px-2 py-0.5 rounded-full text-center text-[10px]">DIST:{distX}</div>
          <div className="text-[9px] text-gray-400 whitespace-nowrap">TURN {battleState.turn}</div>
          {battleState.field && <div className="text-[9px] text-gray-500 whitespace-nowrap">{battleState.field.name}-{battleState.field.variant}</div>}
        </div>
        {/* 位置関係:座標・地形・高低差(射程補正に直結するので明示する) */}
        <div className="flex flex-col gap-0.5 items-end min-w-0 text-[9px]">
          <div className="flex gap-1 items-center justify-end">
            <span className="text-cyan-700">自</span>
            <span className="text-cyan-400 font-mono">{p.pos}-{p.lane}</span>
            <span className={`px-1 rounded ${p.height === 2 ? 'bg-cyan-800 text-white animate-pulse' : 'bg-gray-800 text-gray-400'}`}>
              {p.height === 2 ? '空(FLY)' : getTerrainLabel(getTerrain(p.pos, p.lane))}
            </span>
            {p.height === 2 && p.flightTurnsLeft !== null && <span className="px-1 rounded bg-orange-900/60 text-orange-300 font-bold">残{p.flightTurnsLeft}T</span>}
          </div>
          <div className="flex gap-1 items-center justify-end">
            <span className="text-red-800">敵</span>
            <span className="text-red-400 font-mono">{e.pos}-{e.lane}</span>
            <span className="px-1 rounded bg-gray-800 text-gray-400">{(e.height || 0) === 2 ? '空(FLY)' : getTerrainLabel(getTerrain(e.pos, e.lane))}</span>
          </div>
          {/* 高低差:射程が伸びる/縮むので、その効果まで書く */}
          {(() => {
            const diff = (p.height || 0) - (e.height || 0);
            if (diff === 0) return <span className="text-gray-600">高低差なし</span>;
            return (
              <span className={diff > 0 ? 'text-green-400 font-bold' : 'text-red-400 font-bold'}>
                高低差 {diff > 0 ? '+' : ''}{diff}(射程{diff > 0 ? '+' : ''}{diff})
              </span>
            );
          })()}
        </div>
      </div>

      <div
        className="flex-grow relative flex items-center justify-center overflow-hidden"
        style={{ background: '#050505', minHeight: `${140 + getFieldLanes() * 30}px` }}
      >
        <SkyBackdrop />
        <div className="absolute w-full h-full z-0 pointer-events-none opacity-90">{renderTerrainGrid()}</div>
        <div className="absolute bottom-[2%] w-full px-4 flex justify-between z-0">
          {Array.from({ length: getFieldCols() }, (_, i) => i + 1).map(pos => (
            <div key={pos} style={{ width: `${100 / getFieldCols()}%` }} className={`h-6 border-l border-r border-gray-900/30 flex items-end justify-center pb-1 text-[10px] text-gray-600 ${p.pos === pos ? 'bg-cyan-900/30' : e.pos === pos ? 'bg-red-900/30' : ''}`}>{pos}</div>
          ))}
        </div>
        <div className="absolute w-full h-full flex items-end pb-10 px-4 pointer-events-none">
          <div className="w-full h-full relative">
            <div className="absolute transition-all duration-500 flex flex-col items-center" style={{ left: `${(p.pos - 1) * (100 / getFieldCols())}%`, width: `${100 / getFieldCols()}%`, ...getLaneStyle(p.lane, p.height || 0) }}>
              {p.height === 2 && (
                <div className="absolute left-1/2 -translate-x-1/2 pointer-events-none" style={{ top: '100%', height: '46px' }}>
                  <div className="w-px h-full mx-auto bg-gradient-to-b from-cyan-400/70 to-transparent"></div>
                  <div className="w-8 h-2 rounded-[50%] bg-cyan-400/20 blur-[2px] -mt-1 mx-auto"></div>
                </div>
              )}
              <InteractiveFighterSVG typeId={p.type} height={fighterHeightClass} flip={pFlip} equippedWeaponVisual={playerWeaponVisual} />

          <div className="w-[45%] p-2 border-l border-red-900/50 flex flex-col text-[10px] font-mono text-gray-300 overflow-y-auto">

            ))}
            <div ref={logsEndRef} />
          </div>

      </div>
      {battleState.result && (
        <div className="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-[60] overflow-y-auto py-4">
          {defenseActive ? (
            battleState.result === 'WIN' ? (
              <>
                <div className={`font-black mb-2 tracking-[0.15em] text-center text-3xl ${defenseIsOopa ? 'text-fuchsia-300 animate-pulse' : 'text-amber-300'}`}>
                  {defenseIsOopa ? '★ オーパ撃破 ★' : '防衛成功'}
                </div>
                <div className="text-xs text-amber-200 mb-3 text-center px-4">
                  ランクポイント+{DEFENSE_WIN_POINTS}

                <div className="text-xs text-red-300 mb-3 text-center px-4">

                  <button onClick={handleRoundClear} className="px-8 py-3 bg-purple-800 text-white font-bold rounded border border-purple-500 hover:bg-purple-700 shrink-0">次のラウンドへ</button>

                <>
                  {isWorldTournament ? (
                    <>
                      <div className="text-4xl font-black mb-2 tracking-[0.15em] text-amber-300 text-center animate-pulse">★ 世界王者 ★</div>
                      <div className="text-sm font-black text-fuchsia-300 mb-2 text-center">Sランク到達</div>
                      <div className="text-xs text-amber-200 mb-3 text-center px-4">マテリアル+{WORLD_TOURNAMENT_WIN_MATERIALS}G / ソブリン級装備を獲得<br/>Aランクのポイントはリセットされる</div>
                      <button onClick={handleTournamentVictory} className="px-8 py-3 bg-amber-600 text-white font-black rounded border-2 border-amber-300 hover:bg-amber-500 shrink-0">リザルトへ</button>

                      <div className="text-xs text-amber-200 mb-3 text-center px-4">ランクポイント+{TOURNAMENT_WIN_POINTS} / マテリアル+{TOURNAMENT_WIN_MATERIALS[rank] || 2000}G<br/>報酬は既に獲得済み</div>
                      <button onClick={handleTournamentVictory} className="px-8 py-3 bg-amber-700 text-white font-bold rounded border border-amber-400 hover:bg-amber-600 shrink-0">リザルトへ</button>
                    </>
                  )}

              )
            ) : (
              <>
                <div className="text-3xl font-black mb-2 tracking-[0.15em] text-red-600 text-center">大会敗退</div>
                <div className="text-xs text-red-300 mb-3 text-center px-4">{getRoundLabel(tournamentRound)}で敗北。報酬は得られない。</div>
                <button onClick={handleTournamentDefeat} className="px-8 py-3 bg-gray-800 text-white font-bold rounded border border-gray-600 hover:bg-gray-700 shrink-0">リザルトへ</button>

              <button onClick={handleResult} className="px-8 py-3 bg-gray-800 text-white font-bold rounded border border-gray-600 hover:bg-gray-700 shrink-0">リザルトへ</button>

};


// =========================================================================
// APP ROOT  (セーブ/ロード・画面遷移・エントリーポイント)
// =========================================================================
// --- セーブスロット(TYPE別) ---
// TYPE-A/B/Cごとに独立したセーブデータを持つ。旧形式(単一スロット)のデータは
// 初回読み込み時に、そのデータのTYPEに対応するスロットへ自動移行する。
const LEGACY_SAVE_KEY = 'afight_save_v1_lite';
const SAVE_KEY_PREFIX = 'afight_save_v2_';
const SAVE_SLOTS = ['A', 'B', 'C'];
const slotKey = (type) => `${SAVE_KEY_PREFIX}${type}`;

function loadSlot(type) {
  try {
    const raw = localStorage.getItem(slotKey(type));
    if (!raw) return null;
    return JSON.parse(raw);
  } catch {
    return null;
  }
}

function writeSlot(type, data) {
  try {
    localStorage.setItem(slotKey(type), JSON.stringify(data));
  } catch {}
}

function deleteSlot(type) {
  try {
    localStorage.removeItem(slotKey(type));
  } catch {}
}

// 旧形式のセーブデータを新スロットへ移行する(1度だけ実行される)。
// 既存プレイヤーのデータを失わないための措置。
function migrateLegacySave() {
  try {
    const raw = localStorage.getItem(LEGACY_SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    const type = data && data.fighter && data.fighter.type;
    if (type && SAVE_SLOTS.includes(type) && !localStorage.getItem(slotKey(type))) {
      localStorage.setItem(slotKey(type), raw);
    }
    localStorage.removeItem(LEGACY_SAVE_KEY);
  } catch {}
}

// 全スロットの状態を読み込む(タイトル画面の一覧表示用)
function loadAllSlots() {
  migrateLegacySave();
  const out = {};
  SAVE_SLOTS.forEach(t => { out[t] = loadSlot(t); });
  return out;
}

function App() {
  const [phase, setPhase] = useState('title');
  // 戦闘中の敵情報。下部パネルを戦闘中だけ「敵データ表示」に切り替えるために保持する
  // (戦闘外ではnullになり、通常のシステムログ表示に戻る)
  const [activeEnemy, setActiveEnemy] = useState(null);
  const [fighter, setFighter] = useState(null);
  const [syncRatio] = useState(150);
  const [materials, setMaterials] = useState(9999);
  const [inventory, setInventory] = useState([]);
  const [equipped, setEquipped] = useState({});
  const [rank, setRank] = useState('G');
  const [rankPoints, setRankPoints] = useState(0);
  const [worldTournamentEligible, setWorldTournamentEligible] = useState(false);
  // 防衛戦が発生しうる状態か。防衛戦に敗れるとfalseになり、次に世界大会で優勝するまで挑戦者は現れない。
  const [defenseAvailable, setDefenseAvailable] = useState(true);
  const [logs, setLogs] = useState([]);
  // TYPE別セーブスロットの状態(タイトル画面の一覧表示に使う)
  const [slots, setSlots] = useState(() => loadAllSlots());
  const [confirmDelete, setConfirmDelete] = useState(null); // 削除確認中のスロット(誤操作防止)
  const [confirmLoad, setConfirmLoad] = useState(false);   // ロードの確認待ち
  const [confirmTitle, setConfirmTitle] = useState(false); // タイトル復帰の確認待ち
  const [saveFlash, setSaveFlash] = useState(false);
  const [sfxOn, setSfxOn] = useState(true);
  const flashTimer = useRef(null);

  const phaseToTrack = (p) => {
    if (p === 'arena') return 'battle';
    if (p === 'title') return 'title';
    return 'room';
  };

  const toggleSfx = () => {
    sfx.toggle();
    setSfxOn(sfx.enabled);
    if (!sfx.enabled) {
      bgm.stop();
    } else {
      const track = phaseToTrack(phase);
      if (track) bgm.restart(track);
    }
  };

  useEffect(() => {
    const track = phaseToTrack(phase);
    if (track) bgm.play(track);
    else bgm.stop();
  }, [phase]);

  const addLog = (msg) => setLogs(prev => [...prev, msg].slice(-6));

  // ランクポイントの加減算+昇格/降格判定(ステージ1:土台のみ。試合種別による分岐は未実装)
  // rewardOverrides: 同じ処理内で付与した報酬(inventory/materials)。state更新は非同期のため、
  // 昇格による自動セーブに正しく含めるには呼び出し側から明示的に渡す必要がある。
  const addRankPoints = (delta, rewardOverrides = {}) => {
    let newPoints = rankPoints + delta;
    let newRank = rank;

    if (getDisplayThreshold(newRank) !== undefined && newPoints >= getDisplayThreshold(newRank)) {
      if (newRank === 'A' || newRank === 'S') {
        // Sランクは肩書きでAランクのメーターを使い続ける。到達すれば連覇に挑戦できる
        if (!worldTournamentEligible) {
          setWorldTournamentEligible(true);
          addLog(newRank === 'S'
            ? `[ARENA] 必要ポイントに到達！ 世界大会に再び挑戦し、連覇を狙える！`
            : `[ARENA] Aランクの必要ポイントに到達！ 世界大会への挑戦権を獲得した！`);
        }
      } else {
        const promoted = RANK_ORDER[RANK_ORDER.indexOf(newRank) + 1];
        addLog(`[ARENA] ランクアップ！ ${newRank}ランク → ${promoted}ランクに昇格した！`);
        newRank = promoted;
        newPoints = 0;
      }
    } else if (newPoints < 0) {
      if (newRank === 'G') {
        newPoints = 0;
      } else if (newRank === 'F') {
        newPoints = 0;
        addLog(`[ARENA] ポイントが0を下回ったが、Fランクはこれ以上降格しない。`);
      } else {
        const demoted = RANK_ORDER[RANK_ORDER.indexOf(newRank) - 1];
        addLog(`[ARENA] 降格……${newRank}ランク → ${demoted}ランクに降格した。`);
        newRank = demoted;
        newPoints = Math.floor((RANK_THRESHOLDS[demoted] || 100) * 0.5);
      }
    }

    setRank(newRank);
    setRankPoints(newPoints);
    // ランクそのものが変わった時も自動セーブする(昇格・降格の取りこぼし防止)
    if (newRank !== rank) {
      autoSaveMilestone({ rank: newRank, rankPoints: newPoints, ...rewardOverrides });
      addLog(`[SYSTEM] 自動セーブしました。`);
    }
  };

  // 世界大会 優勝:Sランク(チャンピオン)に昇格。Aランクのポイントは0にリセットされ、
  // 挑戦権も失う(再挑戦するには再び700ptを貯める必要がある)。
  // 防衛戦に敗北:ポイントは50に固定され、次に世界大会で優勝するまで防衛戦が発生しなくなる
  const loseDefense = () => {
    setRankPoints(DEFENSE_LOSE_POINTS);
    setDefenseAvailable(false);
    autoSaveMilestone({ rankPoints: DEFENSE_LOSE_POINTS, defenseAvailable: false });
    addLog(`[SYSTEM] 自動セーブしました。`);
  };

  // rewardOverrides: 直前に付与した報酬(inventory/materials)。Reactのstate更新は
  // 非同期なので、自動セーブに正しい値を残すには呼び出し側から明示的に受け取る必要がある。
  const winWorldTournament = (rewardOverrides = {}) => {
    const isDefense = rank === 'S'; // 既にチャンピオンなら連覇
    setRank('S');
    setRankPoints(0);
    setWorldTournamentEligible(false);
    setDefenseAvailable(true); // 王座に就いた(戻った)ので、再び挑戦者が現れるようになる
    addLog(isDefense
      ? `[ARENA] ★★★ 世界大会 連覇！！ チャンピオンの座を守り抜いた！ ★★★`
      : `[ARENA] ★★★ 世界大会 優勝！！ Sランク(チャンピオン)に到達した！ ★★★`);
    // 王座は最重要の節目なので、この時点で自動セーブして取りこぼしを防ぐ
    autoSaveMilestone({ rank: 'S', rankPoints: 0, worldTournamentEligible: false, defenseAvailable: true, ...rewardOverrides });
    addLog(`[SYSTEM] 自動セーブしました。`);
  };

  // 世界大会 敗退:Sランクへは昇格しないが、Aランクのポイントは同様に0にリセットされる。
  const resetWorldTournamentEligibility = () => {
    setRankPoints(0);
    setWorldTournamentEligible(false);
    autoSaveMilestone({ rankPoints: 0, worldTournamentEligible: false });
    addLog(`[SYSTEM] 自動セーブしました。`);
  };

  const saveGame = useCallback((f, mat, inv, eq, rk, rp, wte, defAvail) => {
    const data = {
      fighter: f, materials: mat, inventory: inv,
      equipped: eq, rank: rk, rankPoints: rp, worldTournamentEligible: wte, defenseAvailable: defAvail,
      savedAt: new Date().toLocaleString()
    };
    // 機体のTYPEに対応するスロットへ保存する
    const type = f && f.type;
    if (!type) return;
    writeSlot(type, data);
    setSlots(prev => ({ ...prev, [type]: data }));
    sfx.saved();
    setSaveFlash(true);
    if (flashTimer.current) clearTimeout(flashTimer.current);
    flashTimer.current = setTimeout(() => setSaveFlash(false), 2000);
  }, []);

  const handleSave = () => {
    if (!fighter) return;
    saveGame(fighter, materials, inventory, equipped, rank, rankPoints, worldTournamentEligible, defenseAvailable);
  };

  // ランクや王座の状態が変わる大きな節目では自動セーブする。
  // 世界大会優勝やランク昇格の直後に手動セーブし忘れると、次回ロード時に
  // その成果が失われてしまう(実際に「優勝したのにAランクから始まった」という
  // 報告があったため対処)。stateの更新は非同期なので、更新後の値を明示的に受け取る。
  const autoSaveMilestone = (overrides = {}) => {
    if (!fighter) return;
    const snap = {
      rank, rankPoints, worldTournamentEligible, defenseAvailable,
      materials, inventory, equipped,
      ...overrides,
    };
    saveGame(fighter, snap.materials, snap.inventory, snap.equipped,
             snap.rank, snap.rankPoints, snap.worldTournamentEligible, snap.defenseAvailable);
  };

  // 指定スロットのデータを読み込んでゲームを再開する
  const handleContinue = (type) => {
    const save = loadSlot(type);
    if (!save || !save.fighter) return;
    sfx.select();
    setFighter(save.fighter);
    setMaterials(save.materials);
    setInventory(save.inventory);
    setEquipped(save.equipped);
    setRank(save.rank || 'G'); // 旧セーブデータ互換(ランク制度導入前のセーブはGランク扱い)
    setRankPoints(save.rankPoints || 0);
    setWorldTournamentEligible(!!save.worldTournamentEligible);
    setDefenseAvailable(save.defenseAvailable !== false); // 旧セーブ互換(未定義ならtrue)
    setLogs([]);
    setPhase('room');
    addLog(`[SYSTEM] TYPE-${type} のセーブデータをロードしました。(${save.savedAt})`);
  };

  // ゲーム中に現在のスロットを読み直す(ロードボタン)。
  // 直前のセーブ地点まで巻き戻せるので、装備の付け替えなどをやり直せる。
  const handleLoad = () => {
    if (!fighter) return;
    const save = loadSlot(fighter.type);
    if (!save || !save.fighter) {
      addLog(`[SYSTEM] このスロットにはまだセーブデータがありません。`);
      return;
    }
    handleContinue(fighter.type);
  };

  // タイトル画面へ戻る。未保存の内容は失われるため、呼び出し側で確認を取る。
  const handleReturnToTitle = () => {
    sfx.select();
    setSlots(loadAllSlots());   // 一覧を最新化してから戻る
    setFighter(null);
    setActiveEnemy(null);
    setLogs([]);
    setPhase('title');
  };

  // スロットを削除する(別のTYPEで新しく始めたい時などに使う)
  const handleDeleteSlot = (type) => {
    deleteSlot(type);
    setSlots(prev => ({ ...prev, [type]: null }));
  };

  const handleNewGame = (type) => {
    sfx.select();
    const t = TYPES[type];
    setFighter({ type, ...t });
    setMaterials(9999);
    setInventory([PRESET_SWORD_SAMPLE]);
    setEquipped({});
    setRank('G');
    setRankPoints(0);
    setWorldTournamentEligible(false);
    setPhase('room');
    addLog(`[SYSTEM] ${t.name}でシステムを起動しました。`);
    addLog(`[SYSTEM] テスト用に「${PRESET_SWORD_SAMPLE.name}」を所持しています。CLOSETで装備してみてください。`);
  };

  const currentStats = () => {
    if (!fighter) return { hp: 0, atk: 0, def: 0, spd: 0, acc: 0, eva: 0, specials: [] };
    const base = TYPES[fighter.type];
    let eqHp = 0, eqAtk = 0, eqDef = 0, eqSpd = 0, eqAcc = 0, eqEva = 0;
    let specials = [];
    Object.values(equipped).forEach(itemId => {
      const item = inventory.find(i => i.id === itemId);
      if (item) {
        eqHp += item.hp || 0; eqAtk += item.atk || 0; eqDef += item.def || 0; eqSpd += item.spd || 0;
        eqAcc += item.acc || 0; eqEva += item.eva || 0;
        if (item.type === 'EX_CHIP' && item.modules) {
          item.modules.forEach(m => {
            eqHp += m.hp || 0; eqAtk += m.atk || 0; eqDef += m.def || 0; eqSpd += m.spd || 0;
            if (m.special) specials.push(m.special);
          });
        }
      }
    });
    const mult = getSyncMultiplier(syncRatio);
    return {
      hp: Math.floor((base.hp + eqHp) * mult),
      atk: Math.floor((base.atk + eqAtk) * mult),
      def: Math.floor((base.def + eqDef) * mult),
      spd: Math.floor((base.spd + eqSpd) * mult),
      acc: Math.floor(eqAcc * mult),
      eva: Math.floor(eqEva * mult),
      specials
    };
  };

  if (phase === 'title') {
    return (
      <div className="flex flex-col items-center justify-center min-h-screen bg-black text-cyan-400 font-mono p-4">
        <div className="absolute inset-0 overflow-hidden pointer-events-none">
          <div className="absolute top-1/4 left-1/2 -translate-x-1/2 w-[600px] h-[600px] rounded-full opacity-5 blur-3xl" style={{ background: 'radial-gradient(circle, #06b6d4, transparent)' }}></div>
        </div>
        <h1 className="text-6xl md:text-8xl font-black mb-2 tracking-[0.2em] text-transparent bg-clip-text" style={{ backgroundImage: 'linear-gradient(to right, #06b6d4, #3b82f6, #60a5fa)' }}>A-FIGHT</h1>
        <p className="text-sm mb-4 text-cyan-700 tracking-widest">OS V12.0.0 — Phase 6.0.1 LITE</p>
        <p className="text-xs mb-8 text-cyan-900 tracking-widest">ARENA OVERHAUL & Z-AXIS SYSTEM</p>

        {/* TYPE別セーブスロット。データがあれば「つづきから」、無ければ「新規開始」になる。
            これによりTYPEを問わず並行して進められる。 */}
        <div className="text-[10px] text-gray-600 tracking-widest mb-3">SAVE SLOT</div>
        <div className="flex flex-col gap-3 w-full max-w-sm">
          {SAVE_SLOTS.map(type => {
            const t = TYPES[type];
            const save = slots[type];
            const has = !!(save && save.fighter);
            return (
              <div key={type} className={`rounded-lg border transition-all ${has ? 'bg-cyan-950/40 border-cyan-700' : 'bg-gray-950 border-gray-800'}`}>
                <button
                  onClick={() => has ? handleContinue(type) : handleNewGame(type)}
                  className="w-full px-4 py-3 text-left hover:bg-white/5 rounded-lg transition-all"
                >
                  <div className="flex items-center justify-between mb-1">
                    <span className={`text-xs font-black ${t.color}`}>TYPE-{type}</span>
                    <span className={`text-[10px] font-black tracking-widest px-2 py-0.5 rounded ${has ? 'bg-cyan-900 text-cyan-200' : 'bg-gray-900 text-gray-600'}`}>
                      {has ? 'CONTINUE' : 'NEW GAME'}
                    </span>
                  </div>
                  <div className="text-sm text-gray-300">{(t.name.split('(')[1] || '').replace(')', '') || t.name}</div>
                  {has ? (
                    <>
                      <div className="text-[11px] text-cyan-400 mt-1">
                        {save.rank || 'G'}ランク / {save.materials}G / 装備{(save.inventory || []).length}点
                      </div>
                      <div className="text-[10px] text-cyan-800">{save.savedAt}</div>
                    </>
                  ) : (
                    <div className="text-[10px] text-gray-600 mt-1">HP:{t.hp} ATK:{t.atk} DEF:{t.def} SPD:{t.spd}</div>
                  )}
                </button>
                {has && (
                  <div className="px-4 pb-2 flex justify-end">
                    <button
                      onClick={() => {
                        if (confirmDelete === type) { handleDeleteSlot(type); setConfirmDelete(null); }
                        else setConfirmDelete(type);
                      }}
                      className={`text-[10px] px-2 py-0.5 rounded border transition-all ${
                        confirmDelete === type
                          ? 'bg-red-900 border-red-500 text-red-200 font-bold'
                          : 'border-gray-700 text-gray-600 hover:border-red-800 hover:text-red-400'
                      }`}
                    >
                      {confirmDelete === type ? '本当に削除する?' : 'データを消す'}
                    </button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  return (
    <div className="flex flex-col min-h-screen bg-gray-950 text-cyan-400 font-mono p-2 md:p-4 max-w-5xl mx-auto transition-colors duration-1000">
      <div className="flex justify-between items-center bg-gray-900/80 p-3 rounded-lg border border-cyan-800 mb-4">
        <div className="font-black tracking-widest text-white">
          {fighter ? TYPES[fighter.type].name.split(' ')[0] : 'GUEST'}
        </div>
        <div className="flex gap-3 items-center text-sm font-bold">
          <button
            onClick={handleSave}
            disabled={!fighter}
            className={`text-[10px] font-black tracking-widest px-2 py-1 rounded border transition-all duration-200 disabled:opacity-30 disabled:cursor-not-allowed ${
              saveFlash
                ? 'bg-green-900/60 border-green-500 text-green-300 shadow-[0_0_8px_rgba(34,197,94,0.5)]'
                : 'bg-transparent border-gray-700 text-gray-500 hover:border-cyan-700 hover:text-cyan-400'
            }`}
          >
            {saveFlash ? '✓ SAVED' : 'SAVE'}
          </button>
          {/* ロード:直前のセーブ地点まで巻き戻す。誤操作を防ぐため2度押しで実行する */}
          <button
            onClick={() => {
              if (confirmLoad) { handleLoad(); setConfirmLoad(false); }
              else { setConfirmLoad(true); setTimeout(() => setConfirmLoad(false), 3000); }
            }}
            disabled={!fighter || phase === 'arena'}
            className={`text-[10px] font-black tracking-widest px-2 py-1 rounded border transition-all duration-200 disabled:opacity-30 disabled:cursor-not-allowed ${
              confirmLoad
                ? 'bg-amber-900/60 border-amber-500 text-amber-200'
                : 'bg-transparent border-gray-700 text-gray-500 hover:border-amber-700 hover:text-amber-400'
            }`}
          >
            {confirmLoad ? 'ロードする?' : 'LOAD'}
          </button>
          {/* タイトルへ戻る:未保存の内容は失われるため2度押しで実行する */}
          <button
            onClick={() => {
              if (confirmTitle) { handleReturnToTitle(); setConfirmTitle(false); }
              else { setConfirmTitle(true); setTimeout(() => setConfirmTitle(false), 3000); }
            }}
            disabled={phase === 'arena'}
            className={`text-[10px] font-black tracking-widest px-2 py-1 rounded border transition-all duration-200 disabled:opacity-30 disabled:cursor-not-allowed ${
              confirmTitle
                ? 'bg-red-900/60 border-red-500 text-red-200'
                : 'bg-transparent border-gray-700 text-gray-500 hover:border-red-700 hover:text-red-400'
            }`}
          >
            {confirmTitle ? '戻る?(未保存は消える)' : 'TITLE'}
          </button>
          <span className="flex items-center gap-1">
            <IconZap size={16} className="text-yellow-400" />
            <span className="text-white">{syncRatio}%</span>
          </span>
          <span className="flex items-center gap-1">
            <IconBattery size={16} className="text-green-500" />
            <span className="text-white">{materials}G</span>
          </span>
          <span className={`flex items-center gap-1 px-2 py-0.5 rounded border ${rank === 'S' ? 'border-amber-400 bg-gradient-to-r from-amber-950 to-fuchsia-950 shadow-[0_0_10px_rgba(251,191,36,0.35)]' : 'border-amber-700 bg-amber-950/40'}`}>
            <span className={`font-black text-xs ${rank === 'S' ? 'text-amber-300' : 'text-amber-400'}`}>{rank === 'S' ? '★S' : rank}</span>
            {getDisplayThreshold(rank) !== undefined && (
              <span className="text-amber-200 text-[10px]">{rankPoints}/{getDisplayThreshold(rank)}</span>
            )}
            {worldTournamentEligible && (rank === 'A' || rank === 'S') && <span className="text-fuchsia-300 text-[10px] font-bold">★挑戦権</span>}
          </span>
          <button
            onClick={toggleSfx}
            title={sfxOn ? 'ミュート' : 'ミュート解除'}
            className={`p-1 rounded border text-xs transition-colors ${
              sfxOn ? 'border-cyan-800 text-cyan-400 hover:bg-gray-800' : 'border-gray-700 text-gray-600 hover:bg-gray-800'
            }`}
          >
            {sfxOn ? '🔊' : '🔇'}
          </button>
        </div>
      </div>

      <div className="flex items-center gap-4 mb-4 pb-2 border-b border-cyan-900">
        {phase !== 'room' && (
          <button onClick={() => setPhase('room')} className="p-2 bg-gray-900 border rounded hover:bg-gray-800 border-gray-700">
            <IconArrowLeft size={20} />
          </button>
        )}
        <h2 className="text-xl font-black uppercase tracking-widest text-cyan-300">
          {phase.replace('_', ' ')}
        </h2>
      </div>

      <div className="flex-grow flex flex-col overflow-hidden">
        {phase === 'room' && <MasterRoom setPhase={setPhase} fighter={fighter} syncRatio={syncRatio} stats={currentStats()} inventory={inventory} equipped={equipped} />}
        {phase === 'closet' && <Closet inventory={inventory} setInventory={setInventory} equipped={equipped} setEquipped={setEquipped} stats={currentStats()} fighter={fighter} addLog={addLog} setPhase={setPhase} setMaterials={setMaterials} />}
        {phase === 'generator' && <Generator materials={materials} setMaterials={setMaterials} inventory={inventory} setInventory={setInventory} addLog={addLog} />}
        {phase === 'arena' && <ArenaBattle stats={currentStats()} setPhase={setPhase} addLog={addLog} materials={materials} setMaterials={setMaterials} setInventory={setInventory} inventory={inventory} equipped={equipped} rank={rank} rankPoints={rankPoints} worldTournamentEligible={worldTournamentEligible} addRankPoints={addRankPoints} winWorldTournament={winWorldTournament} resetWorldTournamentEligibility={resetWorldTournamentEligibility} defenseAvailable={defenseAvailable} loseDefense={loseDefense} setActiveEnemy={setActiveEnemy} />}
      </div>

      {/* 下部パネル:戦闘中は敵データ、それ以外は通常のシステムログを表示する。
          戦闘中の全体ログはほぼ流れないため、限られた画面を敵の情報に充てている。
          TODO: 敵に武器の概念を実装したら、この欄に所持武装の射程('近/中/遠/列/広')
                などを一覧表示する(残弾やHEATは表示しない想定)。 */}
      {activeEnemy ? (
        <div className="mt-4 border border-red-900 bg-gray-950 p-3 h-28 overflow-y-auto text-xs rounded-lg shadow-inner">
          <div className="flex items-center justify-between mb-1.5 pb-1 border-b border-red-900/50">
            <span className="text-red-400 font-bold tracking-widest text-[10px]">ENEMY DATA</span>
            <span className={`text-[11px] font-bold ${activeEnemy.isOopa ? 'text-fuchsia-300' : activeEnemy.isRival ? 'text-fuchsia-400' : 'text-red-300'}`}>
              {activeEnemy.isRival && '★ '}{activeEnemy.name}
            </span>
          </div>
          <div className="grid grid-cols-5 gap-x-2 gap-y-1 text-[10px] mb-1">
            <div><span className="text-gray-500">HP </span><span className="text-white">{activeEnemy.hp}/{activeEnemy.maxHp}</span></div>
            <div><span className="text-gray-500">ATK </span><span className="text-white">{activeEnemy.atk}</span></div>
            <div><span className="text-gray-500">DEF </span><span className="text-white">{activeEnemy.def}</span></div>
            <div><span className="text-gray-500">SPD </span><span className="text-white">{activeEnemy.spd}</span></div>
            {/* 交互行動制では敵の残APが「あと何手番動けるか」を示す重要な情報になる */}
            <div><span className="text-gray-500">AP </span><span className="text-blue-300 font-bold">{activeEnemy.ap ?? 0}</span></div>
          </div>
          {/* HPバー:数値だけだと残量が掴みにくいので視覚化する */}
          <div className="h-1.5 bg-gray-900 rounded overflow-hidden mb-1.5 border border-gray-800">
            <div
              className={`h-full transition-all duration-300 ${
                activeEnemy.hp / activeEnemy.maxHp > 0.5 ? 'bg-red-600'
                : activeEnemy.hp / activeEnemy.maxHp > 0.25 ? 'bg-orange-500' : 'bg-yellow-400'
              }`}
              style={{ width: `${Math.max(0, (activeEnemy.hp / activeEnemy.maxHp) * 100)}%` }}
            ></div>
          </div>
          {/* アーキタイプごとの戦い方を明示する(何をしてくる相手か分かるように) */}
          {activeEnemy.archetype && ENEMY_ARCHETYPES[activeEnemy.archetype] && (
            <div className="text-[10px] mb-1.5">
              <span className="text-amber-400 font-bold">{ENEMY_ARCHETYPES[activeEnemy.archetype].name}</span>
              <span className="text-gray-400 ml-1">
                {{
                  ATTACKER: '常に接近して殴ってくる。防御はほぼしない',
                  TANK: '前に出て粘る。早めに防御を固める',
                  EVASION: '距離を取って戦う。近づくと離れる/レーンをずらす',
                  AIM: '射線を作ることを最優先。レーンを合わせてくる',
                }[activeEnemy.archetype]}
              </span>
            </div>
          )}
          {/* 所持武装。射程だけを見せる(残弾やHEATは表示しない方針。戦闘ログで分かる) */}
          {(activeEnemy.weapons || []).length > 0 && (
            <div className="flex flex-wrap gap-1 items-center mb-1">
              <span className="text-[10px] text-gray-500 shrink-0">ARMS</span>
              {activeEnemy.weapons.map((w, i) => (
                <span key={i} className="text-[9px] px-1 rounded border bg-red-950/40 text-red-200 border-red-800">
                  {w.name}<span className="text-red-400">[{w.range}]</span>
                </span>
              ))}
            </div>
          )}
          {/* 所持スキル(未使用/使用済み)。何が飛んでくるか事前に読めるようにする */}
          {(activeEnemy.skills || []).length > 0 && (
            <div className="flex flex-wrap gap-1 items-center">
              <span className="text-[10px] text-gray-500 shrink-0">SKILL</span>
              {activeEnemy.skills.map(sk => {
                const used = (activeEnemy.usedSkills || []).includes(sk);
                const label = OOPA_SKILL_NAMES[sk] || ENEMY_SKILL_NAMES[sk] || sk;
                return (
                  <span key={sk} className={`text-[9px] px-1 rounded border ${used ? 'bg-gray-900 text-gray-600 border-gray-800' : 'bg-pink-950/50 text-pink-300 border-pink-800'}`}>
                    {label}{used && '(済)'}
                  </span>
                );
              })}
            </div>
          )}
          {/* 現在かかっている状態 */}
          {(activeEnemy.limiterActive || activeEnemy.evasion || activeEnemy.shieldActive || activeEnemy.nextCrit || (activeEnemy.height || 0) >= 2 || (activeEnemy.repairTurns || 0) > 0 || (activeEnemy.stunTurns || 0) > 0 || (activeEnemy.noAttackTurns || 0) > 0 || (activeEnemy.lockMoveTurns || 0) > 0 || (activeEnemy.lockAttackTurns || 0) > 0 || (activeEnemy.sealSkillTurns || 0) > 0 || (activeEnemy.gravityTurns || 0) > 0 || (activeEnemy.burnTurns || 0) > 0) && (
            <div className="flex flex-wrap gap-1 items-center mt-1">
              <span className="text-[10px] text-gray-500 shrink-0">STATE</span>
              {activeEnemy.limiterActive && <span className="text-[9px] px-1 rounded bg-fuchsia-900 text-fuchsia-200 border border-fuchsia-600">リミッター解除{activeEnemy.limiterTurnsLeft}T</span>}
              {activeEnemy.evasion && <span className="text-[9px] px-1 rounded bg-yellow-900 text-yellow-200 border border-yellow-600">回避構え</span>}
              {activeEnemy.shieldActive && <span className="text-[9px] px-1 rounded bg-purple-900 text-purple-200 border border-purple-600">防壁</span>}
              {activeEnemy.nextCrit && <span className="text-[9px] px-1 rounded bg-orange-900 text-orange-200 border border-orange-600">狙撃準備</span>}
              {(activeEnemy.repairTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-green-900 text-green-200 border border-green-600">自己修復{activeEnemy.repairTurns}T</span>}
              {(activeEnemy.lockMoveTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-red-900 text-red-200 border border-red-600">移動封鎖</span>}
              {(activeEnemy.lockAttackTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-red-900 text-red-200 border border-red-600">武装凍結</span>}
              {(activeEnemy.sealSkillTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-red-900 text-red-200 border border-red-600">スキル封印</span>}
              {(activeEnemy.gravityTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-indigo-900 text-indigo-200 border border-indigo-500">重力異常</span>}
              {(activeEnemy.burnTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-orange-900 text-orange-200 border border-orange-500">炎上{activeEnemy.burnTurns}T</span>}
              {(activeEnemy.stunTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-gray-800 text-gray-300 border border-gray-600">反動で行動不能{activeEnemy.stunTurns}T</span>}
              {(activeEnemy.noAttackTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-gray-800 text-gray-300 border border-gray-600">再装填中{activeEnemy.noAttackTurns}T</span>}
            </div>
          )}
        </div>
      ) : (
        <div className="mt-4 border border-cyan-900 bg-gray-950 p-3 h-28 overflow-y-auto text-xs rounded-lg shadow-inner text-green-400">
          {logs.length === 0 && <div className="text-gray-700 italic">システムログ...</div>}
          {logs.map((log, i) => <div key={i} className="mb-1 leading-relaxed opacity-90">{log}</div>)}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
