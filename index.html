const ENEMY_LOADOUT = {
  ATTACKER: { low: { MELEE: 1 },            mid: { MELEE: 2 },            high: { MELEE: 2, SHOOT: 1 } },
  TANK:     { low: { MELEE: 1 },            mid: { MELEE: 1 },            high: { MELEE: 2 } },
  EVASION:  { low: { SHOOT: 1 },            mid: { SHOOT: 2 },            high: { SHOOT: 2, MELEE: 1 } },
  AIM:      { low: { SHOOT: 1 },            mid: { SHOOT: 1, BACK_SHOOT: 1 }, high: { BACK_SHOOT: 2, SHOOT: 1 } },
  // 空戦型:上空から撃ち下ろす。補助ユニットのぶん武装は控えめ
  AIRBORNE: { low: { SHOOT: 1 },            mid: { SHOOT: 2 },            high: { SHOOT: 2, MELEE: 1 } },
  // 強襲型:空から最短距離で詰めて殴る。近接主体
  ASSAULT:  { low: { MELEE: 1 },            mid: { MELEE: 2 },            high: { MELEE: 2, SHOOT: 1 } },
};
const getLoadoutTier = (rank) => ['G','F','E'].includes(rank) ? 'low' : ['D','C','B'].includes(rank) ? 'mid' : 'high';

// 敵の装備を生成する。プレイヤーのactiveWeaponsと同じ形(残弾/HEATを持つ)にして、
// 攻撃処理を共通の考え方で書けるようにしている。
const generateEnemyWeapons = (archetype, rank) => {
  const tier = getLoadoutTier(rank);
  const plan = (ENEMY_LOADOUT[archetype] || ENEMY_LOADOUT.ATTACKER)[tier] || { MELEE: 1 };
  const weapons = [];
  Object.entries(plan).forEach(([category, count]) => {
    const pool = ENEMY_WEAPONS[category] || ENEMY_WEAPONS.MELEE;
    // 同じ武器を2本持つと見た目が単調になるため、可能な限り重複を避けて抽選する
    const available = [...pool];
    for (let i = 0; i < count; i++) {
      const idx = Math.floor(Math.random() * available.length);
      const base = available.length > 0 ? available.splice(idx, 1)[0] : pool[Math.floor(Math.random() * pool.length)];
      weapons.push({
        ...base,
        currentAmmo: base.maxAmmo || 0,
        currentHeat: 0,
        maxHeat: 100,
      });
    }
  });
  return weapons;
};

// --- 敵のアクティブスキル ---
// ランクが上がるほど、敵もEX_SPECIALS相当のスキルを使うようになる。
// HEAL/CRITICAL/EVASION/SHIELDは自分自身に効く効果なのでプレイヤー用ロジックをほぼ流用できる。
// WEAKEN/ARMOR_BREAK(プレイヤーへのデバフ)、STUN(次ターンAP0)、AP_BOOST(敵の2行動化)は
// 敵専用の解釈で実装している(仕様書4-4節を参照)。
const ENEMY_SKILL_POOL_BY_RANK = {

  F: { count: 0, pool: [] },
  E: { count: 1, pool: ['HEAL', 'CRITICAL'] },
  D: { count: 1, pool: ['HEAL', 'CRITICAL'] },
  C: { count: 1, pool: ['HEAL', 'CRITICAL', 'EVASION', 'SHIELD'] },
  B: { count: 2, pool: ['HEAL', 'CRITICAL', 'EVASION', 'SHIELD'] },
  // 段階4で追加した攻撃系・行動阻害系も上位ランクの敵は使ってくる
  A: { count: 2, pool: ['HEAL', 'CRITICAL', 'EVASION', 'SHIELD', 'WEAKEN', 'ARMOR_BREAK', 'STUN', 'AP_BOOST',

                        'PIERCE_SHOT', 'BLAST_ROUND', 'BURN_SHOT', 'RECKLESS', 'LOCK_MOVE', 'LOCK_ATTACK', 'BREAK_ARMS', 'SEAL_SKILL', 'GRAVITY'] },
};
const ENEMY_SKILL_NAMES = {

  WEAKEN: '弱体化', ARMOR_BREAK: '装甲破壊', STUN: 'スタン', AP_BOOST: 'APブースト',
  PIERCE_SHOT: '貫通射撃', BLAST_ROUND: '爆裂弾', BURN_SHOT: '焼夷弾', RECKLESS: '捨て身の一撃',
  LOCK_MOVE: '移動封鎖', LOCK_ATTACK: '武装凍結', BREAK_ARMS: '武装破壊',
  SEAL_SKILL: 'スキル封印', GRAVITY: '重力異常',
};
// ランクに応じて敵の所持スキルを抽選する(重複なし)。
const pickEnemySkills = (rank) => {
  const conf = ENEMY_SKILL_POOL_BY_RANK[rank] || ENEMY_SKILL_POOL_BY_RANK.G;
  if (conf.count <= 0 || conf.pool.length === 0) return [];
  const available = [...conf.pool];
  const picked = [];
  for (let i = 0; i < conf.count && available.length > 0; i++) {
    const idx = Math.floor(Math.random() * available.length);
    picked.push(available.splice(idx, 1)[0]);
  }
  return picked;
};

// ライバル4体。statBonusはランク・アーキタイプの計算結果にさらに+25%乗せる形(暫定値、要調整)。
// TODO: 専用立ち絵が用意でき次第、TYPE-A同様CHARA_ART的な仕組みで差し替える。現状はSVGプレースホルダー。
const RIVALS = {
  CELES: { name: 'セリス', rank: 'B', statBonus: 'atk' },
  MAXIMUM: { name: 'マキシマム', rank: 'B', statBonus: 'def' },
  VESTEPHA: { name: 'ベステファ', rank: 'A', statBonus: 'spd' },
  TINY: { name: 'ティニー', rank: 'A', uniqueSkill: 'LIMITER_RELEASE' },
};
const RIVALS_BY_RANK = { B: ['CELES', 'MAXIMUM'], A: ['VESTEPHA', 'TINY'] };
const RIVAL_STAT_BONUS_MULT = 1.25; // ライバルのテーマ補正倍率(暫定値)
const RIVAL_ENCOUNTER_RATE = 0.25;  // B/Aランクでライバルが出現する確率(暫定、目安「8枠中2枠」相当)

// ランク別に「ランダム名前 or ライバル」を抽選する。世界大会実装時はincludeWorldRivalsをtrueにして
// ライバル4体全員(B/A両方)をプールに混ぜる想定(現状は未使用の引数)。
const WORLD_RIVAL_ENCOUNTER_RATE = 0.5; // 世界大会でのライバル遭遇率(大舞台なので強豪と当たりやすい)
// excludeNames: 既に撃破した相手の名前リスト。トーナメント中、一度倒した相手が
// 再び現れないようにするために使う(勝ち上がり式のトーナメントとして自然な挙動にする)。
const pickEnemyIdentity = (rank, includeWorldRivals = false, excludeNames = []) => {
  const rivalPool = (includeWorldRivals
    ? Object.keys(RIVALS)
    : (RIVALS_BY_RANK[rank] || [])
  ).filter(k => !excludeNames.includes(RIVALS[k].name));
  const encounterRate = includeWorldRivals ? WORLD_RIVAL_ENCOUNTER_RATE : RIVAL_ENCOUNTER_RATE;
  if (rivalPool.length > 0 && Math.random() < encounterRate) {
    const rivalKey = rivalPool[Math.floor(Math.random() * rivalPool.length)];
    return { isRival: true, rivalKey, name: RIVALS[rivalKey].name };
  }
  const basePool = ENEMY_NAME_POOLS[rank] || ENEMY_NAME_POOLS.G;
  const pool = basePool.filter(n => !excludeNames.includes(n));
  // 全員撃破済みという極端なケースでは、やむを得ず元のプールから選ぶ(進行不能を防ぐため)
  const usePool = pool.length > 0 ? pool : basePool;
  return { isRival: false, rivalKey: null, name: usePool[Math.floor(Math.random() * usePool.length)] };
};

  { name: '湿地帯', variant: 'A', terrain: { '2-2': 'SWAMP', '3-2': 'SWAMP', '4-2': 'SWAMP', '3-1': 'HIGH' } },

// 現在の戦闘で使用中のフィールド。startBattle時にpickArenaField()で差し替える。
// (getTerrainはグローバル関数として全体から参照されているため、モジュール変数で保持する形にしている)
let ARENA_CURRENT_FIELD = ARENA_FIELDS[0];
const pickArenaField = () => {
  ARENA_CURRENT_FIELD = ARENA_FIELDS[Math.floor(Math.random() * ARENA_FIELDS.length)];
  return ARENA_CURRENT_FIELD;
};
// 現在のフィールドの広さ。cols/lanesが未指定のマップは従来の5×3として扱う。
const getFieldCols = () => ARENA_CURRENT_FIELD.cols || DEFAULT_FIELD_COLS;
const getFieldLanes = () => ARENA_CURRENT_FIELD.lanes || DEFAULT_FIELD_LANES;
// 開始位置は対角線上の最遠に配置する(横に広いほど、レーンが多いほど離れて始まる)
const getStartPositions = () => {
  const cols = getFieldCols(), lanes = getFieldLanes();
  return {
    player: { pos: 1, lane: lanes },     // 手前側の端
    enemy:  { pos: cols, lane: 1 },      // 奥側の端(対角)
  };
};

const getTerrain = (pos, lane) => (ARENA_CURRENT_FIELD.terrain[`${pos}-${lane}`]) || 'FLAT';

const getTerrainHeight = (terrain) => {
  if (terrain === 'LOW') return -1;
  if (terrain === 'SWAMP') return -1;  // 沼地は窪地と同じく低い(射程が縮む)
  if (terrain === 'HIGH') return 1;
  if (terrain === 'WALL') return 1;
  if (terrain === 'TREE_LOW') return 1;   // 背の低い木は障害物相当
  if (terrain === 'TREE_HIGH') return 1;  // 背の高い木は高台相当
  return 0;
};

const getTerrainLabel = (terrain) => {
  if (terrain === 'LOW') return '窪地';
  if (terrain === 'SWAMP') return '沼地';
  if (terrain === 'RIVER') return '川';
  if (terrain === 'HIGH') return '高台';
  if (terrain === 'WALL') return '障害物';
  if (terrain === 'TREE_LOW') return '低木';
  if (terrain === 'TREE_HIGH') return '高木';
  return '平地';
};

// --- 木々の判別システム ---
// 低木(TREE_LOW)=障害物相当、高木(TREE_HIGH)=高台相当だが、隣接するまでどちらか判別できない。
// 判別前は安全側に倒して「障害物」として扱う(射線を遮り、侵入もできない)。
// 判別状態は戦闘ごとにリセットされ、プレイヤー・敵それぞれ別に管理する(双方とも手探り)。
const TREE_TERRAINS = ['TREE_LOW', 'TREE_HIGH'];
const isTreeTerrain = (terrain) => TREE_TERRAINS.includes(terrain);

// 隣接判定(距離1以内。斜めも隣接として扱う)。フィールドが広くなったら距離2以内への変更を検討。
const isAdjacentTo = (fromPos, fromLane, toPos, toLane) =>
  Math.abs(fromPos - toPos) <= 1 && Math.abs(fromLane - toLane) <= 1;

// 観測者(プレイヤー/敵)から見た「実効地形」を返す。未判別の木は'WALL'として扱う。
// revealedSetは判別済みマスのキー("pos-lane")のSet。
const hasRevealed = (revealed, key) => {
  if (!revealed) return false;
  return Array.isArray(revealed) ? revealed.includes(key) : revealed.has(key);
};
const addRevealed = (revealed, key) => {
  if (Array.isArray(revealed)) { if (!revealed.includes(key)) revealed.push(key); }
  else { revealed.add(key); }
};
const getEffectiveTerrain = (pos, lane, revealed) => {
  const actual = getTerrain(pos, lane);
  if (!isTreeTerrain(actual)) return actual;
  return hasRevealed(revealed, `${pos}-${lane}`) ? actual : 'WALL';
};

// 観測者の現在位置から隣接する未判別の木を判別する。判別した木のリストを返す。
const revealAdjacentTrees = (pos, lane, revealed) => {
  const newlyRevealed = [];
  for (let tp = 1; tp <= getFieldCols(); tp++) {
    for (let tl = 1; tl <= getFieldLanes(); tl++) {
      const key = `${tp}-${tl}`;
      if (hasRevealed(revealed, key)) continue;
      if (!isTreeTerrain(getTerrain(tp, tl))) continue;
      if (!isAdjacentTo(pos, lane, tp, tl)) continue;
      addRevealed(revealed, key);
      newlyRevealed.push({ pos: tp, lane: tl, terrain: getTerrain(tp, tl) });
    }
  }
  return newlyRevealed;
};

// 沼地にいる攻撃側の命中率ペナルティ(%)。足を取られて狙いが定まらない表現。
// getEvasionChanceのattackerAccから差し引く形で使うため、相手の回避率が上がる方向に働く。
const SWAMP_ACC_PENALTY = 12;
const getTerrainAccPenalty = (terrain) => terrain === 'SWAMP' ? SWAMP_ACC_PENALTY : 0;

// 川にいる/川へ入る際の移動コスト倍率。FLY(高度2)での移動は影響を受けない。
const getMoveCostMultiplier = (terrain) => terrain === 'RIVER' ? 2 : 1;

const getSyncMultiplier = (s) =>
  s < 50 ? 0.7 + 0.3 * (s / 50) : s <= 100 ? 1.0 + 0.2 * ((s - 50) / 50) : 1.2 + 0.3 * ((s - 100) / 50);

// =========================================================================
// SYNC RATIO (1-B 段階1)
// -------------------------------------------------------------------------
// シンクロ率を2つの値に分ける。
//   syncMax   … 上限。起動シークエンス(2-D)で初期値が決まり、育成(5-A)で引き上げる
//   syncRatio … 現在値。戦闘で消耗し、メンテナンス(4-B)で syncMax まで回復する
//
// 【段階1の範囲】
//   state化・セーブ対応・上限の概念の導入まで。消耗と回復のルールは
//   メンテナンスモード(4-B)と同時に有効化する。回復手段が無い状態で
//   消耗だけ入れると、減り続けて詰むため。
//   したがって現状 syncRatio は変動せず、ゲームの挙動は v1.33.0 と同一。
//
// 【SYNC_BASE = 150 の意味】
//   現行ARENAの敵倍率は、シンクロ率150%(= x1.50)を前提に調整されている。
//   起動シークエンスでどの選択をしてもここを下回らないようにすることで、
//   既存のバランス調整を一切崩さずに済む。正解ルートはこの上に乗る
//   上振れとして扱う。逆にここを下げると低〜中ランクの再調整が必要になる。
//
//   getSyncMultiplier は意図的に変更していない。この式に触れると
//   ARENA全体の難易度が動くため、段階1では固定する。
// =========================================================================
const SYNC_BASE = 150;   // 起動シークエンスの最低保証。現行バランスの基準点 (x1.50)
const SYNC_CAP  = 250;   // 育成で到達しうる天井 (x2.10)

const clampSync = (v) => Math.max(0, Math.min(SYNC_CAP, Math.round(v)));

// 起動シークエンス(2-D)の結果 → syncMax の初期値。
// TYPEごとの正解操作(タップ/スワイプ/ホールド)の判定結果を受け取る。
//   GREAT … 正解。PLAIN との差は最大でも x1.62 対 x1.50 で、初回の選択が
//           取り返しのつかない格差にならない幅に収めてある
//   GOOD  … 惜しい操作
//   PLAIN … 外した操作。ここが SYNC_BASE の下限保証にあたる
// 2-D の実装時はこの関数を呼んで setSyncMax / setSyncRatio するだけで済む。
const BOOT_SYNC_MAX = { GREAT: 170, GOOD: 160, PLAIN: SYNC_BASE };
const resolveBootSyncMax = (result) => clampSync(BOOT_SYNC_MAX[result] || SYNC_BASE);

// SPD差に基づく回避率(%)。速い側が遅い側を攻撃されるほど回避しやすくなる。
// defenderEva(頭部装備等の回避率補正)は加算、attackerAcc(命中率補正)は減算。0〜35%の範囲でクランプ。
const getEvasionChance = (defenderSpd, attackerSpd, defenderEva = 0, attackerAcc = 0) =>
  Math.min(35, Math.max(0, (defenderSpd - attackerSpd) * 1.5 + defenderEva - attackerAcc));

// =========================================================================
// VISUAL ASSETS  ※画像・見た目関連はすべてこのセクションに集約する
// =========================================================================
// --- 戦闘フィールドの地形ビジュアル ---
// 各地形タイプの見た目をSVGで定義。将来的に画像素材が用意できたら、ここの
// SVG(render)を <img src={...} /> に差し替えるだけで移行できる構造にしている
// (CHARA_ART / WEAPON_VISUALS と同じ考え方)。
// baseClass はマス自体の下地スタイル、render(key) はその上に重ねるSVG。
const TERRAIN_VISUALS = {
  FLAT: {
    baseClass: 'bg-gray-950/40 border border-gray-800/40',

// -------------------------------------------------------------------------
// レイヤー定義のスキーマ。実素材(型/シルエット画像)が未着手のため、
// 実データではなく形式の記録として置いてある。
//
//   {
//     item:   'ITEM_VISUALS のキー',
//     slot:   'CHARA_ANCHORS の部位名',
//     z:      重なり順(小さいほど奥)。キャラクター本体は 10 とする,
//     attach: { x, y },   // アイテム画像内での接続点(比率)。武器なら柄、
//                         // 籠手なら手首側の端、髪ならつむじ
//     heightRatio: 0.21,  // キャラ表示高さに対する表示高さ。画像の解像度が
//                         // 変わっても値が生き残るよう、pxではなく比率で持つ
//     rotate: 0,          // anchor.angle からの差分
//     flip:  false,
//     pair:  true,        // 対になるアンカーへ反転コピーを自動生成する
//   }
//
// 【z の目安】
//   2  髪(後ろ)      ← 体より奥。つむじ側が体に隠れる
//   5  背部(ウィング/キャノン/ブレード)
//   10 キャラクター本体
//   20 インナー  22 ボトムス  24 トップス
//   26 腕部(籠手・リストバンド)  28 脚部(ブーツ)
//   30 頭部(バイザー)
//   34 髪(前・サイドバング)
//   40 手持ち武器・シールド
//
// 【髪について】
//   髪は装備と構造が違う。体を前後から挟む2枚組で、
//   前髪と後ろ髪は同じ髪型として連動して切り替わる必要がある。
//   後ろ髪につむじから頭頂部が描き込まれているのは意図的で、
//   最背面に置けばベースの頭部が覆い隠し、前髪との位置合わせがしやすくなる。
//   TYPE-A髪無しベースでの実測値:
//     前髪   attach { x: 0.5034, y: 0.0104 }
//     後ろ髪 attach { x: 0.5820, y: 0.0065 }  ← 分け目が中央から外れている
// -------------------------------------------------------------------------

const generateHashData = (str) => {
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  const color = '#' + '00000'.substring(0, 6 - (hash & 0x00FFFFFF).toString(16).toUpperCase().length) + (hash & 0x00FFFFFF).toString(16).toUpperCase();
  const saltedHash = hash + (Date.now() % 10);
  return { color, val1: Math.abs(saltedHash % 15) + 5, val2: Math.abs((saltedHash >> 2) % 10) + 1, val3: Math.abs((saltedHash >> 4) % 8) };
};

// カテゴリー内バリエーション(アーキタイプ)。light/normal/heavy = 30/40/30%。
// TODO: 型(シルエット)画像が実装され次第、oversizeScaleをROTATE型アンカーのscale(sx,sy)に
//       そのまま使う想定(FIXED型カテゴリーは将来別のスケール値に分ける可能性あり、現状は暫定で共用)。
const ARCHETYPE_SCALE = {
  light: { sx: 0.95, sy: 0.87 },
  normal: { sx: 1, sy: 1 },
  heavy: { sx: 1.07, sy: 1.2 },
};
const getArchetype = (hashData) => {
  const roll = (hashData.val1 + hashData.val2 * 3 + hashData.val3 * 7) % 10;
  if (roll <= 2) return 'light';
  if (roll <= 6) return 'normal';
  return 'heavy';
};

// カテゴリー別のステータス計算式(共有関数)。通常クラフト(handleGenerateEquip)と
// 大会限定アイテム生成(generateTournamentRewardItem)の両方から呼ばれる。
const generateItemStats = (category, archetype, hashData) => {
  let hp = 0, atk = 0, def = 0, spd = 0, acc = 0, eva = 0, range = null, maxAmmo = null, heatRate = null, flightTurns = null;
  switch (category) {
    case 'HEAD':
      if (archetype === 'light') { eva = hashData.val1 % 8 + 6; spd = hashData.val3; def = Math.floor(hashData.val3 / 2); }
      else if (archetype === 'heavy') { acc = hashData.val1 % 8 + 6; def = hashData.val3 + 3; spd = -Math.floor(hashData.val2 / 3); }
      else { eva = hashData.val1 % 4 + 2; acc = hashData.val2 % 4 + 2; def = hashData.val3; }
      break;
    case 'MELEE':
      range = '近';
      if (archetype === 'light') { atk = hashData.val1 + 4; spd = hashData.val3 + 2; heatRate = hashData.val2 * 3 + 12; }
      else if (archetype === 'heavy') { atk = hashData.val1 + 18; spd = hashData.val3 - 6; heatRate = hashData.val2 * 7 + 30; }
      else { atk = hashData.val1 + 10; spd = hashData.val3; heatRate = hashData.val2 * 5 + 20; }
      break;
    case 'SHOOT':
      range = ['中', '遠', '列', '広'][hashData.val2 % 4];
      if (archetype === 'light') { atk = hashData.val1 + 1; spd = -hashData.val3 + 3; maxAmmo = hashData.val1 % 6 + 7; }
      else if (archetype === 'heavy') { atk = hashData.val1 + 12; spd = -hashData.val3 - 4; maxAmmo = hashData.val1 % 3 + 1; }
      else { atk = hashData.val1 + 5; spd = -hashData.val3; maxAmmo = hashData.val1 % 6 + 3; }
      break;
    case 'SHIELD':
      if (archetype === 'light') { hp = hashData.val1 * 2; def = hashData.val1 + 2; spd = -Math.floor(hashData.val2 / 2) + 2; }
      else if (archetype === 'heavy') { hp = hashData.val1 * 4; def = hashData.val1 + 10; spd = -(hashData.val2 + 4); }
      else { hp = hashData.val1 * 3; def = hashData.val1 + 5; spd = -(hashData.val2); }
      break;
    case 'BACK_MELEE':
      range = '近';
      if (archetype === 'light') { atk = hashData.val1 + 9; spd = -hashData.val3 + 2; heatRate = hashData.val1 * 3 + 15; }
      else if (archetype === 'heavy') { atk = hashData.val1 + 23; spd = -(hashData.val3 + 8); heatRate = hashData.val1 * 7 + 35; }
      else { atk = hashData.val1 + 15; spd = -(hashData.val3 + 2); heatRate = hashData.val1 * 5 + 25; }
      break;
    case 'BACK_SHOOT':
      range = ['中', '遠', '列', '広'][hashData.val3 % 4];
      if (archetype === 'light') { atk = hashData.val1 + 6; spd = -hashData.val2 + 1; maxAmmo = hashData.val2 % 4 + 5; }
      else if (archetype === 'heavy') { atk = hashData.val1 + 19; spd = -(hashData.val2 + 8); maxAmmo = hashData.val2 % 2 + 1; }
      else { atk = hashData.val1 + 12; spd = -(hashData.val2 + 4); maxAmmo = hashData.val2 % 4 + 2; }
      break;
    case 'BACK_SUPPORT':
      if (archetype === 'light') { hp = hashData.val1; spd = hashData.val1 + 9; flightTurns = 2 + (hashData.val3 % 2); }
      else if (archetype === 'heavy') { hp = hashData.val1 * 3; spd = hashData.val1 + 2; flightTurns = 5 + (hashData.val3 % 3); }
      else { hp = hashData.val1 * 2; spd = hashData.val1 + 5; flightTurns = 3 + (hashData.val3 % 4); }
      break;
    case 'TOPS':
      if (archetype === 'light') { hp = hashData.val1 * 2; def = hashData.val3; spd = hashData.val2 % 4 + 2; }
      else if (archetype === 'heavy') { hp = hashData.val1 * 6; def = hashData.val3 + 6; spd = -(hashData.val2 % 4 + 2); }
      else { hp = hashData.val1 * 4; def = hashData.val3 + 2; }
      break;
    case 'BOTTOMS':
      if (archetype === 'light') { def = hashData.val3 + 1; spd = hashData.val2 + 3; }
      else if (archetype === 'heavy') { def = hashData.val3 + 7; spd = hashData.val2 - 4; }
      else { def = hashData.val3 + 3; spd = hashData.val2; }
      break;
    case 'INNER':
      if (archetype === 'light') { hp = hashData.val2; spd = hashData.val1 + 3; }
      else if (archetype === 'heavy') { hp = hashData.val2 * 4; spd = hashData.val1 - 4; }
      else { hp = hashData.val2 * 2; spd = hashData.val1; }
      break;
    case 'SHOES':
      if (archetype === 'light') { def = Math.floor(hashData.val3 / 2); spd = hashData.val1 + 9; }
      else if (archetype === 'heavy') { def = hashData.val3 + 4; spd = hashData.val1 + 1; }
      else { def = hashData.val3; spd = hashData.val1 + 5; }
      break;
  }
  return { hp, atk, def, spd, acc, eva, range, maxAmmo, heatRate, flightTurns };
};

// --- ユニークエフェクトシステム ---
// 通常クラフトでは低確率、大会限定アイテムでは確定で付与される。炎/スパーク/発光はCSSのみで
// 表現可能(新規画像素材不要)。ウェザリングのみ専用テクスチャ(傷/よごれ、ランダムでどちらか1枚)を使う。
// NOTE: 現時点ではデータ(付与・保持)のみ実装。視覚効果としての描画はペーパードール本実装後に対応する。
const UNIQUE_EFFECTS = ['FLAME', 'SPARK', 'GLOW', 'WEATHERING'];
const UNIQUE_EFFECT_NAMES = { FLAME: '炎', SPARK: 'スパーク', GLOW: '発光', WEATHERING: 'ウェザリング' };
const WEATHERING_VARIANTS = ['crack', 'dirt'];
const UNIQUE_EFFECT_NORMAL_RATE = 18; // 通常クラフトの発生率(%)。15〜20%の目安に沿った暫定値。

const rollUniqueEffect = (hashData, chancePercent) => {
  const gateRoll = (hashData.val1 * 7 + hashData.val2 * 3 + hashData.val3) % 100;
  if (gateRoll >= chancePercent) return null;
  const effectType = UNIQUE_EFFECTS[(hashData.val2 + hashData.val3 * 5) % UNIQUE_EFFECTS.length];
  const weatheringVariant = effectType === 'WEATHERING' ? WEATHERING_VARIANTS[hashData.val1 % 2] : null;
  return { type: effectType, weatheringVariant };
};

// --- 大会限定アイテム生成(公式大会優勝報酬) ---
// 「ランク名+カテゴリー接尾語」の自動生成。アーキタイプはheavy固定、全ステータス+30%、
// ユニークエフェクトは確定付与。通常クラフトでは出せない性能を保証する。
const RANK_ITEM_NAMES = { G: 'グッピー', F: 'フォックス', E: 'イーグル', D: 'ドレイク', C: 'ケルベロス', B: 'ベヒモス', A: 'アトラス', S: 'ソブリン' };
const CATEGORY_SUFFIX = {
  MELEE: 'ソード', SHOOT: 'ランチャー', SHIELD: 'シールド', BACK_MELEE: 'ブレード', BACK_SHOOT: 'キャノン',
  BACK_SUPPORT: 'ウィング', HEAD: 'バイザー', TOPS: 'アーマー', BOTTOMS: 'グリーヴ', INNER: 'スーツ', SHOES: 'ブーツ',
};
const TOURNAMENT_REWARD_CATEGORIES = Object.keys(CATEGORY_SUFFIX);
const TOURNAMENT_STAT_BOOST = 1.3;

const generateTournamentRewardItem = (rank) => {
  const category = TOURNAMENT_REWARD_CATEGORIES[Math.floor(Math.random() * TOURNAMENT_REWARD_CATEGORIES.length)];
  const name = `${RANK_ITEM_NAMES[rank] || RANK_ITEM_NAMES.G}${CATEGORY_SUFFIX[category]}`;
  const hashData = generateHashData(name + category + Date.now());
  const archetype = 'heavy';
  const stats = generateItemStats(category, archetype, hashData);
  const boostedStats = { ...stats };
  ['hp', 'atk', 'def', 'spd', 'acc', 'eva'].forEach(k => {
    if (boostedStats[k]) boostedStats[k] = Math.round(boostedStats[k] * TOURNAMENT_STAT_BOOST);
  });
  const uniqueEffect = rollUniqueEffect(hashData, 100);
  return {
    id: Date.now().toString() + '_reward', name, type: category, color: hashData.color,
    ...boostedStats,
    archetype, oversizeScale: ARCHETYPE_SCALE[archetype],
    uniqueEffect, isTournamentReward: true,
  };
};

// オーパ撃破時の特殊報酬。専用装備 / 専用EXチップ / 専用EXモジュール からランダムに1つ。
// いずれも通常クラフトでは入手できない(仕様書7-4節)。
const OOPA_STAT_BOOST = 1.6; // 大会限定装備(+30%)を上回る性能
const generateOopaRewardItem = () => {
  const roll = Math.random();
  const stamp = Date.now().toString();

  // 25%: オーパ製EXチップ(大容量。オーパ製モジュールを複数積むために必要)
  if (roll < 0.25) {
    const hashData = generateHashData('OOPA_CHIP' + stamp);
    return {
      id: stamp + '_oopa_chip', name: 'オーパコア', type: 'EX_CHIP', color: '#f0abfc',
      capacity: OOPA_CHIP_CAPACITY, modules: [], isOopaReward: true,
    };
  }
  // 35%: オーパ製EXモジュール(専用スキル4種のいずれかを付与)
  if (roll < 0.60) {
    const skill = OOPA_SKILLS[Math.floor(Math.random() * OOPA_SKILLS.length)];
    const hashData = generateHashData('OOPA_MODULE' + skill.id + stamp);
    return {
      id: stamp + '_oopa_module', name: `オーパモジュール:${OOPA_SKILL_NAMES[skill.id]}`,
      type: 'EX_MODULE', color: '#f0abfc', cost: OOPA_MODULE_COST,
      hp: 0, atk: 0, def: 0, spd: 0, special: skill.id, isOopaReward: true,
    };
  }
  // 40%: オーパ専用装備(全カテゴリー対応。大会限定装備を上回る性能)
  const category = TOURNAMENT_REWARD_CATEGORIES[Math.floor(Math.random() * TOURNAMENT_REWARD_CATEGORIES.length)];
  const name = `オーパ${CATEGORY_SUFFIX[category]}`;
  const hashData = generateHashData(name + category + stamp);
  const archetype = 'heavy';
  const stats = generateItemStats(category, archetype, hashData);
  const boostedStats = { ...stats };
  ['hp', 'atk', 'def', 'spd', 'acc', 'eva'].forEach(k => {
    if (boostedStats[k]) boostedStats[k] = Math.round(boostedStats[k] * OOPA_STAT_BOOST);
  });
  return {
    id: stamp + '_oopa_gear', name, type: category, color: '#f0abfc',
    ...boostedStats,
    archetype, oversizeScale: ARCHETYPE_SCALE[archetype],
    uniqueEffect: rollUniqueEffect(hashData, 100), isOopaReward: true,
  };
};

  if (CHARA_ART[typeId]) {

    const weapon = equippedWeaponVisual ? WEAPON_VISUALS[equippedWeaponVisual.key] : null;

    let weaponStyle = null, weaponImgStyle = null;
    if (weapon && handData) {
      const wDisplayH = heightPx * weapon.heightRatio;
      const wDisplayW = wDisplayH * (weapon.naturalWidth / weapon.naturalHeight);
      const gxFrac = weapon.grip.x / weapon.naturalWidth;
      const gyFrac = weapon.grip.y / weapon.naturalHeight;
      weaponStyle = {
        position: 'absolute',
        left: `${handData.anchor.xFrac * displayW}px`,
        top: `${handData.anchor.yFrac * heightPx}px`,
        width: 0, height: 0,

      weaponImgStyle = {
        position: 'absolute',

        top: `${-gyFrac * wDisplayH}px`,

        transformOrigin: `${gxFrac * wDisplayW}px ${gyFrac * wDisplayH}px`,

    return (

    <div className={`relative w-full max-w-[280px] ${height} mx-auto flex justify-center items-center select-none touch-none`} style={{ transform: flip ? 'scaleX(-1)' : 'none' }}>

// --- SOUND FX ---
let _audioCtx = null;
let _sfxEnabled = true;

function _ctx() {
  if (!_sfxEnabled) return null;
  try {
    if (!_audioCtx) {
      _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const resume = () => {
        _audioCtx && _audioCtx.resume();
        document.removeEventListener('pointerdown', resume);
        document.removeEventListener('keydown', resume);
      };
      document.addEventListener('pointerdown', resume);
      document.addEventListener('keydown', resume);
    }
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    return _audioCtx;
  } catch { return null; }
}

function _tone(freq, type, duration, vol = 0.22, delay = 0, endFreq) {
  const ctx = _ctx(); if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = type;
  const t = ctx.currentTime + delay;
  osc.frequency.setValueAtTime(freq, t);
  if (endFreq !== undefined) osc.frequency.linearRampToValueAtTime(endFreq, t + duration);
  gain.gain.setValueAtTime(0.001, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.start(t);
  osc.stop(t + duration + 0.05);
}

let _bgmTrack = null;
let _bgmPendingTrack = null;
let _bgmMasterGain = null;
let _bgmLoopTimer = null;

function _bgmScheduleLoop(trackName, loopStart) {
  const ctx = _ctx(); if (!ctx || !_bgmMasterGain) return;
  const pat = _BGM[trackName]; if (!pat) return;
  const beatDur = 60 / pat.bpm;
  const loopLen = pat.bars * beatDur;
  for (const n of pat.notes) {
    const t = loopStart + n.t * beatDur;
    if (t < ctx.currentTime - 0.005) continue;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(_bgmMasterGain);
    o.type = n.type; o.frequency.value = n.freq;
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(n.vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + n.dur);
    o.start(t); o.stop(t + n.dur + 0.06);
  }
  const msUntilNext = Math.max(0, (loopStart + loopLen - ctx.currentTime) * 1000 - 180);
  if (_bgmLoopTimer) clearTimeout(_bgmLoopTimer);
  _bgmLoopTimer = setTimeout(() => {
    if (_bgmTrack === trackName) _bgmScheduleLoop(trackName, loopStart + loopLen);
  }, msUntilNext);
}

const bgm = {
  play(track) {
    if (!_sfxEnabled) return;
    if (_bgmTrack === track && !_bgmPendingTrack) return;
    const ctx = (() => {
      try {
        if (!_audioCtx) {
          _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const resume = () => {
            _audioCtx && _audioCtx.resume();
            document.removeEventListener('pointerdown', resume);
            document.removeEventListener('keydown', resume);
          };
          document.addEventListener('pointerdown', resume);
          document.addEventListener('keydown', resume);
        }
        return _audioCtx;
      } catch { return null; }
    })();
    if (!ctx) return;
    if (ctx.state === 'suspended') {
      _bgmPendingTrack = track;
      ctx.onstatechange = () => {
        if (ctx.state === 'running' && _bgmPendingTrack) {
          const t = _bgmPendingTrack; _bgmPendingTrack = null;
          ctx.onstatechange = null;
          if (_bgmTrack !== t) bgm._switch(t);
        }
      };
      return;
    }
    _bgmPendingTrack = null;
    if (_bgmTrack === track) return;
    this._switch(track);
  },
  _switch(track) {
    const ctx = _ctx(); if (!ctx) return;
    if (!_bgmMasterGain || _bgmMasterGain.context.state === 'closed') {
      _bgmMasterGain = ctx.createGain();
      _bgmMasterGain.gain.value = 0;
      _bgmMasterGain.connect(ctx.destination);
    }
    const FADE = 0.7;
    const hadPrev = !!_bgmTrack;
    _bgmTrack = null;
    if (_bgmLoopTimer) { clearTimeout(_bgmLoopTimer); _bgmLoopTimer = null; }
    const doStart = (startTrack) => {
      const c = _ctx(); if (!c || !_bgmMasterGain) return;
      _bgmTrack = startTrack;
      _bgmMasterGain.gain.cancelScheduledValues(c.currentTime);
      _bgmMasterGain.gain.setValueAtTime(0, c.currentTime);
      _bgmMasterGain.gain.linearRampToValueAtTime(1, c.currentTime + FADE);
      _bgmScheduleLoop(startTrack, c.currentTime);
    };
    if (hadPrev) {
      const c2 = _ctx(); if (!c2 || !_bgmMasterGain) return;
      _bgmMasterGain.gain.cancelScheduledValues(c2.currentTime);
      _bgmMasterGain.gain.setValueAtTime(_bgmMasterGain.gain.value, c2.currentTime);
      _bgmMasterGain.gain.linearRampToValueAtTime(0, c2.currentTime + FADE);
      setTimeout(() => doStart(track), FADE * 1000 + 60);
    } else {
      doStart(track);
    }
  },
  stop() {
    const ctx = _ctx();
    if (ctx && _bgmMasterGain) {
      _bgmMasterGain.gain.cancelScheduledValues(ctx.currentTime);
      _bgmMasterGain.gain.setValueAtTime(_bgmMasterGain.gain.value, ctx.currentTime);
      _bgmMasterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
    }
    _bgmTrack = null;
    _bgmPendingTrack = null;
    if (_bgmLoopTimer) { clearTimeout(_bgmLoopTimer); _bgmLoopTimer = null; }
  },
  restart(track) { _bgmTrack = null; _bgmPendingTrack = null; this.play(track); },
};

const Generator = ({ materials, setMaterials, inventory, setInventory, addLog }) => {
  const [genMode, setGenMode] = useState('EQUIP');
  const [skillType, setSkillType] = useState('EX_CHIP');
  const [prompt, setPrompt] = useState('');
  const [selectedCategory, setSelectedCategory] = useState('MELEE');

  const handleGenerateEquip = () => {
    if (materials < 50) { addLog("[ERROR] マテリアルが不足。(50G必要)"); return; }
    if (!prompt.trim()) { addLog("[ERROR] 設計プロンプトを入力してください。"); return; }
    setMaterials(prev => prev - 50);
    const hashData = generateHashData(prompt + selectedCategory);
    const archetype = getArchetype(hashData);
    const stats = generateItemStats(selectedCategory, archetype, hashData);
    const uniqueEffect = rollUniqueEffect(hashData, UNIQUE_EFFECT_NORMAL_RATE);
    const newItem = {
      id: Date.now().toString(), name: prompt, type: selectedCategory, color: hashData.color,
      ...stats,
      archetype, oversizeScale: ARCHETYPE_SCALE[archetype],
      uniqueEffect,
    };
    setInventory(prev => [...prev, newItem]);
    sfx.craft();
    addLog(`[GENERATOR] 装備「${newItem.name}」(${archetype})を生成しました。${uniqueEffect ? `【${UNIQUE_EFFECT_NAMES[uniqueEffect.type]}】が付与された！` : ''}`);
  };

  const handleGenerateSkill = () => {
    const cost = skillType === 'EX_CHIP' ? 100 : 50;
    if (materials < cost) { addLog(`[ERROR] マテリアルが不足。(${cost}G必要)`); return; }
    if (!prompt.trim()) { addLog("[ERROR] プロンプトを入力してください。"); return; }
    setMaterials(prev => prev - cost);
    const hashData = generateHashData(prompt + skillType);

    if (skillType === 'EX_CHIP') {
      const capacity = hashData.val1 + hashData.val2 + 10;
      const newItem = { id: Date.now().toString(), name: prompt, type: 'EX_CHIP', color: hashData.color, capacity, modules: [] };
      setInventory(prev => [...prev, newItem]);
      sfx.craft();
      addLog(`[GENERATOR] EXチップ「${newItem.name}」(CAP:${capacity})を生成しました。`);
    } else {
      let mHp = 0, mAtk = 0, mDef = 0, mSpd = 0;
      const statType1 = hashData.val1 % 4, statType2 = hashData.val2 % 4;
      const statVal1 = Math.floor(hashData.val3 * 1.5) + 1, statVal2 = hashData.val1;
      const applyStat = (type, val) => {
        if (type === 0) mHp += val * 2;
        if (type === 1) mAtk += val;
        if (type === 2) mDef += val;
        if (type === 3) mSpd += val;
      };
      applyStat(statType1, statVal1);
      if (statType1 !== statType2) applyStat(statType2, statVal2);
      const special = hashData.val3 > 3 ? EX_SPECIALS[hashData.val1 % EX_SPECIALS.length].id : null;
      const newItem = { id: Date.now().toString(), name: prompt, type: 'EX_MODULE', color: hashData.color, cost: hashData.val2 + 2, hp: mHp, atk: mAtk, def: mDef, spd: mSpd, special };
      setInventory(prev => [...prev, newItem]);
      addLog(`[GENERATOR] モジュール「${newItem.name}」を生成しました。`);
    }
  };

  const borderStyle = genMode === 'EQUIP' ? '#06b6d4' : '#a855f7';

  return (
    <div className="flex flex-col items-center justify-center flex-grow p-2 relative">
      <div className="flex w-full max-w-lg mb-2 mt-8">
        <button onClick={() => setGenMode('EQUIP')} className={`flex-1 py-3 px-4 font-black tracking-widest rounded-tl-xl border-t-2 border-l-2 border-r border-b-0 ${genMode === 'EQUIP' ? 'bg-gray-900 border-cyan-500 text-cyan-400' : 'bg-black border-gray-800 text-gray-600'}`}>O.P.A</button>

const Closet = ({ inventory, setInventory, equipped, setEquipped, stats, fighter, addLog, setMaterials }) => {
  const [selectedSlot, setSelectedSlot] = useState(null);
  const [customizingEXChipId, setCustomizingEXChipId] = useState(null);
  const weaponVisual = getEquippedWeaponVisual(inventory, equipped);

  const handleEquip = (itemId) => {
    if (!selectedSlot) return;
    setEquipped(prev => ({ ...prev, [selectedSlot.id]: itemId }));
    sfx.equip();
    addLog(`[CLOSET] ${selectedSlot.label} の装備を変更しました。`);
    setSelectedSlot(null);
  };
  const handleUnequip = (slotId) => {
    setEquipped(prev => { const n = { ...prev }; delete n[slotId]; return n; });
    addLog(`[CLOSET] 装備をパージしました。`);
  };

  // 売却:装備中ならまず装備解除してから所持品リストから除去し、半額分のマテリアルを返す。
  const getSellPrice = (item) => item.type === 'EX_CHIP' ? 50 : 25;
  const handleSell = (item, e) => {
    if (e) e.stopPropagation();
    const price = getSellPrice(item);
    setEquipped(prev => {
      const next = { ...prev };
      Object.keys(next).forEach(slotId => { if (next[slotId] === item.id) delete next[slotId]; });
      return next;
    });
    setInventory(prev => prev.filter(i => i.id !== item.id));
    setMaterials(m => m + price);
    addLog(`[CLOSET] 「${item.name}」を売却した。(+${price}G)`);
  };

  if (customizingEXChipId) {
    const chip = inventory.find(i => i.id === customizingEXChipId);
    const currentCost = (chip.modules || []).reduce((sum, m) => sum + (m.cost || 0), 0);
    const availableModules = inventory.filter(i => i.type === 'EX_MODULE');
    return (
      <div className="flex flex-col flex-grow p-4 bg-gray-900 rounded-xl border border-purple-900 shadow-lg">
        <h2 className="text-xl text-purple-400 font-black mb-4 flex items-center gap-2"><IconCpu /> EX CORE ASSEMBLE: {chip.name}</h2>
        <div className="mb-4">
          <div className="flex justify-between text-xs font-bold mb-1 text-purple-300">
            <span>CORE CAPACITY (許容量)</span>
            <span className={currentCost > (chip.capacity || 0) ? 'text-red-400' : ''}>{currentCost} / {chip.capacity}</span>
          </div>
          <div className="w-full bg-black h-3 rounded-full border border-purple-900 overflow-hidden">
            <div className="h-full bg-purple-500 transition-all" style={{ width: `${Math.min(100, (currentCost / (chip.capacity || 1)) * 100)}%` }}></div>
          </div>
        </div>
        <div className="flex flex-col md:flex-row gap-4 h-[400px]">
          <div className="flex-1 bg-black/50 p-4 rounded border border-purple-800 overflow-y-auto">
            <p className="text-sm text-purple-300 mb-2 font-bold">組込済みモジュール</p>
            {(chip.modules || []).map(m => (
              <div key={m.id} className="bg-gray-900 p-3 mb-2 border border-purple-900 rounded flex justify-between items-center hover:border-purple-600 transition-colors">
                <div><div className="text-purple-200 font-bold text-sm">{m.name}</div><ItemBadges item={m} /></div>
                <button onClick={() => {
                  setInventory(prev => {
                    const newInv = prev.map(i => i.id === customizingEXChipId ? { ...i, modules: (i.modules || []).filter(mod => mod.id !== m.id) } : i);
                    return [...newInv, m];
                  });
                }} className="text-red-400 p-2 hover:text-red-300 hover:bg-red-900/30 rounded"><IconMinus size={16} /></button>
              </div>
            ))}
            {(chip.modules || []).length === 0 && <div className="text-xs text-purple-800 text-center py-8">モジュール未実装</div>}
          </div>
          <div className="flex-1 bg-black/50 p-4 rounded border border-purple-800 overflow-y-auto">
            <p className="text-sm text-purple-300 mb-2 font-bold">所持モジュール (EX_MODULE)</p>
            {availableModules.map(m => (
              <div key={m.id} className="p-3 mb-2 border border-purple-800 bg-purple-950/20 rounded flex justify-between items-center">
                <div><div className="text-sm font-bold text-purple-100">{m.name}</div><ItemBadges item={m} /></div>
                <div className="flex gap-1 shrink-0">
                  <button onClick={() => {
                    if (currentCost + (m.cost || 0) > (chip.capacity || 0)) { addLog("[ERROR] キャパシティ限界です！"); return; }
                    setInventory(prev => prev.filter(i => i.id !== m.id).map(i => i.id === customizingEXChipId ? { ...i, modules: [...(i.modules || []), m] } : i));
                  }} className="px-3 py-1 bg-purple-800 text-white text-xs font-bold rounded flex items-center gap-1 hover:bg-purple-700"><IconPlus size={14} /> 注入</button>
                  <button onClick={(e) => handleSell(m, e)} className="px-2 py-1 bg-red-950/60 text-red-400 border border-red-800 text-xs font-bold rounded hover:bg-red-900">売却({getSellPrice(m)}G)</button>
                </div>
              </div>
            ))}
            {availableModules.length === 0 && <div className="text-xs text-purple-800 text-center py-8">組み込み可能なモジュールがありません</div>}
          </div>
        </div>
        <button onClick={() => setCustomizingEXChipId(null)} className="mt-4 p-4 bg-purple-800 hover:bg-purple-700 text-white font-bold rounded shadow-[0_0_15px_rgba(168,85,247,0.4)]">アセンブル完了</button>
      </div>
    );
  }

  const currentEquippedItems = EQUIP_SLOTS.map(slot => ({ slot, item: equipped[slot.id] ? inventory.find(i => i.id === equipped[slot.id]) || null : null }));
  let availableItemsForSlot = [];
  if (selectedSlot) {
    const otherEquippedIds = Object.entries(equipped).filter(([slotId]) => slotId !== selectedSlot.id).map(([_, itemId]) => itemId);
    availableItemsForSlot = inventory.filter(item => selectedSlot.categories.includes(item.type) && !otherEquippedIds.includes(item.id));
  }

  return (
    <div className="flex flex-col md:flex-row gap-4 flex-grow p-2">
      <div className="md:w-1/2 flex flex-col gap-4">
        <div className="bg-gray-900 border border-cyan-800 rounded-xl p-4 flex-grow flex flex-col items-center justify-center relative shadow-[0_0_15px_rgba(6,182,212,0.1)]">
          <div className="absolute top-2 left-2 bg-black/80 px-3 py-1 rounded text-xs text-cyan-400 border border-cyan-800 z-20 font-bold tracking-widest">FIGHTER ASSEMBLE</div>
          <InteractiveFighterSVG typeId={fighter && fighter.type} equippedWeaponVisual={weaponVisual} />
        </div>
        <div className="bg-black border border-cyan-900 rounded-xl p-4 shadow-inner">
          <h3 className="text-sm font-bold text-cyan-500 mb-2 border-b border-cyan-900 pb-1">TOTAL STATUS</h3>
          <div className="grid grid-cols-2 gap-x-4 gap-y-2">
            <div className="flex justify-between text-sm"><span className="text-gray-500">HP</span><span className="text-white font-black">{stats.hp}</span></div>
            <div className="flex justify-between text-sm"><span className="text-gray-500">ATK</span><span className="text-white font-black">{stats.atk}</span></div>
            <div className="flex justify-between text-sm"><span className="text-gray-500">DEF</span><span className="text-white font-black">{stats.def}</span></div>
            <div className="flex justify-between text-sm"><span className="text-gray-500">SPD</span><span className="text-white font-black">{stats.spd}</span></div>
            {!!stats.acc && <div className="flex justify-between text-sm"><span className="text-fuchsia-500">ACC</span><span className="text-fuchsia-300 font-black">{stats.acc}%</span></div>}
            {!!stats.eva && <div className="flex justify-between text-sm"><span className="text-teal-500">EVA</span><span className="text-teal-300 font-black">{stats.eva}%</span></div>}
          </div>
          {stats.specials.length > 0 && (
            <div className="mt-3 pt-2 border-t border-cyan-900/50 flex flex-wrap gap-2">
              {stats.specials.map((spId, i) => {
                const sDef = EX_SPECIALS.find(s => s.id === spId);
                return <span key={i} className="text-[10px] bg-pink-900/30 text-pink-400 border border-pink-900 px-2 py-0.5 rounded font-bold flex items-center gap-1"><IconSparkles size={10} />{sDef ? sDef.name : spId}</span>;
              })}
            </div>
          )}
        </div>
      </div>
      <div className="md:w-1/2 bg-gray-900/80 border border-cyan-900 rounded-xl p-4 flex flex-col">
        {!selectedSlot ? (
          <>
            <h3 className="text-sm font-bold text-cyan-400 mb-4 border-b border-cyan-900 pb-2">EQUIPMENT SLOTS</h3>
            <div className="flex-grow overflow-y-auto space-y-2 pr-2">
              {currentEquippedItems.map(({ slot, item }) => (
                <div key={slot.id} className="bg-black border border-gray-800 rounded p-3 flex justify-between items-center hover:border-cyan-700 transition-colors">
                  <div className="flex-1 cursor-pointer" onClick={() => setSelectedSlot(slot)}>
                    <div className="text-[10px] text-cyan-700 font-bold mb-1">{slot.label}</div>
                    {item ? (
                      <div>
                        <div className="text-sm font-bold text-cyan-100 flex items-center gap-2">
                          <ItemVisual item={item} />{item.name}
                        </div>
                        <ItemBadges item={item} />
                      </div>
                    ) : <div className="text-sm text-gray-600 italic">No Equipment</div>}
                  </div>
                  <div className="flex gap-2">
                    {item && slot.id === 'EX_CORE' && <button onClick={() => setCustomizingEXChipId(item.id)} className="px-2 py-1 bg-purple-900/50 text-purple-300 hover:bg-purple-800 border border-purple-800 rounded text-xs transition-colors">編集</button>}
                    {item && <button onClick={() => handleUnequip(slot.id)} className="px-2 py-1 bg-red-900/30 text-red-400 hover:bg-red-800 rounded text-xs transition-colors">外す</button>}
                  </div>
                </div>
              ))}
            </div>
          </>
        ) : (
          <div className="flex flex-col h-full">
            <div className="flex items-center gap-2 mb-4 border-b border-cyan-900 pb-2">
              <button onClick={() => setSelectedSlot(null)} className="p-1 bg-gray-800 rounded hover:bg-gray-700"><IconArrowLeft size={16} /></button>
              <h3 className="text-sm font-bold text-cyan-300">SELECT ITEM FOR [{selectedSlot.label}]</h3>
            </div>
            <div className="flex-grow overflow-y-auto space-y-2 pr-2">
              {availableItemsForSlot.map(item => (
                <div key={item.id} onClick={() => handleEquip(item.id)} className="bg-black border border-cyan-900 p-3 rounded cursor-pointer hover:bg-cyan-950 transition-colors flex justify-between items-center group">
                  <div>
                    <div className="text-sm font-bold text-cyan-100 group-hover:text-cyan-300 flex items-center gap-2">
                      <ItemVisual item={item} />{item.name}
                    </div>
                    <ItemBadges item={item} />
                    {item.type === 'EX_CHIP' && <div className="text-[10px] text-purple-400 mt-1">内蔵モジュール: {(item.modules && item.modules.length) || 0}基</div>}
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    {equipped[selectedSlot.id] === item.id && <span className="text-xs bg-cyan-800 text-white px-2 py-1 rounded">E</span>}
                    <button onClick={(e) => handleSell(item, e)} className="px-2 py-1 bg-red-950/60 text-red-400 border border-red-800 text-[10px] font-bold rounded hover:bg-red-900 whitespace-nowrap">売却({getSellPrice(item)}G)</button>
                  </div>
                </div>
              ))}
              {availableItemsForSlot.length === 0 && <div className="text-center text-sm text-gray-500 py-8">装備可能なアイテムがありません。</div>}
            </div>
          </div>
        )}

  );
};

const ArenaBattle = ({ stats, setPhase, addLog, materials, setMaterials, setInventory, inventory, equipped, rank, rankPoints, worldTournamentEligible, addRankPoints, winWorldTournament, resetWorldTournamentEligibility, defenseAvailable, loseDefense, setActiveEnemy }) => {
  const [battleState, setBattleState] = useState(null);
  const [tournamentActive, setTournamentActive] = useState(false);
  const [tournamentRound, setTournamentRound] = useState(0); // 1〜5
  const [isWorldTournament, setIsWorldTournament] = useState(false); // 現在の大会が世界大会かどうか
  const [defeatedInTournament, setDefeatedInTournament] = useState([]); // 大会中に撃破した相手の名前(再登場を防ぐ)
  const [pendingDefense, setPendingDefense] = useState(null); // 発生した防衛戦の情報(受諾/拒否の選択待ち)
  const [defenseActive, setDefenseActive] = useState(false);  // 防衛戦を戦闘中かどうか
  const [defenseIsOopa, setDefenseIsOopa] = useState(false);  // 現在の防衛戦の相手がオーパか
  const logsEndRef = useRef(null);

  useEffect(() => {
    logsEndRef.current && logsEndRef.current.scrollIntoView({ behavior: "smooth" });
  }, [battleState && battleState.logs]);

  // 下部パネルへ渡す敵情報を同期する。戦闘が終わったらnullに戻し、通常のログ表示へ。
  useEffect(() => {
    if (!setActiveEnemy) return;
    setActiveEnemy(battleState && !battleState.result ? battleState.enemy : null);
    return () => setActiveEnemy(null);
  }, [battleState]);

  // worldMode: 世界大会かどうか。startTournament系から明示的に渡される
  // (Reactのstateは同一イベント内では即座に反映されないため、引数で受け取る形にしている)
  // defenseMode: 'NORMAL'(防衛戦の通常挑戦者) | 'OOPA'(運営の刺客) | null(防衛戦ではない)
  const startBattle = (worldMode = false, alreadyDefeated = [], defenseMode = null) => {
    const field = pickArenaField();
    const powerLevel = stats.hp + stats.atk * 5 + stats.def * 4 + stats.spd * 4;
    const enemyTypes = ['A', 'B', 'C'];
    const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];

    const weps = {};
    ['R_HAND', 'L_HAND', 'R_BACK', 'L_BACK'].forEach(slot => {
      if (equipped[slot]) {
        const item = inventory.find(i => i.id === equipped[slot]);
        if (item) {
          if (item.type === 'SHOOT' || item.type === 'BACK_SHOOT') {
            weps[slot] = { ...item, currentAmmo: item.maxAmmo || 0, wType: 'SHOOT' };
          } else if (item.type === 'MELEE' || item.type === 'BACK_MELEE') {
            weps[slot] = { ...item, currentHeat: 0, maxHeat: 100, heatRate: item.heatRate || 35, wType: 'MELEE' };
          }
        }
      }
    });

    const hasFly = (() => {
      const backItem = inventory.find(i => i.id === equipped['C_BACK']);
      return backItem && backItem.type === 'BACK_SUPPORT';
    })();
    const maxFlightTurns = (() => {
      const backItem = inventory.find(i => i.id === equipped['C_BACK']);
      return (backItem && backItem.flightTurns) || 3;
    })();
    const equippedShieldItem = ['R_HAND', 'L_HAND']
      .map(slot => inventory.find(i => i.id === equipped[slot]))
      .find(it => it && it.type === 'SHIELD');
    const hasShieldEquipped = !!equippedShieldItem;
    const shieldName = equippedShieldItem ? equippedShieldItem.name : null;
    // 開始位置はフィールドの広さに応じて対角線上の最遠に配置される
    const startPos = getStartPositions();
    const pInitPos = startPos.player.pos, pInitLane = startPos.player.lane;
    const eInitPos = startPos.enemy.pos, eInitLane = startPos.enemy.lane;

    setBattleState({
      player: {
        hp: stats.hp, maxHp: stats.hp, pos: pInitPos, lane: pInitLane,
        height: getTerrainHeight(getTerrain(pInitPos, pInitLane)),
        ap: MAX_AP, defActive: false, type: 'A', isBehind: false, hasFly,
        maxFlightTurns, flightTurnsLeft: null, hasShieldEquipped, shieldName,
        // 敵スキルによる戦闘中限定のデバフ。プレイヤーのステータスは装備から毎回再計算
        // されるため、倍率として保持し参照時に掛ける形にしている(1 = デバフ無し)。
        atkDebuff: 1, defDebuff: 1,
        stunnedNextTurn: false,  // 敵のSTUNを受けた予約状態。次ターン開始時にAPが0になる
        isStunnedNow: false,     // 現在このターンがスタン中か(UI表示用。ターン中ずっと真)
        selfStunTurns: 0,        // 渾身の一撃の反動による自己スタン残ターン
        repairTurns: 0,          // オートリペアの残ターン(被ダメの半分を回復/効果中FLY不可)
        // 段階4:行動阻害を受けた状態(いずれも1ターン)
        lockMoveTurns: 0,        // 移動不可
        lockAttackTurns: 0,      // 攻撃不可
        sealSkillTurns: 0,       // スキル使用不可
        gravityTurns: 0,         // 移動APが2倍
        burnTurns: 0, burnDamage: 0,  // 焼夷弾によるスリップダメージ
        nextCrit: false, evasion: false, shieldActive: false
      },
      enemy: (() => {
        // 世界大会では専用の難易度倍率を使い、ライバル4体全員を抽選プールに含める。
        // 防衛戦(特にオーパ)はさらに強力な相手になる。
        const isOopa = defenseMode === 'OOPA';
        const isDefense = defenseMode !== null;
        // オーパはランク倍率に上乗せするのではなく、専用の絶対倍率を使う。
        // (Sランク×1.5にさらに×1.4を掛けると実質2.1倍となり、通常攻撃だけで
        //  プレイヤーが即死する「勝ち目のない相手」になってしまうため)
        const baseMult = isOopa
          ? OOPA_STAT_MULT
          : (worldMode ? WORLD_TOURNAMENT_DIFFICULTY_MULT : (RANK_DIFFICULTY_MULT[rank] || 1.0));
        const diffMult = baseMult * (1 + (Math.random() * RANK_VARIANCE * 2 - RANK_VARIANCE));
        const archKey = pickEnemyArchetype(rank);
        const arch = ENEMY_ARCHETYPES[archKey];
        // 防衛戦の挑戦者は世界大会枠(ライバル4体全員+Aランクの名前プール)から選ばれる
        const identity = isOopa
          ? { isRival: false, rivalKey: null, name: OOPA_NAME }
          : pickEnemyIdentity(rank, worldMode || isDefense, alreadyDefeated);
        const rival = identity.isRival ? RIVALS[identity.rivalKey] : null;
        const bonusMult = (statKey) => (rival && rival.statBonus === statKey) ? RIVAL_STAT_BONUS_MULT : 1;
        return {
          name: isOopa ? `${OOPA_NAME} 《運営の刺客》` : `${identity.name} 《${arch.name}》`,
          baseName: identity.name,  // アーキタイプ表記を除いた素の名前(大会での重複出現防止に使う)
          isRival: identity.isRival, rivalKey: identity.rivalKey,
          isOopa,
          hp: Math.floor(stats.hp * 1.2 * diffMult * (arch.hpMult || 1)),
          maxHp: Math.floor(stats.hp * 1.2 * diffMult * (arch.hpMult || 1)),
          atk: Math.floor(stats.atk * 0.9 * diffMult * (arch.atkMult || 1) * bonusMult('atk')),
          def: Math.floor(stats.def * 0.8 * diffMult * (arch.defMult || 1) * bonusMult('def')),
          spd: Math.floor(stats.spd * 0.8 * diffMult * (arch.spdMult || 1) * bonusMult('spd')),
          eva: arch.eva || 0, acc: arch.acc || 0, tankDefend: !!arch.tankDefend, archetype: archKey,
          hasLimiterRelease: !!(rival && rival.uniqueSkill === 'LIMITER_RELEASE'),
          limiterActive: false, limiterTurnsLeft: null, limiterBonus: null, limiterUsed: false,
          // オーパは専用スキル4種を全て所持する。それ以外は従来通りランク別に抽選。
          // 段階2:敵も武器を持つ(残弾/HEATあり)。オーパは専用スキル主体なので標準構成。
          weapons: generateEnemyWeapons(archKey, rank),
          // 段階2:敵にも飛行の残ターン制限を課す(プレイヤーと同じルール)
          maxFlightTurns: 4, flightTurnsLeft: null,
          skills: isOopa ? [...OOPA_SKILL_IDS] : pickEnemySkills(rank),
          usedSkills: [],                  // 使用済みスキル(1戦闘につき各1回)
          nextCrit: false,                 // 急所狙い発動中
          evasion: false,                  // 完全回避発動中
          shieldActive: false,             // 防壁展開発動中
          extraAction: false,              // APブーストによる追加行動フラグ
          noAttackTurns: 0,                // 一斉発射の後隙(この値の間は攻撃できない)
          // 段階4:プレイヤーの行動阻害スキルを受けた状態
          lockMoveTurns: 0, lockAttackTurns: 0, sealSkillTurns: 0, gravityTurns: 0,
          burnTurns: 0, burnDamage: 0,
          stunTurns: 0,                    // 渾身の一撃の反動スタン残ターン
          repairTurns: 0,                  // オートリペアの残ターン
          pos: eInitPos, lane: eInitLane, height: getTerrainHeight(getTerrain(eInitPos, eInitLane)),
          ap: MAX_AP, defActive: false, type,
          power: Math.floor(powerLevel * 0.9 + Math.random() * (powerLevel * 0.5)),
          reward: Math.floor(100 + Math.random() * 200)
        };
      })(),
      turn: 1,
      field: { name: field.name, variant: field.variant },
      // 木々の判別状態。プレイヤー・敵それぞれ別に管理する(双方とも手探り)。
      // 開始位置に隣接している木は最初から判別済みとして扱う。
      revealedTreesP: (() => { const s = new Set(); revealAdjacentTrees(pInitPos, pInitLane, s); return [...s]; })(),
      revealedTreesE: (() => { const s = new Set(); revealAdjacentTrees(eInitPos, eInitLane, s); return [...s]; })(),
      logs: [`[SYSTEM] 戦闘フィールド「${field.name}-${field.variant}」へ転送完了。交戦開始。`],
      activeWeapons: weps,
      usedSkills: [],
      result: null
    });
  };

  // revealedSet: 攻撃側から見た木の判別状態。未判別の木は障害物(射線を遮る)として扱う。
  const checkAttackValidity = (pX, pY, pZ, eX, eY, eZ, rangeType, revealedSet = null) => {
    const distX = Math.abs(eX - pX), distY = Math.abs(eY - pY);
    let blocked = false;
    let blockedByTree = false;
    if (distY === 0 && rangeType !== '列') {
      for (let x = Math.min(pX, eX) + 1; x < Math.max(pX, eX); x++) {
        const eff = getEffectiveTerrain(x, pY, revealedSet);
        // 判別済みの高木も射線を遮る(高台相当の遮蔽物として扱う)
        const isBlocker = eff === 'WALL' || eff === 'TREE_HIGH';
        if (isBlocker && pZ < 2 && eZ < 2) {
          blocked = true;
          blockedByTree = eff === 'TREE_HIGH' || (isTreeTerrain(getTerrain(x, pY)) && eff === 'WALL');
          break;
        }
      }
    }
    if (blocked) return { valid: false, reason: blockedByTree ? "射線が木に遮られている！" : "射線が障害物(WALL)に遮られている！" };
    if (rangeType === '列') return { valid: distY === 0, reason: "レーンが合っていない！" };
    let baseRange = 1;
    if (rangeType === '中') baseRange = 3;
    if (rangeType === '遠') baseRange = 4;
    if (rangeType === '広') baseRange = 2;
    const effectiveRange = Math.max(1, baseRange + (pZ - eZ));
    const laneOk = rangeType === '広' ? true : distY <= 1; // 「広」はレーン距離を問わず全レーンが対象
    if (distX <= effectiveRange && laneOk) return { valid: true, reason: '' };
    return { valid: false, reason: `射程外！(補正後射程:${effectiveRange} / 距離:${distX})` };
  };

  const executeCommand = (cmd, slotOrSkillId = null) => {
    if (!battleState || battleState.result) return;
    let newState = JSON.parse(JSON.stringify(battleState));
    let p = newState.player, e = newState.enemy;
    let cost = 1;
    p.defActive = false;

    if (cmd === 'SKILL') {
      // スキル封印を受けている間はスキルを使えない
      if ((p.sealSkillTurns || 0) > 0) {
        newState.logs.push(`> スキルが封印されている！(残り${p.sealSkillTurns}ターン)`);
        setBattleState(newState); return;
      }
      const skillKey = slotOrSkillId;
      if (newState.usedSkills.includes(skillKey)) return;
      newState.usedSkills.push(skillKey);
      const [skillId] = skillKey.split('-');
      if (skillId === 'HEAL') { const h = Math.floor(p.maxHp * 0.3); p.hp = Math.min(p.maxHp, p.hp + h); newState.logs.push(`> [ACTIVE SKILL] 自己修復！ HPが ${h} 回復！`); }
      else if (skillId === 'CRITICAL') { p.nextCrit = true; newState.logs.push(`> [ACTIVE SKILL] 急所狙い！ 次撃ダメージ激増！`); }
      else if (skillId === 'EVASION') { p.evasion = true; newState.logs.push(`> [ACTIVE SKILL] 完全回避！ 次被弾を無効化！`); }
      else if (skillId === 'AP_BOOST') { p.ap += 2; newState.logs.push(`> [ACTIVE SKILL] APブースト！ AP+2！`); }
      else if (skillId === 'SHIELD') { p.shieldActive = true; newState.logs.push(`> [ACTIVE SKILL] 防壁展開！ 次被ダメ半減！`); }
      else if (skillId === 'WEAKEN') { e.atk = Math.max(1, Math.floor(e.atk * 0.7)); newState.logs.push(`> [ACTIVE SKILL] 弱体化！ 敵のATKを戦闘中ずっと低下させた！`); }
      else if (skillId === 'ARMOR_BREAK') { e.def = Math.floor((e.def || 0) * 0.5); newState.logs.push(`> [ACTIVE SKILL] 装甲破壊！ 敵のDEFを戦闘中ずっと低下させた！`); }
      else if (skillId === 'STUN') {
        // 交互行動制では敵も1ターンに複数回動くため、「1行動だけ封じる」フラグでは
        // ほとんど効果が無い。APを0にして、そのターンの残り手番すべてを奪う。
        e.stunned = true;
        e.ap = 0;
        newState.logs.push(`> [ACTIVE SKILL] スタン！ 敵はこのターン行動できない！`);
      }
      // --- 段階4:攻撃系スキル(いずれも射程無視) ---
      else if (skillId === 'PIERCE_SHOT') {
        // 防御を無視して撃ち抜く
        let dmg = Math.floor(Math.floor(stats.atk * (p.atkDebuff || 1)) * 1.5);
        let note = '';
        if (e.evasion) { dmg = 0; e.evasion = false; note = ' しかし敵の完全回避により無効化された！'; }
        e.hp -= dmg;
        sfx.attack(); setTimeout(() => sfx.hit(), 60);
        newState.logs.push(`> [ACTIVE SKILL] 貫通射撃！${note || ` 防御を無視して ${dmg} のダメージ！`}`);
      }
      else if (skillId === 'BLAST_ROUND') {
        // ダメージ+ノックバック。接近されている状況からの脱出手段になる
        let dmg = Math.floor(Math.floor(stats.atk * (p.atkDebuff || 1)) * 1.2);
        let note = '';
        if (e.evasion) { dmg = 0; e.evasion = false; note = ' しかし敵の完全回避により無効化された！'; }
        else if (e.defActive) { dmg = Math.max(1, dmg - (e.def || 0) * (e.tankDefend ? 3 : 2)); }
        e.hp -= dmg;
        // プレイヤーから見て反対方向へ1マス吹き飛ばす(場外なら押し戻せない)
        const knockDir = e.pos >= p.pos ? 1 : -1;
        const kbPos = e.pos + knockDir;
        let kbNote = '';
        if (kbPos >= 1 && kbPos <= getFieldCols() && getEffectiveTerrain(kbPos, e.lane, newState.revealedTreesP) !== 'WALL') {
          e.pos = kbPos;
          if ((e.height || 0) < 2) e.height = getTerrainHeight(getTerrain(e.pos, e.lane));
          kbNote = ' 敵を吹き飛ばした！';
        } else {
          kbNote = ' しかし壁際で吹き飛ばせなかった！';
        }
        sfx.attack(); setTimeout(() => sfx.hit(), 60);
        newState.logs.push(`> [ACTIVE SKILL] 爆裂弾！${note || ` ${dmg} のダメージ！`}${kbNote}`);
      }
      else if (skillId === 'BURN_SHOT') {
        // 継続ダメージ。即効性は無いが合計火力は高い
        const perTurn = Math.floor(Math.floor(stats.atk * (p.atkDebuff || 1)) * 0.8);
        e.burnTurns = 3;
        e.burnDamage = perTurn;
        newState.logs.push(`> [ACTIVE SKILL] 焼夷弾！ 敵が燃え上がった!(3ターンの間、毎ターン${perTurn}ダメージ)`);
      }
      else if (skillId === 'RECKLESS') {
        // 最大火力だが自分もダメージを負う
        let dmg = Math.floor(Math.floor(stats.atk * (p.atkDebuff || 1)) * 2.5);
        let note = '';
        if (e.evasion) { dmg = 0; e.evasion = false; note = ' しかし敵の完全回避により無効化された！'; }
        else if (e.defActive) { dmg = Math.max(1, dmg - (e.def || 0) * (e.tankDefend ? 3 : 2)); }
        e.hp -= dmg;
        const recoil = Math.floor(p.maxHp * 0.1);
        p.hp = Math.max(1, p.hp - recoil); // 自滅はしない(最低HP1で踏みとどまる)
        sfx.attack(); setTimeout(() => sfx.hit(), 60);
        newState.logs.push(`> [ACTIVE SKILL] 捨て身の一撃！${note || ` ${dmg} の大ダメージ！`} 反動で自身も ${recoil} のダメージ！`);
      }
      // --- 段階4:行動阻害系スキル ---
      else if (skillId === 'LOCK_MOVE') {
        e.lockMoveTurns = 1;
        newState.logs.push(`> [ACTIVE SKILL] 移動封鎖！ 敵は次のターン移動できない！`);
      }
      else if (skillId === 'LOCK_ATTACK') {
        e.lockAttackTurns = 1;
        newState.logs.push(`> [ACTIVE SKILL] 武装凍結！ 敵は次のターン攻撃できない！`);
      }
      else if (skillId === 'BREAK_ARMS') {
        // 敵の武器をランダムに1つ使用不能にする(射撃は残弾0、近接はオーバーヒート)
        const alive = (e.weapons || []).filter(w =>
          w.wType === 'SHOOT' ? (w.currentAmmo || 0) > 0 : (w.currentHeat || 0) < (w.maxHeat || 100));
        if (alive.length === 0) {
          newState.logs.push(`> [ACTIVE SKILL] 武装破壊！ ……しかし敵に使用可能な武装が無い！`);
        } else {
          const target = alive[Math.floor(Math.random() * alive.length)];
          if (target.wType === 'SHOOT') { target.currentAmmo = 0; newState.logs.push(`> [ACTIVE SKILL] 武装破壊！ 敵の[${target.name}]の弾倉を破壊した！`); }
          else { target.currentHeat = target.maxHeat || 100; newState.logs.push(`> [ACTIVE SKILL] 武装破壊！ 敵の[${target.name}]を強制的にオーバーヒートさせた！`); }
        }
      }
      else if (skillId === 'SEAL_SKILL') {
        e.sealSkillTurns = 1;
        newState.logs.push(`> [ACTIVE SKILL] スキル封印！ 敵は次のターンスキルを使えない！`);
      }
      else if (skillId === 'GRAVITY') {
        e.gravityTurns = 1;
        newState.logs.push(`> [ACTIVE SKILL] 重力異常！ 敵の機動が著しく低下した！`);
      }
      // --- オーパ専用スキル(オーパ撃破でのみ入手) ---
      else if (skillId === 'ALL_FIRE') {
        // 装備中の全射撃武装の合計ATKをそのままダメージにする。使用後は全射撃武装の残弾が0に。
        const shooters = Object.values(newState.activeWeapons).filter(w => w && w.wType === 'SHOOT');
        if (shooters.length === 0) {
          newState.logs.push(`> [ACTIVE SKILL] 一斉発射！ ……しかし射撃武装を装備していない！`);
        } else {
          const totalAtk = shooters.reduce((sum, w) => sum + (w.atk || 0), 0);
          let dmg = totalAtk;
          let note = '';
          if (e.evasion) { dmg = 0; e.evasion = false; note = ' しかし敵の完全回避により無効化された！'; }
          else if (e.defActive) { dmg = Math.max(1, dmg - (e.def || 0) * (e.tankDefend ? 3 : 2)); note = ' (敵の防御によりダメージ減少)'; }
          if (dmg > 0 && e.shieldActive) { dmg = Math.floor(dmg / 2); e.shieldActive = false; note += ' (防壁により半減)'; }
          e.hp -= dmg;
          Object.values(newState.activeWeapons).forEach(w => { if (w && w.wType === 'SHOOT') w.currentAmmo = 0; });
          sfx.attack(); setTimeout(() => sfx.hit(), 60);
          newState.logs.push(`> [ACTIVE SKILL] 一斉発射！！ 全射撃武装が火を噴いた！${note || ` 敵に ${dmg} の大ダメージ！`}`);
          newState.logs.push(`> …全射撃武装の残弾が尽きた。リロードが必要だ。`);
        }
      }
      else if (skillId === 'FULL_STRIKE') {
        // 位置に関係なく背後を取り、ATK2倍の防御貫通ダメージ。使用後2ターン自己スタン。
        const targetPos = e.pos + (e.pos > p.pos ? 1 : -1);
        p.pos = (targetPos >= 1 && targetPos <= getFieldCols()) ? targetPos : e.pos;
        p.lane = e.lane;
        p.height = getTerrainHeight(getTerrain(p.pos, p.lane));
        let dmg = Math.floor(Math.floor(stats.atk * (p.atkDebuff || 1)) * 2); // 防御貫通(DEFを引かない)
        let note = '';
        if (e.evasion) { dmg = 0; e.evasion = false; note = ' しかし敵の完全回避により無効化された！'; }
        e.hp -= dmg;
        p.selfStunTurns = 2;
        sfx.attack(); setTimeout(() => sfx.hit(), 60);
        newState.logs.push(`> [ACTIVE SKILL] 渾身の一撃！！ 一瞬で敵の背後を取った！${note || ` 防御を貫き ${dmg} のダメージ！`}`);
        newState.logs.push(`> …無理な機動の反動で、2ターン行動不能になった。`);
      }
      else if (skillId === 'AUTO_REPAIR') {
        p.repairTurns = 3;
        if (p.height === 2) { p.height = getTerrainHeight(getTerrain(p.pos, p.lane)); newState.logs.push(`> 出力を回すため強制着地した。`); }
        newState.logs.push(`> [ACTIVE SKILL] オートリペア起動！ 3ターンの間、被ダメージの半分を回復する(効果中は飛行不可)。`);
      }
      else if (skillId === 'AP_HIGH_BOOST') { p.ap += 4; newState.logs.push(`> [ACTIVE SKILL] APハイブースト！！ AP+4！`); }
      setBattleState(newState); return;
    }

    const tryMove = (targetPos, targetLane, actionName) => {
      // 移動封鎖を受けている間は移動できない
      if ((p.lockMoveTurns || 0) > 0) { newState.logs.push(`> 移動が封鎖されている！(残り${p.lockMoveTurns}ターン)`); return 0; }
      if (targetPos < 1 || targetPos > getFieldCols() || targetLane < 1 || targetLane > getFieldLanes()) { newState.logs.push(`> フィールド端。これ以上 ${actionName}できない`); return 0; }
      if (targetPos === e.pos && targetLane === e.lane) { newState.logs.push(`> 敵がいて移動できない！`); return 0; }
      const revealedP = newState.revealedTreesP;
      const tTerrainActual = getTerrain(targetPos, targetLane);
      const tTerrain = getEffectiveTerrain(targetPos, targetLane, revealedP);

      // 未判別の木に踏み込もうとした場合:隣接したことで正体が判明する。
      // ただしこのターンは判別のみで移動は成立しない(手探りのコストを払う設計)。
      if (isTreeTerrain(tTerrainActual) && !hasRevealed(revealedP, `${targetPos}-${targetLane}`)) {
        addRevealed(revealedP, `${targetPos}-${targetLane}`);
        const label = getTerrainLabel(tTerrainActual);
        newState.logs.push(`> 木に接近して確かめた……【${label}】だ！${tTerrainActual === 'TREE_LOW' ? '(乗り越えられそうだが、今ターンは体勢を整えるだけで終わった)' : '(高すぎて登れない)'}`);
        return 1;
      }
      if (tTerrain === 'WALL' && (p.height || 0) < 2) { newState.logs.push(`> 障害物(WALL)が立ち塞がっている！(飛行時のみ通過可)`); return 0; }
      if (tTerrainActual === 'TREE_HIGH' && (p.height || 0) < 2) { newState.logs.push(`> 高木が立ち塞がっている！(飛行時のみ通過可)`); return 0; }
      // 川がらみの移動はAPを余計に消費する(飛行中は水面に影響されないため対象外)。
      // 移動元・移動先のどちらかが川なら「水に足を取られる」扱いにする。
      const fromTerrain = getTerrain(p.pos, p.lane);
      const isFlying = (p.height || 0) >= 2;
      let moveCost = isFlying ? 1 : Math.max(getMoveCostMultiplier(fromTerrain), getMoveCostMultiplier(tTerrain));
      const riverCost = moveCost > 1;   // 川によるコスト増か(ログの文言を分けるため)
      // 重力異常を受けている間は移動APが2倍になる
      // 飛行中は重力異常の影響を受けない(地面に押さえつけられないため)。
      // 敵側には同じ判定が入っていたが、プレイヤー側に入れ忘れていた。
      const gravityAffected = (p.gravityTurns || 0) > 0 && !isFlying;
      if (gravityAffected) moveCost *= 2;
      if (moveCost > 1 && p.ap < moveCost) {
        // 不足の理由を正しく伝える(川なのか重力異常なのか)
        const reason = gravityAffected && riverCost ? '重力異常と水流のせいで'
          : gravityAffected ? '重力異常のせいで' : '川を渡るには';
        newState.logs.push(`> ${reason}APが${moveCost}必要だ！(現在AP:${p.ap})`);
        return 0;
      }
      p.pos = targetPos; p.lane = targetLane; p.isBehind = false;
      if (!isFlying) {
        const newH = getTerrainHeight(tTerrainActual);
        const moveNote = gravityAffected && riverCost ? '重力と水流に阻まれながら'
          : gravityAffected ? '重力に押さえつけられながら'
          : riverCost ? '水流に足を取られながら' : '';
        newState.logs.push(moveCost > 1 ? `> ${moveNote} ${actionName}した (AP-${moveCost})` : `> ${actionName}した`);
        p.height = newH;
      }
      else { newState.logs.push(`> 上空から ${actionName}した`); }
      // 移動先から隣接する木を新たに判別する
      const revealed = revealAdjacentTrees(p.pos, p.lane, revealedP);
      revealed.forEach(t => newState.logs.push(`> 隣接した木の正体が判明:【${getTerrainLabel(t.terrain)}】`));
      return moveCost;
    };

    // ターンを終える(パス)。スタンで行動できないターンを進めるために使う。
    // 実際の処理は後段の共通ターン処理に任せるため、ここではAPを0にするだけ。
    if (cmd === 'PASS') {
      newState.logs.push(p.isStunnedNow ? `> 行動できないままターンを終えた。` : `> ターンを終えた。`);
      p.ap = 0;
      p.isStunnedNow = false; // このターンのスタンは消化済みとして扱う
      cost = 0;
    }
    else if (cmd === 'MOVE_F') { cost = tryMove(p.pos + (e.pos > p.pos ? 1 : -1), p.lane, '前進'); }
    else if (cmd === 'MOVE_B') { cost = tryMove(p.pos + (e.pos > p.pos ? -1 : 1), p.lane, '後退'); }
    else if (cmd === 'MOVE_U') { cost = tryMove(p.pos, p.lane - 1, '奥へ移動'); }
    else if (cmd === 'MOVE_D') { cost = tryMove(p.pos, p.lane + 1, '手前へ移動'); }
    // 斜め移動:横と縦を1回で移動する。レーン数が増えたフィールドで移動が冗長に
    // ならないよう追加した(コストは通常移動と同じAP1)。
    else if (cmd === 'MOVE_FU') { cost = tryMove(p.pos + (e.pos > p.pos ? 1 : -1), p.lane - 1, '斜め前(奥)へ移動'); }
    else if (cmd === 'MOVE_FD') { cost = tryMove(p.pos + (e.pos > p.pos ? 1 : -1), p.lane + 1, '斜め前(手前)へ移動'); }
    else if (cmd === 'DEFEND') {
      p.defActive = true;
      if (p.hasShieldEquipped) {
        newState.logs.push(`> [${p.shieldName}] を構えて防御体勢をとった (被ダメ大幅軽減)`);
      } else {
        newState.logs.push(`> 防御体勢をとった (被ダメ半減)`);
      }
    }
    else if (cmd === 'FLY') {
      if ((p.repairTurns || 0) > 0) {
        newState.logs.push(`> オートリペアに出力を回しているため飛行できない！(残り${p.repairTurns}ターン)`);
        cost = 0;
      } else {
        p.height = 2; p.isBehind = false; p.flightTurnsLeft = p.maxFlightTurns;
        newState.logs.push(`> [HOVER] 飛行システム起動！ 上空(高度:空)へ舞い上がった！(飛行可能:${p.maxFlightTurns}ターン)`);
      }
    }
    else if (cmd === 'LAND') {
      const terrain = getTerrain(p.pos, p.lane);
      if (terrain === 'WALL') { newState.logs.push(`> その真下は障害物(WALL)のため着地できない！`); cost = 0; }
      else { p.height = getTerrainHeight(terrain); p.flightTurnsLeft = null; newState.logs.push(`> [LAND] 地上(高度:${getTerrainLabel(terrain)})へ降下・着地した！`); }
    }
    else if (cmd === 'JUMP') {
      const distX = Math.abs(e.pos - p.pos);
      if (distX <= 1 && p.lane === e.lane) {
        let targetPos = e.pos + (e.pos > p.pos ? 1 : -1);
        const maxCol = getFieldCols();
        if (targetPos > maxCol) { p.pos = maxCol; e.pos = maxCol - 1; } else if (targetPos < 1) { p.pos = 1; e.pos = 2; } else { p.pos = targetPos; }
        p.lane = e.lane; p.isBehind = true;
        p.height = getTerrainHeight(getTerrain(p.pos, p.lane));
        newState.logs.push(`> ジャンプして敵の背後に回り込んだ！`);
      } else { newState.logs.push(`> 距離が遠いかレーンが違うためジャンプできない！`); cost = 0; }
    }
    else if (cmd === 'RELOAD') {
      const weapon = slotOrSkillId ? newState.activeWeapons[slotOrSkillId] : null;
      if (weapon && weapon.wType === 'SHOOT') { weapon.currentAmmo = weapon.maxAmmo || 0; newState.logs.push(`> [${weapon.name}] のマガジンをリロードした！`); }
      else if (weapon && weapon.wType === 'MELEE') { weapon.currentHeat = 0; newState.logs.push(`> [${weapon.name}] を冷却(COOL DOWN)した！`); }
      else { newState.logs.push(`> その操作は不要だ`); cost = 0; }
    }
    else if (cmd === 'ATK' && (p.lockAttackTurns || 0) > 0) {
      newState.logs.push(`> 武装が凍結されている！(残り${p.lockAttackTurns}ターン)`);
      cost = 0;
    }
    else if (cmd === 'ATK') {
      cost = 2;
      const weapon = slotOrSkillId ? newState.activeWeapons[slotOrSkillId] : null;
      const isBackAttack = !!p.isBehind;
      const pTerrainNow = getTerrain(p.pos, p.lane);
      const pAccPenalty = (p.height || 0) >= 2 ? 0 : getTerrainAccPenalty(pTerrainNow); // 飛行中は沼の影響を受けない
      const enemyDodged = Math.random() * 100 < getEvasionChance(e.spd, stats.spd, e.eva || 0, (stats.acc || 0) - pAccPenalty);

      const calcDamage = (baseAtk) => {
        // 敵のWEAKENを受けている場合、プレイヤーのATKが低下する
        const effAtk = Math.floor(baseAtk * (p.atkDebuff || 1));
        let dmg = Math.max(1, effAtk - (isBackAttack ? 0 : (e.defActive ? (e.def || 0) * (e.tankDefend ? 3 : 2) : (e.def || 0))));
        if (p.nextCrit) { dmg *= 2; p.nextCrit = false; newState.logs.push(`>> [CRITICAL HIT!!]`); }
        if (isBackAttack) { dmg = Math.floor(dmg * 1.5); newState.logs.push(`> 【背面強襲！】`); p.isBehind = false; }
        return dmg;
      };

      // 敵がEVASION/SHIELDを発動している場合の被ダメージ処理。
      // 戻り値は {dmg, note}。dmgが0なら完全回避、noteはログに添える説明。
      const applyEnemyDefensiveSkills = (rawDmg) => {
        if (e.evasion) { e.evasion = false; return { dmg: 0, note: ' しかし敵の完全回避により無効化された！' }; }
        let dmg = rawDmg;
        let note = '';
        if (e.shieldActive) { e.shieldActive = false; dmg = Math.floor(dmg / 2); note = ' (敵の防壁展開によりダメージ半減)'; }
        // 敵のオートリペア:受けたダメージの半分を回復する
        if (dmg > 0 && (e.repairTurns || 0) > 0) {
          const healed = Math.floor(dmg / 2);
          e.hp = Math.min(e.maxHp, e.hp + healed);
          note += ` [敵オートリペア] ${healed} 回復された！`;
        }
        return { dmg, note };
      };

      if (weapon) {
        if (weapon.wType === 'SHOOT' && (weapon.currentAmmo || 0) > 0) {
          const check = checkAttackValidity(p.pos, p.lane, p.height || 0, e.pos, e.lane, e.height || 0, weapon.range || '近', newState.revealedTreesP);
          if (check.valid) {
            weapon.currentAmmo = (weapon.currentAmmo || 1) - 1;
            if (enemyDodged) {
              sfx.miss(); newState.logs.push(`> [${weapon.name}] で射撃！ しかし敵に回避された！ (残弾: ${weapon.currentAmmo})`);
            } else {
              const res = applyEnemyDefensiveSkills(calcDamage(stats.atk + (weapon.atk || 0)));
              e.hp -= res.dmg;
              sfx.attack(); setTimeout(() => sfx.hit(), 80);
              newState.logs.push(`> [${weapon.name}] で射撃！${res.note || ` 敵に ${res.dmg} ダメージ！`} (残弾: ${weapon.currentAmmo})`);
            }
          } else { sfx.miss(); newState.logs.push(`> 攻撃失敗: ${check.reason}`); cost = 1; }
        } else if (weapon.wType === 'MELEE' && (weapon.currentHeat || 0) < (weapon.maxHeat || 100)) {
          const check = checkAttackValidity(p.pos, p.lane, p.height || 0, e.pos, e.lane, e.height || 0, weapon.range || '近', newState.revealedTreesP);
          if (check.valid) {
            weapon.currentHeat = (weapon.currentHeat || 0) + (weapon.heatRate || 35);
            if (enemyDodged) {
              sfx.miss(); newState.logs.push(`> [${weapon.name}] で斬撃！ しかし敵に回避された！ (HEAT: ${weapon.currentHeat}%)`);
            } else {
              const res = applyEnemyDefensiveSkills(calcDamage(stats.atk + (weapon.atk || 0)));
              e.hp -= res.dmg;
              sfx.attack(); setTimeout(() => sfx.hit(), 60);
              newState.logs.push(`> [${weapon.name}] で斬撃！${res.note || ` 敵に ${res.dmg} ダメージ！`} (HEAT: ${weapon.currentHeat}%)`);
            }
            if ((weapon.currentHeat || 0) >= (weapon.maxHeat || 100)) newState.logs.push(`> [WARNING] ${weapon.name} が限界温度(OVER HEAT)に達した！`);
          } else { sfx.miss(); newState.logs.push(`> 攻撃失敗: ${check.reason}`); cost = 1; }
        } else { newState.logs.push(`> ${weapon.wType === 'MELEE' ? 'オーバーヒートで振れない！' : '弾切れだ！'}`); cost = 0; }
      } else {
        const check = checkAttackValidity(p.pos, p.lane, p.height || 0, e.pos, e.lane, e.height || 0, '近', newState.revealedTreesP);
        if (check.valid) {
          if (enemyDodged) {
            sfx.miss(); newState.logs.push(`> 近接格闘！ しかし敵に回避された！`);
          } else {
            const res = applyEnemyDefensiveSkills(calcDamage(Math.floor(stats.atk * 0.5)));
            e.hp -= res.dmg;
            sfx.attack(); setTimeout(() => sfx.hit(), 60);
            newState.logs.push(`> 近接格闘！${res.note || ` 敵に ${res.dmg} のダメージ！`}`);
          }
        } else { sfx.miss(); newState.logs.push(`> 攻撃失敗: ${check.reason}`); cost = 1; }
      }
    }

    p.ap -= cost;

    if (e.hp <= 0) {
      e.hp = 0; newState.result = 'WIN';
      newState.logs.push(`>> 敵を撃破した！！`);
      sfx.victory();
      if (tournamentActive && tournamentRound === TOURNAMENT_ROUNDS) {
        // 大会優勝が確定した瞬間に報酬を確定させる。結果画面の「リザルトへ」ボタンが
        // (レイアウト崩れ等で)押せなくても報酬を取りこぼさないようにするための措置。
        if (isWorldTournament) {
          // 世界大会優勝:Sランク昇格+専用の大型報酬。ランクポイントは0にリセットされるため
          // 通常のランクポイント加算は行わない。
          const matReward = WORLD_TOURNAMENT_WIN_MATERIALS;
          const rewardItem = generateTournamentRewardItem('S'); // Sランク相当(ソブリン)の限定装備
          const rewardMsg = `[ARENA] ★世界大会 優勝！！★ マテリアル+${matReward}G、「${rewardItem.name}」を獲得！${rewardItem.uniqueEffect ? `【${UNIQUE_EFFECT_NAMES[rewardItem.uniqueEffect.type]}】付き！` : ''}`;
          newState.logs.push(rewardMsg);
          addLog(rewardMsg);
          setMaterials(m => m + matReward);
          setInventory(prev => [...prev, rewardItem]);
          // setInventory/setMaterialsはこの時点ではまだstateに反映されていないため、
          // 自動セーブ側へ「付与後の値」を明示的に渡す(渡さないと報酬が保存されない)
          winWorldTournament({
            inventory: [...inventory, rewardItem],
            materials: materials + matReward,
          });
        } else {
          const matReward = TOURNAMENT_WIN_MATERIALS[rank] || 2000;
          const rewardItem = generateTournamentRewardItem(rank);
          const rewardMsg = `[ARENA] 公式大会 優勝！！ ランクポイント+${TOURNAMENT_WIN_POINTS}、マテリアル+${matReward}G、「${rewardItem.name}」を獲得！${rewardItem.uniqueEffect ? `【${UNIQUE_EFFECT_NAMES[rewardItem.uniqueEffect.type]}】付き！` : ''}`;
          newState.logs.push(rewardMsg);
          addLog(rewardMsg);
          setMaterials(m => m + matReward);
          setInventory(prev => [...prev, rewardItem]);
          // 昇格が起きると自動セーブが走るため、付与したばかりの報酬を明示的に渡す
          addRankPoints(TOURNAMENT_WIN_POINTS, {
            inventory: [...inventory, rewardItem],
            materials: materials + matReward,
          });
        }
      }
      setBattleState(newState); return;
    }

    // --- 交互行動システム ---
    // プレイヤーが1行動するたびに敵も1手番を消費して行動する(純粋な交互制)。
    // 消費APは行動ごとに異なる(移動1/攻撃2/スキル0)ため、重い行動を選ぶほど相手に
    // 手番を多く渡すことになり、その「ズレ」自体が駆け引きになる。
    // 片方だけAPが尽きた場合は、残っている側が連続で動く。
    const runEnemyAction = () => {
      newState.logs.push(`--- 敵のターン ---`);
      e.defActive = false;
      let action = '';

      // 敵のアクティブスキル発動判定(仕様書4-4節の優先順位に準拠)。
      // 1ターンにつき自己バフ/デバフ系は1つだけ。AP_BOOSTのみ別枠で判定し、
      // 発動した場合はそのターンの行動決定をもう1周する(=2行動)。
      const enemyHasSkill = (id) => (e.skills || []).includes(id) && !(e.usedSkills || []).includes(id);
      const useEnemySkill = (id) => {
        e.usedSkills = [...(e.usedSkills || []), id];
        newState.logs.push(`> [敵ACTIVE SKILL] ${ENEMY_SKILL_NAMES[id]}！`);
      };
      const trySkill = () => {
        if (e.stunned) return null; // スタン中はスキルも使えない
        if ((e.stunTurns || 0) > 0) return null; // 渾身の一撃の反動中も行動不能
        if ((e.sealSkillTurns || 0) > 0) return null; // スキル封印を受けている
        // --- オーパ専用スキル(敵版の解釈は仕様書7-5節) ---
        // 渾身の一撃は使用後2ターン動けなくなるため、HPに余裕がある時だけ使う。
        // (追い詰められてから撃つと、その隙に一方的に殴られて自滅してしまうため)
        if (enemyHasSkill('FULL_STRIKE') && e.hp >= e.maxHp * 0.5 && Math.abs(e.pos - p.pos) <= 4 && newState.turn >= 2) {
          // 位置無関係に背後へ回り込み、ATK2倍の防御貫通。使用後2ターン行動不能。
          useEnemySkill('FULL_STRIKE');
          const t = p.pos + (p.pos > e.pos ? 1 : -1);
          e.pos = (t >= 1 && t <= getFieldCols()) ? t : p.pos;
          e.lane = p.lane;
          e.height = getTerrainHeight(getTerrain(e.pos, e.lane));
          // 防御貫通(DEFを引かない)。ただし確定即死にならないよう最大HPの60%を上限にする
          // (上限が無いと、高倍率の敵では通常攻撃すら耐えられる相手を一撃で沈めてしまう)
          let dmg = Math.min(Math.floor((e.atk || 0) * 2), Math.floor(p.maxHp * 0.6));
          let note = '';
          if (p.evasion) { dmg = 0; p.evasion = false; note = ' しかし完全回避により無効化！'; }
          p.hp -= dmg;
          if (dmg > 0 && (p.repairTurns || 0) > 0) {
            const healed = Math.floor(dmg / 2);
            p.hp = Math.min(p.maxHp, p.hp + healed);
            note += ` [オートリペア] ${healed} 回復！`;
          }
          e.stunTurns = 2;
          sfx.enemyAttack(); setTimeout(() => sfx.enemyHit(), 70);
          return `【渾身の一撃】背後を取られた！${note || ` 防御を貫き ${dmg} の大ダメージ！`}(敵は反動で2ターン動けない)`;
        }
        // 一斉発射も後隙2ターンを抱えるため、HPに余裕がある時に限る
        if (enemyHasSkill('ALL_FIRE') && e.hp >= e.maxHp * 0.4 && (e.noAttackTurns || 0) <= 0 && newState.turn >= 2) {
          // 敵は武器を持たないため ATK×2.5 のダメージ+2ターン攻撃不可として解釈
          useEnemySkill('ALL_FIRE');
          // こちらも同様に上限を設ける(防御・防壁は効くため上限は緩め)
          let dmg = Math.min(Math.floor((e.atk || 0) * 2.5), Math.floor(p.maxHp * 0.75));
          let note = '';
          if (p.evasion) { dmg = 0; p.evasion = false; note = ' しかし完全回避により無効化！'; }
          else if (p.defActive) { const d = Math.floor(stats.def * (p.defDebuff || 1)); dmg = Math.max(1, dmg - d * (p.hasShieldEquipped ? 3 : 2)); note = ' (防御によりダメージ減少)'; }
          if (dmg > 0 && p.shieldActive) { dmg = Math.floor(dmg / 2); p.shieldActive = false; note += ' (防壁により半減)'; }
          p.hp -= dmg;
          if (dmg > 0 && (p.repairTurns || 0) > 0) {
            const healed = Math.floor(dmg / 2);
            p.hp = Math.min(p.maxHp, p.hp + healed);
            note += ` [オートリペア] ${healed} 回復！`;
          }
          e.noAttackTurns = 2;
          sfx.enemyAttack(); setTimeout(() => sfx.enemyHit(), 70);
          return `【一斉発射】全火器が一斉に火を噴いた！${note || ` ${dmg} の大ダメージ！`}(敵は2ターン攻撃できない)`;
        }
        if (enemyHasSkill('AUTO_REPAIR') && e.hp < e.maxHp * 0.6) {
          useEnemySkill('AUTO_REPAIR'); e.repairTurns = 3;
          return `【オートリペア】起動！ 3ターンの間、受けたダメージの半分を回復する(効果中は移動できない)`;
        }
        // --- 段階4:敵版の攻撃系・行動阻害系スキル ---
        // 攻撃系はHPを削りきる場面で、行動阻害系は序盤〜中盤に使ってくる。
        if (enemyHasSkill('RECKLESS') && p.hp < p.maxHp * 0.4) {
          useEnemySkill('RECKLESS');
          let dmg = Math.min(Math.floor((e.atk || 0) * 2.5), Math.floor(p.maxHp * 0.75));
          let note = '';
          if (p.evasion) { dmg = 0; p.evasion = false; note = ' しかし完全回避により無効化！'; }
          p.hp -= dmg;
          const recoil = Math.floor(e.maxHp * 0.1);
          e.hp = Math.max(1, e.hp - recoil);
          return `【捨て身の一撃】${note || ` ${dmg} の大ダメージ！`} 敵も反動で ${recoil} のダメージを負った`;
        }
        if (enemyHasSkill('PIERCE_SHOT') && newState.turn >= 2) {
          useEnemySkill('PIERCE_SHOT');
          let dmg = Math.min(Math.floor((e.atk || 0) * 1.5), Math.floor(p.maxHp * 0.7));
          let note = '';
          if (p.evasion) { dmg = 0; p.evasion = false; note = ' しかし完全回避により無効化！'; }
          p.hp -= dmg;
          return `【貫通射撃】防御を無視して撃ち抜いてきた！${note || ` ${dmg} のダメージ！`}`;
        }
        if (enemyHasSkill('BLAST_ROUND') && Math.abs(e.pos - p.pos) <= 2) {
          useEnemySkill('BLAST_ROUND');
          let dmg = Math.min(Math.floor((e.atk || 0) * 1.2), Math.floor(p.maxHp * 0.6));
          let note = '';
          if (p.evasion) { dmg = 0; p.evasion = false; note = ' しかし完全回避により無効化！'; }
          p.hp -= dmg;
          // プレイヤーを吹き飛ばす
          const kd = p.pos >= e.pos ? 1 : -1;
          const kp = p.pos + kd;
          let kbNote = '';
          if (kp >= 1 && kp <= getFieldCols() && getEffectiveTerrain(kp, p.lane, newState.revealedTreesP) !== 'WALL') {
            p.pos = kp;
            if ((p.height || 0) < 2) p.height = getTerrainHeight(getTerrain(p.pos, p.lane));
            kbNote = ' 吹き飛ばされた！';
          }
          return `【爆裂弾】${note || ` ${dmg} のダメージ！`}${kbNote}`;
        }
        if (enemyHasSkill('BURN_SHOT') && newState.turn >= 2) {
          useEnemySkill('BURN_SHOT');
          p.burnTurns = 3;
          p.burnDamage = Math.floor((e.atk || 0) * 0.8);
          return `【焼夷弾】こちらが炎上した！(3ターンの間、毎ターン${p.burnDamage}ダメージ)`;
        }
        if (enemyHasSkill('LOCK_MOVE') && newState.turn >= 2) {
          useEnemySkill('LOCK_MOVE'); p.lockMoveTurns = 1;
          return `【移動封鎖】足を止められた！ 次のターン移動できない！`;
        }
        if (enemyHasSkill('LOCK_ATTACK') && newState.turn >= 2) {
          useEnemySkill('LOCK_ATTACK'); p.lockAttackTurns = 1;
          return `【武装凍結】武器が凍りついた！ 次のターン攻撃できない！`;
        }
