    setPhase('room');
    addLog(`[SYSTEM] ${t.name}でシステムを起動しました。`);
    addLog(`[SYSTEM] テスト用に「${PRESET_SWORD_SAMPLE.name}」を所持しています。CLOSETで装備してみてください。`);
  };

  const currentStats = () => {
    if (!fighter) return { hp: 0, atk: 0, def: 0, spd: 0, acc: 0, eva: 0, specials: [] };
    const base = TYPES[fighter.type];
    let eqHp = 0, eqAtk = 0, eqDef = 0, eqSpd = 0, eqAcc = 0, eqEva = 0;
    let specials = [];
    Object.values(equipped).forEach(itemId => {
      const item = inventory.find(i => i.id === itemId);
      if (item) {
        eqHp += item.hp || 0; eqAtk += item.atk || 0; eqDef += item.def || 0; eqSpd += item.spd || 0;
        eqAcc += item.acc || 0; eqEva += item.eva || 0;
        if (item.type === 'EX_CHIP' && item.modules) {
          item.modules.forEach(m => {
            eqHp += m.hp || 0; eqAtk += m.atk || 0; eqDef += m.def || 0; eqSpd += m.spd || 0;
            if (m.special) specials.push(m.special);
          });
        }
      }
    });
    const mult = getSyncMultiplier(syncRatio);
    return {
      hp: Math.floor((base.hp + eqHp) * mult),
      atk: Math.floor((base.atk + eqAtk) * mult),
      def: Math.floor((base.def + eqDef) * mult),
      spd: Math.floor((base.spd + eqSpd) * mult),
      acc: Math.floor(eqAcc * mult),
      eva: Math.floor(eqEva * mult),
      specials
    };
  };

  // 2-C TYPE選択画面。タイトルの次、ゲーム本編の前に挟まる独立した画面。
  if (phase === 'typeselect') {
    return (
      <TypeCatalog
        initialType={catalogType}
        slots={slots}
        onConfirm={startNewGame}
        onCancel={() => setPhase('title')}
      />
    );
  }

  if (phase === 'title') {
    return (
      <div className="flex flex-col items-center justify-center min-h-screen bg-black text-cyan-400 font-mono p-4">
        <div className="absolute inset-0 overflow-hidden pointer-events-none">
          <div className="absolute top-1/4 left-1/2 -translate-x-1/2 w-[600px] h-[600px] rounded-full opacity-5 blur-3xl" style={{ background: 'radial-gradient(circle, #06b6d4, transparent)' }}></div>
        </div>
        <h1 className="text-6xl md:text-8xl font-black mb-2 tracking-[0.2em] text-transparent bg-clip-text" style={{ backgroundImage: 'linear-gradient(to right, #06b6d4, #3b82f6, #60a5fa)' }}>A-FIGHT</h1>
        <p className="text-sm mb-4 text-cyan-700 tracking-widest">OS V12.0.0 — Phase 6.0.1 LITE</p>
        <p className="text-xs mb-8 text-cyan-900 tracking-widest">ARENA OVERHAUL & Z-AXIS SYSTEM</p>

        {/* TYPE別セーブスロット。データがあれば「つづきから」、無ければ「新規開始」になる。
            これによりTYPEを問わず並行して進められる。 */}
        <div className="text-[10px] text-gray-600 tracking-widest mb-3">SAVE SLOT</div>
        <div className="flex flex-col gap-3 w-full max-w-sm">
          {SAVE_SLOTS.map(type => {
            const t = TYPES[type];
            const save = slots[type];
            const has = !!(save && save.fighter);
            return (
              <div key={type} className={`rounded-lg border transition-all ${has ? 'bg-cyan-950/40 border-cyan-700' : 'bg-gray-950 border-gray-800'}`}>
                <button
                  onClick={() => has ? handleContinue(type) : handleNewGame(type)}
                  className="w-full px-4 py-3 text-left hover:bg-white/5 rounded-lg transition-all"
                >
                  <div className="flex items-center justify-between mb-1">
                    <span className={`text-xs font-black ${t.color}`}>TYPE-{type}</span>
                    <span className={`text-[10px] font-black tracking-widest px-2 py-0.5 rounded ${has ? 'bg-cyan-900 text-cyan-200' : 'bg-gray-900 text-gray-600'}`}>
                      {has ? 'CONTINUE' : 'NEW GAME'}
                    </span>
                  </div>
                  <div className="text-sm text-gray-300">{(t.name.split('(')[1] || '').replace(')', '') || t.name}</div>
                  {has ? (
                    <>
                      <div className="text-[11px] text-cyan-400 mt-1">
                        {save.rank || 'G'}ランク / {save.materials}G / 装備{(save.inventory || []).length}点
                      </div>
                      <div className="text-[10px] text-cyan-800">{save.savedAt}</div>
                    </>
                  ) : (
                    <div className="text-[10px] text-gray-600 mt-1">HP:{t.hp} ATK:{t.atk} DEF:{t.def} SPD:{t.spd}</div>
                  )}
                </button>
                {has && (
                  <div className="px-4 pb-2 flex justify-end">
                    <button
                      onClick={() => {
                        if (confirmDelete === type) { handleDeleteSlot(type); setConfirmDelete(null); }
                        else setConfirmDelete(type);
                      }}
                      className={`text-[10px] px-2 py-0.5 rounded border transition-all ${
                        confirmDelete === type
                          ? 'bg-red-900 border-red-500 text-red-200 font-bold'
                          : 'border-gray-700 text-gray-600 hover:border-red-800 hover:text-red-400'
                      }`}
                    >
                      {confirmDelete === type ? '本当に削除する?' : 'データを消す'}
                    </button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  return (
    <div className="flex flex-col min-h-screen bg-gray-950 text-cyan-400 font-mono p-2 md:p-4 max-w-5xl mx-auto transition-colors duration-1000">
      <div className="flex justify-between items-center bg-gray-900/80 p-3 rounded-lg border border-cyan-800 mb-4">
        <div className="font-black tracking-widest text-white">
          {fighter ? TYPES[fighter.type].name.split(' ')[0] : 'GUEST'}
        </div>
        <div className="flex gap-3 items-center text-sm font-bold">
          <button
            onClick={handleSave}
            disabled={!fighter}
            className={`text-[10px] font-black tracking-widest px-2 py-1 rounded border transition-all duration-200 disabled:opacity-30 disabled:cursor-not-allowed ${
              saveFlash
                ? 'bg-green-900/60 border-green-500 text-green-300 shadow-[0_0_8px_rgba(34,197,94,0.5)]'
                : 'bg-transparent border-gray-700 text-gray-500 hover:border-cyan-700 hover:text-cyan-400'
            }`}
          >
            {saveFlash ? '✓ SAVED' : 'SAVE'}
          </button>
          {/* ロード:直前のセーブ地点まで巻き戻す。誤操作を防ぐため2度押しで実行する */}
          <button
            onClick={() => {
              if (confirmLoad) { handleLoad(); setConfirmLoad(false); }
              else { setConfirmLoad(true); setTimeout(() => setConfirmLoad(false), 3000); }
            }}
            disabled={!fighter || phase === 'arena'}
            className={`text-[10px] font-black tracking-widest px-2 py-1 rounded border transition-all duration-200 disabled:opacity-30 disabled:cursor-not-allowed ${
              confirmLoad
                ? 'bg-amber-900/60 border-amber-500 text-amber-200'
                : 'bg-transparent border-gray-700 text-gray-500 hover:border-amber-700 hover:text-amber-400'
            }`}
          >
            {confirmLoad ? 'ロードする?' : 'LOAD'}
          </button>
          {/* タイトルへ戻る:未保存の内容は失われるため2度押しで実行する */}
          <button
            onClick={() => {
              if (confirmTitle) { handleReturnToTitle(); setConfirmTitle(false); }
              else { setConfirmTitle(true); setTimeout(() => setConfirmTitle(false), 3000); }
            }}
            disabled={phase === 'arena'}
            className={`text-[10px] font-black tracking-widest px-2 py-1 rounded border transition-all duration-200 disabled:opacity-30 disabled:cursor-not-allowed ${
              confirmTitle
                ? 'bg-red-900/60 border-red-500 text-red-200'
                : 'bg-transparent border-gray-700 text-gray-500 hover:border-red-700 hover:text-red-400'
            }`}
          >
            {confirmTitle ? '戻る?(未保存は消える)' : 'TITLE'}
          </button>
          <span className="flex items-center gap-1">
            <IconZap size={16} className="text-yellow-400" />
            {/* 現在値 / 上限。段階1では常に一致する */}
            <span className="text-white">{syncRatio}%</span>
            <span className="text-[10px] text-gray-600">/{syncMax}</span>
          </span>
          <span className="flex items-center gap-1">
            <IconBattery size={16} className="text-green-500" />
            <span className="text-white">{materials}G</span>
          </span>
          <span className={`flex items-center gap-1 px-2 py-0.5 rounded border ${rank === 'S' ? 'border-amber-400 bg-gradient-to-r from-amber-950 to-fuchsia-950 shadow-[0_0_10px_rgba(251,191,36,0.35)]' : 'border-amber-700 bg-amber-950/40'}`}>
            <span className={`font-black text-xs ${rank === 'S' ? 'text-amber-300' : 'text-amber-400'}`}>{rank === 'S' ? '★S' : rank}</span>
            {getDisplayThreshold(rank) !== undefined && (
              <span className="text-amber-200 text-[10px]">{rankPoints}/{getDisplayThreshold(rank)}</span>
            )}
            {worldTournamentEligible && (rank === 'A' || rank === 'S') && <span className="text-fuchsia-300 text-[10px] font-bold">★挑戦権</span>}
          </span>
          <button
            onClick={toggleSfx}
            title={sfxOn ? 'ミュート' : 'ミュート解除'}
            className={`p-1 rounded border text-xs transition-colors ${
              sfxOn ? 'border-cyan-800 text-cyan-400 hover:bg-gray-800' : 'border-gray-700 text-gray-600 hover:bg-gray-800'
            }`}
          >
            {sfxOn ? '🔊' : '🔇'}
          </button>
        </div>
      </div>

      <div className="flex items-center gap-4 mb-4 pb-2 border-b border-cyan-900">
        {phase !== 'room' && (
          <button onClick={() => setPhase('room')} className="p-2 bg-gray-900 border rounded hover:bg-gray-800 border-gray-700">
            <IconArrowLeft size={20} />
          </button>
        )}
        <h2 className="text-xl font-black uppercase tracking-widest text-cyan-300">
          {phase.replace('_', ' ')}
        </h2>
      </div>

      <div className="flex-grow flex flex-col overflow-hidden">
        {phase === 'room' && <MasterRoom setPhase={setPhase} fighter={fighter} syncRatio={syncRatio} syncMax={syncMax} stats={currentStats()} inventory={inventory} equipped={equipped} />}
        {phase === 'closet' && <Closet inventory={inventory} setInventory={setInventory} equipped={equipped} setEquipped={setEquipped} stats={currentStats()} fighter={fighter} addLog={addLog} setPhase={setPhase} setMaterials={setMaterials} />}
        {phase === 'generator' && <Generator materials={materials} setMaterials={setMaterials} inventory={inventory} setInventory={setInventory} addLog={addLog} />}
        {phase === 'arena' && <ArenaBattle stats={currentStats()} setPhase={setPhase} addLog={addLog} materials={materials} setMaterials={setMaterials} setInventory={setInventory} inventory={inventory} equipped={equipped} rank={rank} rankPoints={rankPoints} worldTournamentEligible={worldTournamentEligible} addRankPoints={addRankPoints} winWorldTournament={winWorldTournament} resetWorldTournamentEligibility={resetWorldTournamentEligibility} defenseAvailable={defenseAvailable} loseDefense={loseDefense} setActiveEnemy={setActiveEnemy} />}
      </div>

      {/* 下部パネル:戦闘中は敵データ、それ以外は通常のシステムログを表示する。
          戦闘中の全体ログはほぼ流れないため、限られた画面を敵の情報に充てている。
          所持武装の名前と射程は「ARMS」欄に一覧表示済み(v1.28.0)。
          残弾とHEATは表示しない方針(戦闘ログで分かるため)。 */}
      {activeEnemy ? (
        <div className="mt-4 border border-red-900 bg-gray-950 p-3 h-28 overflow-y-auto text-xs rounded-lg shadow-inner">
          <div className="flex items-center justify-between mb-1.5 pb-1 border-b border-red-900/50">
            <span className="text-red-400 font-bold tracking-widest text-[10px]">ENEMY DATA</span>
            <span className={`text-[11px] font-bold ${activeEnemy.isOopa ? 'text-fuchsia-300' : activeEnemy.isRival ? 'text-fuchsia-400' : 'text-red-300'}`}>
              {activeEnemy.isRival && '★ '}{activeEnemy.name}
            </span>
          </div>
          <div className="grid grid-cols-5 gap-x-2 gap-y-1 text-[10px] mb-1">
            <div><span className="text-gray-500">HP </span><span className="text-white">{activeEnemy.hp}/{activeEnemy.maxHp}</span></div>
            <div><span className="text-gray-500">ATK </span><span className="text-white">{activeEnemy.atk}</span></div>
            <div><span className="text-gray-500">DEF </span><span className="text-white">{activeEnemy.def}</span></div>
            <div><span className="text-gray-500">SPD </span><span className="text-white">{activeEnemy.spd}</span></div>
            {/* 交互行動制では敵の残APが「あと何手番動けるか」を示す重要な情報になる */}
            <div><span className="text-gray-500">AP </span><span className="text-blue-300 font-bold">{activeEnemy.ap ?? 0}</span></div>
          </div>
          {/* HPバー:数値だけだと残量が掴みにくいので視覚化する */}
          <div className="h-1.5 bg-gray-900 rounded overflow-hidden mb-1.5 border border-gray-800">
            <div
              className={`h-full transition-all duration-300 ${
                activeEnemy.hp / activeEnemy.maxHp > 0.5 ? 'bg-red-600'
                : activeEnemy.hp / activeEnemy.maxHp > 0.25 ? 'bg-orange-500' : 'bg-yellow-400'
              }`}
              style={{ width: `${Math.max(0, (activeEnemy.hp / activeEnemy.maxHp) * 100)}%` }}
            ></div>
          </div>
          {/* アーキタイプごとの戦い方を明示する(何をしてくる相手か分かるように) */}
          {activeEnemy.archetype && ENEMY_ARCHETYPES[activeEnemy.archetype] && (
            <div className="text-[10px] mb-1.5">
              <span className="text-amber-400 font-bold">{ENEMY_ARCHETYPES[activeEnemy.archetype].name}</span>
              <span className="text-gray-400 ml-1">
                {{
                  ATTACKER: '常に接近して殴ってくる。防御はほぼしない',
                  TANK: '前に出て粘る。早めに防御を固める',
                  EVASION: '距離を取って戦う。近づくと離れる/レーンをずらす',
                  AIM: '射線を作ることを最優先。レーンを合わせてくる',
                }[activeEnemy.archetype]}
              </span>
            </div>
          )}
          {/* 所持武装。射程だけを見せる(残弾やHEATは表示しない方針。戦闘ログで分かる) */}
          {(activeEnemy.weapons || []).length > 0 && (
            <div className="flex flex-wrap gap-1 items-center mb-1">
              <span className="text-[10px] text-gray-500 shrink-0">ARMS</span>
              {activeEnemy.weapons.map((w, i) => (
                <span key={i} className="text-[9px] px-1 rounded border bg-red-950/40 text-red-200 border-red-800">
                  {w.name}<span className="text-red-400">[{w.range}]</span>
                </span>
              ))}
            </div>
          )}
          {/* 所持スキル(未使用/使用済み)。何が飛んでくるか事前に読めるようにする */}
          {(activeEnemy.skills || []).length > 0 && (
            <div className="flex flex-wrap gap-1 items-center">
              <span className="text-[10px] text-gray-500 shrink-0">SKILL</span>
              {activeEnemy.skills.map(sk => {
                const used = (activeEnemy.usedSkills || []).includes(sk);
                const label = OOPA_SKILL_NAMES[sk] || ENEMY_SKILL_NAMES[sk] || sk;
                return (
                  <span key={sk} className={`text-[9px] px-1 rounded border ${used ? 'bg-gray-900 text-gray-600 border-gray-800' : 'bg-pink-950/50 text-pink-300 border-pink-800'}`}>
                    {label}{used && '(済)'}
                  </span>
                );
              })}
            </div>
          )}
          {/* 現在かかっている状態 */}
          {(activeEnemy.limiterActive || activeEnemy.evasion || activeEnemy.shieldActive || activeEnemy.nextCrit || (activeEnemy.height || 0) >= 2 || (activeEnemy.repairTurns || 0) > 0 || (activeEnemy.stunTurns || 0) > 0 || (activeEnemy.noAttackTurns || 0) > 0 || (activeEnemy.lockMoveTurns || 0) > 0 || (activeEnemy.lockAttackTurns || 0) > 0 || (activeEnemy.sealSkillTurns || 0) > 0 || (activeEnemy.gravityTurns || 0) > 0 || (activeEnemy.burnTurns || 0) > 0) && (
            <div className="flex flex-wrap gap-1 items-center mt-1">
              <span className="text-[10px] text-gray-500 shrink-0">STATE</span>
              {activeEnemy.limiterActive && <span className="text-[9px] px-1 rounded bg-fuchsia-900 text-fuchsia-200 border border-fuchsia-600">リミッター解除{activeEnemy.limiterTurnsLeft}T</span>}
              {activeEnemy.evasion && <span className="text-[9px] px-1 rounded bg-yellow-900 text-yellow-200 border border-yellow-600">回避構え</span>}
              {activeEnemy.shieldActive && <span className="text-[9px] px-1 rounded bg-purple-900 text-purple-200 border border-purple-600">防壁</span>}
              {activeEnemy.nextCrit && <span className="text-[9px] px-1 rounded bg-orange-900 text-orange-200 border border-orange-600">狙撃準備</span>}
              {(activeEnemy.repairTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-green-900 text-green-200 border border-green-600">自己修復{activeEnemy.repairTurns}T</span>}
              {(activeEnemy.lockMoveTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-red-900 text-red-200 border border-red-600">移動封鎖</span>}
              {(activeEnemy.lockAttackTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-red-900 text-red-200 border border-red-600">武装凍結</span>}
              {(activeEnemy.sealSkillTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-red-900 text-red-200 border border-red-600">スキル封印</span>}
              {(activeEnemy.gravityTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-indigo-900 text-indigo-200 border border-indigo-500">重力異常</span>}
              {(activeEnemy.burnTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-orange-900 text-orange-200 border border-orange-500">炎上{activeEnemy.burnTurns}T</span>}
              {(activeEnemy.stunTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-gray-800 text-gray-300 border border-gray-600">反動で行動不能{activeEnemy.stunTurns}T</span>}
              {(activeEnemy.noAttackTurns || 0) > 0 && <span className="text-[9px] px-1 rounded bg-gray-800 text-gray-300 border border-gray-600">再装填中{activeEnemy.noAttackTurns}T</span>}
            </div>
          )}
        </div>
      ) : (
        <div className="mt-4 border border-cyan-900 bg-gray-950 p-3 h-28 overflow-y-auto text-xs rounded-lg shadow-inner text-green-400">
          {logs.length === 0 && <div className="text-gray-700 italic">システムログ...</div>}
          {logs.map((log, i) => <div key={i} className="mb-1 leading-relaxed opacity-90">{log}</div>)}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
